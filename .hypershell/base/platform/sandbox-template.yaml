# Reusable slim sandbox execution environment with a basic network policy:
# egress only to the Anthropic inference API and the GitHub API. The supervisor
# egress proxy injects the provider credential for the allowed binary, so the
# sandbox reaches the real upstream host directly (there is no inference.local
# virtual host in current OpenShell). policy is a JSON-encoded SandboxPolicy.
apiVersion: hypershell.redhat.io/v1
kind: SandboxTemplate
metadata:
  name: agent-runtime-slim
  description: Lightweight agent sandbox with a basic egress-restricted network policy
spec:
  image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-agent-runtime-slim-main@sha256:0b22e22656c2bf9c60511a154ae71399be3324c6478baa8e155aa953489fc103
  name_prefix: hypershell-agent-slim-
  policy: |
    {
      "filesystem": {
        "read_only": ["/usr", "/etc"],
        "read_write": ["/sandbox", "/tmp", "/home/agent"],
        "landlock": "best_effort"
      },
      "network": [
        {"name": "claude_code", "hosts": ["api.anthropic.com:443"], "binaries": ["claude"]},
        {"name": "github_rest_api", "hosts": ["api.github.com:443", "github.com:443"], "binaries": ["gh", "git"]}
      ],
      "process": {"user": "agent", "group": "root"}
    }
---
# agent-runtime-slim plus read-only access to the public Quay tag API. Used only
# by update-openshell, which must resolve image tags to manifest digests. Only
# python3 may reach quay.io, and only with GET/HEAD on the v1 API (the tag API
# returns the digest in its JSON body, so no image layers are downloaded). No
# credential is involved: every repository it reads is public. python3 can resolve
# to python3.14 in the hi/python:3.14 base image, so both names are
# listed; update python3.14 when the image moves to a new Python minor.
#
# name_prefix must not start with agent-runtime-slim's prefix
# (hypershell-agent-slim-): stale-sandbox cleanup matches by prefix, so a shared
# prefix would let one template's cleanup delete the other's sandboxes.
apiVersion: hypershell.redhat.io/v1
kind: SandboxTemplate
metadata:
  name: agent-runtime-slim-quay
  description: Slim agent sandbox with the basic network policy plus read-only Quay tag API access
spec:
  image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-agent-runtime-slim-main@sha256:0b22e22656c2bf9c60511a154ae71399be3324c6478baa8e155aa953489fc103
  name_prefix: hypershell-agent-quay-
  policy: |
    {
      "filesystem": {
        "read_only": ["/usr", "/etc"],
        "read_write": ["/sandbox", "/tmp", "/home/agent"],
        "landlock": "best_effort"
      },
      "network": [
        {"name": "claude_code", "hosts": ["api.anthropic.com:443"], "binaries": ["claude"]},
        {"name": "github_rest_api", "hosts": ["api.github.com:443", "github.com:443"], "binaries": ["gh", "git"]},
        {"name": "quay_tag_api", "hosts": ["quay.io:443"], "methods": ["GET", "HEAD"], "paths": ["/api/v1/repository/"], "binaries": ["python3", "python3.14"]}
      ],
      "process": {"user": "agent", "group": "root"}
    }
