# The basic agent: one complete AgentRuntime with the full set of declared
# HyperShell ext-API objects, usable directly with `hsctl apply -k .hypershell/base`.
# It uses the slim runtime and the platform's basic network policy. No cluster
# information: placement is resolved by the control plane via capability labels.
# FK references use names; the importer resolves them (see ../README.md).
apiVersion: hypershell.redhat.io/v1
kind: AgentRuntime
metadata:
  name: basic-agent
  description: Reference basic agent (slim runtime, basic network policy)
spec:
  sandbox_template_id: agent-runtime-slim
  gateway_id: agents-gateway
  repository_id: openshift-online/hypershell
  cron: "*/15 * * * *"
  coordinator_image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-agent-runtime-slim-main@sha256:0b22e22656c2bf9c60511a154ae71399be3324c6478baa8e155aa953489fc103
  concurrency_policy: Forbid
  login_refresh_seconds: 1800
  parameters: |
    {"REPOSITORY": "openshift-online/hypershell", "DRY_RUN": "false"}
---
# Credentials owned by this runtime (agent_runtime_id = runtime name).
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: basic-agent-gateway-identity
spec:
  agent_runtime_id: basic-agent
  purpose: gateway-identity
  backend: kubernetes
  path: hypershell/basic-agent/gateway-identity
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: basic-agent-inference-key
spec:
  agent_runtime_id: basic-agent
  purpose: service-account-key
  backend: vault
  path: hypershell/basic-agent/vertex-service-account
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: basic-agent-github-key
spec:
  agent_runtime_id: basic-agent
  purpose: app-private-key
  backend: vault
  path: hypershell/basic-agent/github-app
---
# Provider bindings wire the shared ProviderSpecs into this runtime's workspace
# (workspace_id = runtime name; the importer maps runtime -> its workspace).
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: basic-agent-inference
spec:
  workspace_id: basic-agent
  provider_spec_id: claude-inference
  secret_source_id: basic-agent-inference-key
  refresh_strategy: |
    {"type": "service-account-jwt", "material": {"client_email": "REPLACE_WITH_SA_EMAIL"}, "secret_material": [{"key": "private_key", "secret_source_id": "basic-agent-inference-key"}]}
---
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: basic-agent-github
spec:
  workspace_id: basic-agent
  provider_spec_id: github-source-control
  secret_source_id: basic-agent-github-key
  refresh_strategy: |
    {"type": "app-installation-token", "material": {"app_id": "REPLACE_WITH_GITHUB_APP_ID"}, "secret_material": [{"key": "private_key", "secret_source_id": "basic-agent-github-key"}]}
---
# Active LLM for this workspace (at most one InferenceRoute per workspace).
apiVersion: hypershell.redhat.io/v1
kind: InferenceRoute
metadata:
  name: basic-agent-inference-route
spec:
  workspace_id: basic-agent
  provider_binding_id: basic-agent-inference
  model: claude-sonnet-4-5
