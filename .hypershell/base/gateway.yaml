# Gateway the agent runtimes connect to (inference + workspace provisioning).
# Every AgentRuntime references this Gateway by name (gateway_id: agents-gateway)
# and shares its cluster. The base targets the local kind cluster; overlays
# repoint cluster_id and set environment-specific exposure (see ../overlays/).
#
# namespace is omitted on purpose: the API server assigns an immutable
# namespace at creation (see specs/platform/data-model.spec.md).
apiVersion: hypershell.redhat.io/v1
kind: Gateway
metadata:
  name: agents-gateway
  description: Shared gateway for HyperShell SDLC automation agents
spec:
  cluster_id: local-kind
  tls_mode: edge
  service_type: LoadBalancer
