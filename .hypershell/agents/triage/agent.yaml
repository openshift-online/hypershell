# triage agent instance (overlay on ../../base/platform).
# Repository scanner: on each cron tick the coordinator queries the referenced
# Repository for items carrying any selector label and fans out one sandbox per match.
# Ext-API kinds only; no cluster information (placement is resolved by the
# control plane via capability labels). FK references use names; the importer
# resolves them (see ../../README.md).
apiVersion: hypershell.redhat.io/v1
kind: AgentRuntime
metadata:
  name: triage
  description: SDLC automation agent (triage)
spec:
  sandbox_template_id: agent-runtime-slim
  gateway_id: agents-gateway
  repository_id: openshift-online/hypershell
  cron: "*/10 * * * *"
  coordinator_image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-agent-runtime-slim-main@sha256:0b22e22656c2bf9c60511a154ae71399be3324c6478baa8e155aa953489fc103
  concurrency_policy: Forbid
  login_refresh_seconds: 1800
  selector:
    - agent/allowed
  parameters: |
    {"REPOSITORY": "openshift-online/hypershell", "DRY_RUN": "false"}
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: triage-gateway-identity
spec:
  agent_runtime_id: triage
  purpose: gateway-identity
  backend: kubernetes
  path: hypershell/triage/gateway-identity
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: triage-inference-key
spec:
  agent_runtime_id: triage
  purpose: api-key
  backend: vault
  path: hypershell/triage/anthropic-api-key
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: triage-github-key
spec:
  agent_runtime_id: triage
  purpose: app-private-key
  backend: vault
  path: hypershell/triage/github-app
---
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: triage-inference
spec:
  workspace_id: triage
  provider_spec_id: claude-inference
  secret_source_id: triage-inference-key
  refresh_strategy: |
    {"type": "static-token", "secret_material": [{"key": "api_key", "secret_source_id": "triage-inference-key"}]}
---
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: triage-github
spec:
  workspace_id: triage
  provider_spec_id: github-source-control
  secret_source_id: triage-github-key
  refresh_strategy: |
    {"type": "app-installation-token", "material": {"app_id": "REPLACE_WITH_GITHUB_APP_ID"}, "secret_material": [{"key": "private_key", "secret_source_id": "triage-github-key"}]}
---
apiVersion: hypershell.redhat.io/v1
kind: InferenceRoute
metadata:
  name: triage-inference-route
spec:
  workspace_id: triage
  provider_binding_id: triage-inference
  model: claude-sonnet-4-5
