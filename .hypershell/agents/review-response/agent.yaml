# review-response agent instance (overlay on ../../base/platform).
# Repository scanner: on each cron tick the coordinator queries the referenced
# Repository for items carrying any selector label and fans out one sandbox per match.
# Ext-API kinds only; no cluster information (placement is resolved by the
# control plane via capability labels). FK references use names; the importer
# resolves them (see ../../README.md).
apiVersion: hypershell.redhat.io/v1
kind: AgentRuntime
metadata:
  name: review-response
  description: SDLC automation agent (review-response)
spec:
  sandbox_template_id: agent-runtime-slim
  gateway_id: agents-gateway
  repository_id: hypershell
  cron: "*/10 * * * *"
  coordinator_image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-agent-runtime-slim-main:latest
  concurrency_policy: Forbid
  login_refresh_seconds: 1800
  selector:
    - agent/needs-review-response
  parameters: |
    {"REPOSITORY": "openshift-online/hypershell", "DRY_RUN": "false"}
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: review-response-gateway-identity
spec:
  agent_runtime_id: review-response
  purpose: gateway-identity
  backend: kubernetes
  path: hypershell/review-response/gateway-identity
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: review-response-inference-key
spec:
  agent_runtime_id: review-response
  purpose: service-account-key
  backend: vault
  path: hypershell/review-response/vertex-service-account
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: review-response-github-key
spec:
  agent_runtime_id: review-response
  purpose: app-private-key
  backend: vault
  path: hypershell/review-response/github-app
---
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: review-response-inference
spec:
  workspace_id: review-response
  provider_spec_id: claude-inference
  secret_source_id: review-response-inference-key
  refresh_strategy: |
    {"type": "service-account-jwt", "material": {"client_email": "REPLACE_WITH_SA_EMAIL"}, "secret_material": [{"key": "private_key", "secret_source_id": "review-response-inference-key"}]}
---
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: review-response-github
spec:
  workspace_id: review-response
  provider_spec_id: github-source-control
  secret_source_id: review-response-github-key
  refresh_strategy: |
    {"type": "app-installation-token", "material": {"app_id": "REPLACE_WITH_GITHUB_APP_ID"}, "secret_material": [{"key": "private_key", "secret_source_id": "review-response-github-key"}]}
---
apiVersion: hypershell.redhat.io/v1
kind: InferenceRoute
metadata:
  name: review-response-inference-route
spec:
  workspace_id: review-response
  provider_binding_id: review-response-inference
  model: claude-sonnet-4-5
