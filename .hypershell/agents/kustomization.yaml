apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full agent composition: shared base once, plus every agent's AgentRuntime and
# workspace wiring. Referenced by the .hypershell root import and by each
# environment overlay under ../overlays/. The per-agent kustomization.yaml files
# are separate standalone entry points and are intentionally not listed here, so
# base stays single-sourced.
resources:
  - ../base
  - triage/agent.yaml
  - spec-implementation/agent.yaml
  - spec-review/agent.yaml
  - code-implementation/agent.yaml
  - code-review/agent.yaml
  - review-response/agent.yaml
  - release-verification/agent.yaml
  - update-openshell/agent.yaml
