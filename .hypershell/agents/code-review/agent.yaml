# code-review agent runtime (declarative; replaces discover.sh/run.sh).
# # Repository scanner: on each cron tick the coordinator queries the
# referenced Repository for items carrying any selector label and fans
# out one sandbox per match.
# FK references use names; the importer resolves them (see ../../README.md).
# cluster_id/gateway_id carry base (kind) defaults; an overlay patches them
# per environment (see ../../overlays/).
apiVersion: hypershell.redhat.io/v1
kind: AgentRuntime
metadata:
  name: code-review
  description: SDLC automation agent (code-review)
spec:
  cluster_id: local-kind
  gateway_id: agents-gateway
  sandbox_template_id: agent-runtime
  repository_id: hypershell
  cron: "*/10 * * * *"
  coordinator_image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-agent-runtime-slim-main:latest
  concurrency_policy: Forbid
  login_refresh_seconds: 1800
  selector:
    - agent/reviewable-code
  parameters: |
    {"REPOSITORY": "openshift-online/hypershell", "DRY_RUN": "false"}
---
# Credentials owned by this runtime (agent_runtime_id = runtime name).
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: code-review-gateway-identity
spec:
  agent_runtime_id: code-review
  purpose: gateway-identity
  backend: kubernetes
  path: hypershell/code-review/gateway-identity
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: code-review-inference-key
spec:
  agent_runtime_id: code-review
  purpose: service-account-key
  backend: vault
  path: hypershell/code-review/vertex-service-account
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: code-review-github-key
spec:
  agent_runtime_id: code-review
  purpose: app-private-key
  backend: vault
  path: hypershell/code-review/github-app
---
# Provider bindings wire the shared ProviderSpecs into this runtime's workspace
# (workspace_id = runtime name; the importer maps runtime -> its workspace).
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: code-review-inference
spec:
  workspace_id: code-review
  provider_spec_id: claude-inference
  secret_source_id: code-review-inference-key
  refresh_strategy: |
    {"type": "service-account-jwt", "material": {"client_email": "REPLACE_WITH_SA_EMAIL"}, "secret_material": [{"key": "private_key", "secret_source_id": "code-review-inference-key"}]}
---
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: code-review-github
spec:
  workspace_id: code-review
  provider_spec_id: github-source-control
  secret_source_id: code-review-github-key
  refresh_strategy: |
    {"type": "app-installation-token", "material": {"app_id": "REPLACE_WITH_GITHUB_APP_ID"}, "secret_material": [{"key": "private_key", "secret_source_id": "code-review-github-key"}]}
---
# Active LLM for this workspace (at most one InferenceRoute per workspace).
apiVersion: hypershell.redhat.io/v1
kind: InferenceRoute
metadata:
  name: code-review-inference-route
spec:
  workspace_id: code-review
  provider_binding_id: code-review-inference
  model: claude-sonnet-4-5
