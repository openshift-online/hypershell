# update-openshell agent runtime (declarative; replaces discover.sh/run.sh).
# # Scheduled runtime: runs on its cron with no repository scan.
# FK references use names; the importer resolves them (see ../../README.md).
# cluster_id/gateway_id carry base (kind) defaults; an overlay patches them
# per environment (see ../../overlays/).
apiVersion: hypershell.redhat.io/v1
kind: AgentRuntime
metadata:
  name: update-openshell
  description: SDLC automation agent (update-openshell)
spec:
  cluster_id: local-kind
  gateway_id: agents-gateway
  sandbox_template_id: agent-runtime-slim
  repository_id: hypershell
  cron: "0 6 * * 1"
  coordinator_image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-agent-runtime-slim-main:latest
  concurrency_policy: Forbid
  login_refresh_seconds: 1800
  # selector omitted: this runtime is purely scheduled (cron), not a repository scanner.
  parameters: |
    {"REPOSITORY": "openshift-online/hypershell", "DRY_RUN": "false"}
---
# Credentials owned by this runtime (agent_runtime_id = runtime name).
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: update-openshell-gateway-identity
spec:
  agent_runtime_id: update-openshell
  purpose: gateway-identity
  backend: kubernetes
  path: hypershell/update-openshell/gateway-identity
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: update-openshell-inference-key
spec:
  agent_runtime_id: update-openshell
  purpose: service-account-key
  backend: vault
  path: hypershell/update-openshell/vertex-service-account
---
apiVersion: hypershell.redhat.io/v1
kind: SecretSource
metadata:
  name: update-openshell-github-key
spec:
  agent_runtime_id: update-openshell
  purpose: app-private-key
  backend: vault
  path: hypershell/update-openshell/github-app
---
# Provider bindings wire the shared ProviderSpecs into this runtime's workspace
# (workspace_id = runtime name; the importer maps runtime -> its workspace).
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: update-openshell-inference
spec:
  workspace_id: update-openshell
  provider_spec_id: claude-inference
  secret_source_id: update-openshell-inference-key
  refresh_strategy: |
    {"type": "service-account-jwt", "material": {"client_email": "REPLACE_WITH_SA_EMAIL"}, "secret_material": [{"key": "private_key", "secret_source_id": "update-openshell-inference-key"}]}
---
apiVersion: hypershell.redhat.io/v1
kind: ProviderBinding
metadata:
  name: update-openshell-github
spec:
  workspace_id: update-openshell
  provider_spec_id: github-source-control
  secret_source_id: update-openshell-github-key
  refresh_strategy: |
    {"type": "app-installation-token", "material": {"app_id": "REPLACE_WITH_GITHUB_APP_ID"}, "secret_material": [{"key": "private_key", "secret_source_id": "update-openshell-github-key"}]}
---
# Active LLM for this workspace (at most one InferenceRoute per workspace).
apiVersion: hypershell.redhat.io/v1
kind: InferenceRoute
metadata:
  name: update-openshell-inference-route
spec:
  workspace_id: update-openshell
  provider_binding_id: update-openshell-inference
  model: claude-sonnet-4-5
