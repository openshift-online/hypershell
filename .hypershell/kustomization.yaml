apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Root import: the full agent fleet. The server-side import process
# (Repository.import_path) builds this and reconciles the rendered ext-API
# resources into the API. Shared platform kinds come from base/platform once;
# each agent under agents/ contributes its own instance.
#
# base/ (the standalone basic agent) is intentionally not included here; apply
# it directly with `hsctl apply -k .hypershell/base`.
resources:
  - base/platform
  - agents/triage/agent.yaml
  - agents/spec-implementation/agent.yaml
  - agents/spec-review/agent.yaml
  - agents/code-implementation/agent.yaml
  - agents/code-review/agent.yaml
  - agents/review-response/agent.yaml
  - agents/release-verification/agent.yaml
  - agents/jira-reconciliation/agent.yaml
  - agents/update-openshell/agent.yaml
