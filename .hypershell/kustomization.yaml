apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Root kustomization for the declarative .hypershell import. The server-side
# import process (Repository.import_path) builds this and reconciles the
# rendered HyperShell resources into the API. This is the base (kind) dev
# composition; environment-specific values are applied by the overlays under
# overlays/ (e.g. overlays/hypc-ibm-00).
resources:
  - agents
