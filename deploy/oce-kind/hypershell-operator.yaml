apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-api-server
  namespace: hypershell-system
spec:
  template:
    spec:
      containers:
        - name: api-server
          env:
            - name: GATEWAY_DEFAULT_WORKSPACE_MODE
              value: operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-controller
  namespace: hypershell-system
spec:
  template:
    spec:
      containers:
        - name: controller
          env:
            - name: GATEWAY_OPERATOR_WORKSPACE
              value: '{"namespaceLabelKey":"hypershell.io/gateway","allowedPodLabels":["openclaw.dev/*","app.kubernetes.io/name","app.kubernetes.io/managed-by"]}'
            - name: GATEWAY_SANDBOX_RUNTIME_CLASS
              value: openshell-sandbox
