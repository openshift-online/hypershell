# The sandbox controller creates Pods; the gateway releases their scheduling gates.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: oce-openshell-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: openshell-runtime
      expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'openshell-sandbox'
  validations:
    - expression: request.userInfo.username == 'system:serviceaccount:agent-sandbox-system:agent-sandbox-controller' || (request.operation == 'UPDATE' && request.userInfo.username == 'system:serviceaccount:__GATEWAY_NAMESPACE__:openshell-gateway')
      message: Only the Agent Sandbox controller may create OpenShell workloads; the owning gateway may update them.
    - expression: has(namespaceObject.metadata.labels) && 'hypershell.io/gateway' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['hypershell.io/gateway'] == '__GATEWAY_NAMESPACE__'
      message: OpenShell workloads must belong to this gateway's operator namespace.
    - expression: (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) && (!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC) && (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath)))
      message: Host namespaces and hostPath volumes are prohibited.
    - expression: (!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0) && object.spec.containers.all(c, c.image in ['__RUNTIME_IMAGE__', '__SUPERVISOR_IMAGE__']) && (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image in ['__RUNTIME_IMAGE__', '__SUPERVISOR_IMAGE__'] || (c.name == 'openshell-sandbox-bootstrap' && c.image == '__SANDBOX_IMAGE__')))
      message: Only the installation's configured runtime, supervisor and sandbox bootstrap images are allowed.
    - expression: object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) && (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged))
      message: Privileged containers are prohibited.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: oce-openshell-runtime
spec:
  policyName: oce-openshell-runtime
  validationActions: [Deny]
