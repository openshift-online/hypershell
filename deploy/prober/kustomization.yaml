# Outside availability prober Kustomize base (OBS-PRB-11). hypershell-gitops
# consumes this base to deploy the prober on each instance hub (OBS-PRB-01),
# overlaying the environment-specific configuration: the instance namespace, the
# Keycloak token endpoint, the prober client id, the production instances, and the
# projected-token audience (the realm issuer URL). The base sets no namespace so
# each overlay places the prober in its instance namespace (OBS-PRB-11.03).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prober.yaml
