apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-server
  namespace: hypershell-system
spec:
  parentRefs:
    - name: hypershell-gw
      namespace: hypershell-system
  hostnames:
    - api.hypershell.localhost
  rules:
    - backendRefs:
        - name: hypershell-api-server
          port: 8000
---
