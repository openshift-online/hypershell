apiVersion: v1
kind: Secret
metadata:
  name: hypershell-cp-oidc
  namespace: hypershell-system
type: Opaque
stringData:
  # local-dev-only: throwaway value that must match the Keycloak realm import
  # for the Kind overlay. Never reuse it or reference this Secret from
  # deploy/base or deploy/openshift; production must supply a real secret.
  client-secret: control-plane-secret
---
# Keycloak Admin API credentials for per-gateway OIDC client provisioning
# (PR 98). Without this secret the control plane logs "keycloak integration
# disabled" and gateways receive no OIDC. Uses the realm's hypershell-provisioner
# service account (manage-clients). server-url is the in-cluster Keycloak; note
# this also becomes the gateway oidc issuer via keycloak.Client.Issuer().
apiVersion: v1
kind: Secret
metadata:
  name: hypershell-keycloak-admin
  namespace: hypershell-system
type: Opaque
stringData:
  server-url: http://keycloak-service.keycloak.svc.cluster.local:8080
  realm: hypershell
  client-id: hypershell-provisioner
  client-secret: provisioner-secret
