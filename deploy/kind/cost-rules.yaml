# Kind-only inputs for the cost dashboard (specs/web-console/cost-dashboard.spec.md).
# Production builds these four series on the hub from federated cluster
# metrics. Kind has one cluster and no federation, so these rules read the
# local kube-state-metrics directly and add a fixed cluster="kind" label. The
# series carry no provider label, so the rate card "defaults" price them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypershell-cost-inputs
  namespace: hypershell-system
  labels:
    hypershell.redhat.io/prometheus-rules: "true"
spec:
  groups:
    - name: hypershell-cost-inputs
      interval: 1m
      rules:
        - record: hypershell:cluster_cpu_allocatable:cores
          expr: label_replace(sum(kube_node_status_allocatable{resource="cpu"}), "cluster", "kind", "", "")
        - record: hypershell:cluster_memory_allocatable:bytes
          expr: label_replace(sum(kube_node_status_allocatable{resource="memory"}), "cluster", "kind", "", "")
        - record: hypershell:namespace_cpu_requests:cores
          expr: label_replace(sum by (namespace) (kube_pod_container_resource_requests{resource="cpu"}), "cluster", "kind", "", "")
        - record: hypershell:namespace_memory_requests:bytes
          expr: label_replace(sum by (namespace) (kube_pod_container_resource_requests{resource="memory"}), "cluster", "kind", "", "")
