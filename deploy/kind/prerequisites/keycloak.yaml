apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - start-dev
            - --import-realm
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: "http://keycloak.hypershell.localhost:8080"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: hypershell-theme
              mountPath: /opt/keycloak/themes/hypershell/login/theme.properties
              subPath: theme.properties
            - name: hypershell-theme
              mountPath: /opt/keycloak/themes/hypershell/login/resources/css/login.css
              subPath: login.css
            - name: hypershell-theme-logo
              mountPath: /opt/keycloak/themes/hypershell/login/resources/img/hypershell-logo.png
              subPath: hypershell-logo.png
            - name: hypershell-theme
              mountPath: /opt/keycloak/themes/hypershell/login/messages/messages_en.properties
              subPath: messages_en.properties
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm
        - name: hypershell-theme
          configMap:
            name: keycloak-hypershell-theme
        - name: hypershell-theme-logo
          configMap:
            name: keycloak-hypershell-theme-logo
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: keycloak
data:
  hypershell-realm.json: |
    {
      "realm": "hypershell",
      "enabled": true,
      "loginTheme": "hypershell",
      "registrationAllowed": false,
      "clients": [
        {
          "clientId": "hypershell-frontend",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "fullScopeAllowed": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "defaultClientScopes": ["openid", "email", "profile"],
          "protocolMappers": [
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "hypershell-frontend",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "claim.name": "groups",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "hypershell-provisioner",
          "enabled": true,
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "secret": "provisioner-secret"
        }
      ],
      "roles": {
        "realm": [
          { "name": "hypershell-admins", "description": "HyperShell administrators" },
          { "name": "hypershell-users", "description": "HyperShell users" }
        ]
      },
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "credentials": [{ "type": "password", "value": "admin", "temporary": false }],
          "realmRoles": ["hypershell-admins", "hypershell-users"]
        },
        {
          "username": "developer",
          "enabled": true,
          "credentials": [{ "type": "password", "value": "developer", "temporary": false }],
          "realmRoles": ["hypershell-users"]
        }
      ],
      "clientScopeMappings": {
        "hypershell-provisioner": [
          { "client": "realm-management", "roles": ["manage-clients", "manage-users"] }
        ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-hypershell-theme
  namespace: keycloak
data:
  theme.properties: |
    # CSS-only theme (no login.ftl) -- avoids Keycloak upgrade friction
    parent=keycloak.v2
    import=common/keycloak
    styles=css/login.css
  messages_en.properties: |
    loginTitleHtml=HyperShell
  login.css: |
    /* HyperShell Keycloak Login Theme -- light palette with interaction blue */

    @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;600;700&display=swap');

    .pf-v5-c-login,
    html.pf-v5-theme-dark .pf-v5-c-login {
      background-color: #f2f2f2 !important;
      background-image: none !important;
      height: 100vh !important;
      min-height: 0 !important;
      overflow: hidden !important;
    }

    .pf-v5-c-login__container {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      height: 100vh !important;
      min-height: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
      padding: 1rem !important;
      box-sizing: border-box !important;
      grid-template-columns: none !important;
      grid-template-areas: none !important;
    }

    #kc-header-wrapper {
      font-size: 0 !important;
      line-height: 0 !important;
      color: transparent !important;
      height: 0 !important;
      overflow: hidden !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .pf-v5-c-login__header {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
      width: auto !important;
      margin-bottom: 1.5rem !important;
      padding: 0 !important;
      grid-area: unset !important;
      order: -1 !important;
    }

    .pf-v5-c-login__header::before {
      content: "";
      display: block;
      width: 88px;
      height: 88px;
      background-image: url("../img/hypershell-logo.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      margin-bottom: 0.5rem;
    }

    .pf-v5-c-login__header::after {
      content: "HyperShell";
      display: block;
      color: #151515;
      font-size: 1.75rem;
      font-weight: 600;
      font-family: 'Red Hat Text', system-ui, -apple-system, sans-serif;
      letter-spacing: 0.01em;
    }

    .pf-v5-c-login__main {
      width: 100% !important;
      max-width: 400px !important;
      margin-left: auto !important;
      margin-right: auto !important;
      align-self: center !important;
      background-color: #ffffff !important;
      border: 1px solid #e0e0e0 !important;
      border-radius: 0.625rem !important;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08) !important;
      grid-area: unset !important;
    }

    .pf-v5-c-login__main-body { background-color: transparent; }
    .pf-v5-c-login__main-header { background-color: transparent; }

    .pf-v5-c-login__main-header h1,
    h1.pf-v5-c-title,
    h1.pf-v5-c-title.pf-m-3xl,
    #kc-page-title {
      color: #151515 !important;
      font-family: 'Red Hat Text', system-ui, -apple-system, sans-serif !important;
    }

    .pf-v5-c-form,
    .pf-v5-c-form-control,
    .pf-v5-c-form-control input,
    .pf-v5-c-button {
      font-family: 'Red Hat Text', system-ui, -apple-system, sans-serif !important;
    }

    .pf-v5-c-form-control {
      --pf-v5-c-form-control--BorderTopColor: #e0e0e0;
      --pf-v5-c-form-control--BorderRightColor: #e0e0e0;
      --pf-v5-c-form-control--BorderBottomColor: #e0e0e0;
      --pf-v5-c-form-control--BorderLeftColor: #e0e0e0;
      --pf-v5-c-form-control--hover--BorderBottomColor: #0066cc;
      --pf-v5-c-form-control--focus--BorderBottomColor: #0066cc;
      --pf-v5-c-form-control--m-expanded--BorderBottomColor: #0066cc;
      --pf-v5-c-form-control--BackgroundColor: #ffffff;
      --pf-v5-c-form-control--Color: #151515;
      --pf-v5-c-form-control--OutlineOffset: 0;
      --pf-v5-c-form-control--after--BorderBottomColor: #e0e0e0;
      --pf-v5-c-form-control--hover__after--BorderBottomColor: #0066cc;
      --pf-v5-c-form-control--focus__after--BorderBottomColor: #0066cc;
      background-color: #ffffff !important;
      border-color: #e0e0e0 !important;
      color: #151515 !important;
    }

    .pf-v5-c-form-control input {
      background-color: transparent !important;
      color: #151515 !important;
    }

    .pf-v5-c-form-control::after {
      border-bottom-color: #e0e0e0 !important;
      transition: border-bottom-color 0.2s ease;
    }

    .pf-v5-c-form-control:hover::after,
    .pf-v5-c-form-control:focus-within::after {
      border-bottom-color: #0066cc !important;
    }

    .pf-v5-c-form-control:focus-within,
    .pf-v5-c-form-control:focus {
      border-color: #0066cc !important;
      outline: none !important;
    }

    .pf-v5-c-form__label-text {
      color: #4d4d4d !important;
      font-family: 'Red Hat Text', system-ui, -apple-system, sans-serif !important;
    }

    .pf-v5-c-button.pf-m-primary {
      --pf-v5-c-button--m-primary--BackgroundColor: #0066cc;
      --pf-v5-c-button--m-primary--hover--BackgroundColor: #004d99;
      --pf-v5-c-button--m-primary--focus--BackgroundColor: #004d99;
      --pf-v5-c-button--m-primary--active--BackgroundColor: #004d99;
      background-color: #0066cc !important;
      border-color: #0066cc !important;
      color: #ffffff !important;
      border-radius: 50rem !important;
      font-family: 'Red Hat Text', system-ui, -apple-system, sans-serif !important;
    }

    .pf-v5-c-button.pf-m-primary:hover,
    .pf-v5-c-button.pf-m-primary:focus,
    .pf-v5-c-button.pf-m-primary:active {
      background-color: #004d99 !important;
      border-color: #004d99 !important;
    }

    .pf-v5-c-input-group__item + .pf-v5-c-input-group__item::before {
      border-left-color: #e0e0e0 !important;
    }

    .pf-v5-c-button.pf-m-control {
      --pf-v5-c-button--m-control--BackgroundColor: #ffffff;
      --pf-v5-c-button--m-control--hover--BackgroundColor: #ffffff;
      --pf-v5-c-button--m-control--focus--BackgroundColor: #ffffff;
      --pf-v5-c-button--m-control--active--BackgroundColor: #ffffff;
      --pf-v5-c-button--m-control--BorderColor: #e0e0e0;
      --pf-v5-c-button--m-control--after--BorderBottomColor: #e0e0e0;
      --pf-v5-c-button--m-control--hover--after--BorderBottomColor: #0066cc;
      --pf-v5-c-button--m-control--focus--after--BorderBottomColor: #0066cc;
      --pf-v5-c-button--m-control--active--after--BorderBottomColor: #0066cc;
      background-color: #ffffff !important;
      border-color: #e0e0e0 !important;
      color: #707070 !important;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .pf-v5-c-button.pf-m-control::after {
      border-bottom-color: #e0e0e0 !important;
      transition: border-bottom-color 0.2s ease;
    }

    .pf-v5-c-button.pf-m-control:hover::after,
    .pf-v5-c-button.pf-m-control:focus::after,
    .pf-v5-c-button.pf-m-control:active::after {
      border-bottom-color: #0066cc !important;
    }

    .pf-v5-c-button.pf-m-control:hover,
    .pf-v5-c-button.pf-m-control:focus,
    .pf-v5-c-button.pf-m-control:active {
      color: #0066cc !important;
      border-color: #0066cc !important;
      background-color: #ffffff !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .pf-v5-c-button.pf-m-control i.fa-eye,
    .pf-v5-c-button.pf-m-control i.fa-eye-slash,
    .pf-v5-c-button.pf-m-control i.fas,
    .pf-v5-c-button.pf-m-control i,
    .pf-v5-c-button[data-password-toggle] i {
      color: #707070 !important;
      transition: color 0.2s ease;
    }

    .pf-v5-c-button.pf-m-control:hover i.fa-eye,
    .pf-v5-c-button.pf-m-control:hover i.fa-eye-slash,
    .pf-v5-c-button.pf-m-control:hover i.fas,
    .pf-v5-c-button.pf-m-control:hover i,
    .pf-v5-c-button.pf-m-control:focus i,
    .pf-v5-c-button[data-password-toggle]:hover i {
      color: #0066cc !important;
    }

    .pf-v5-c-login__main-footer-links a,
    .pf-v5-c-button.pf-m-link {
      color: #0066cc !important;
    }

    .pf-v5-c-button.pf-m-link:hover {
      color: #004d99 !important;
    }

    .pf-v5-c-login__main-footer { background-color: transparent; }

    .pf-v5-c-alert {
      background-color: #ffffff !important;
      border-color: #e0e0e0 !important;
    }

    .pf-v5-c-alert__title { color: #151515 !important; }
    .pf-v5-c-check__label { color: #4d4d4d !important; }

    .pf-v5-c-login__footer {
      text-align: center;
      color: #707070;
      margin-top: 0.75rem;
      grid-area: unset !important;
    }
---
