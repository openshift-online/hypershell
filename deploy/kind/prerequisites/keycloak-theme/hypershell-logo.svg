<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88" fill="none" aria-label="HyperShell Logo">
  <title>HyperShell Logo</title>
  <!-- Red swirl — upper arc -->
  <path d="M 24 18 A 30 30 0 0 1 72 46" stroke="#ee0000" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Red swirl — lower arc -->
  <path d="M 64 70 A 30 30 0 0 1 16 42" stroke="#ee0000" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- White hexagon -->
  <polygon points="44,22 62,33 62,55 44,66 26,55 26,33" fill="white"/>
  <!-- Terminal prompt ">_" -->
  <polyline points="34,39 43,44 34,49" stroke="#151515" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="46" y1="50" x2="55" y2="50" stroke="#151515" stroke-width="3.5" stroke-linecap="round"/>
</svg>
