apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-used
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: quay.io/curl/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
             - /bin/sh
             - -c
             - |
               set -e
               echo "Waiting for ${KEYCLOAK_ENDPOINT} to be reachable..."
               RETRY_COUNT=0
               until curl -sf -o /dev/null "${KEYCLOAK_ENDPOINT}"; do
                 RETRY_COUNT=$((RETRY_COUNT + 1))
                 if [ "${RETRY_COUNT}" -ge "${MAX_RETRIES}" ]; then
                   echo "ERROR: ${KEYCLOAK_ENDPOINT} not reachable after $((MAX_RETRIES * WAIT_TIME_IN_SECONDS)) seconds, giving up"
                   exit 1
                 fi
                 echo "${KEYCLOAK_ENDPOINT} not reachable, waiting... (attempt ${RETRY_COUNT}/${MAX_RETRIES})"
                 sleep "${WAIT_TIME_IN_SECONDS}"
               done
               echo "${KEYCLOAK_ENDPOINT} is reachable"
          env:
            - name: KEYCLOAK_ENDPOINT
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/hypershell/protocol/openid-connect/certs"
            - name: MAX_RETRIES
              value: "60"
            - name: WAIT_TIME_IN_SECONDS
              value: "5"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 1000
