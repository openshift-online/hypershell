# Rendered by scripts/kind/up.sh: the __KIND_NAMESPACE__ token is substituted
# with sed (the same portable renderer used for the Kind cluster config) so every
# resource and reference lands in the selected Kind namespace without depending on
# GNU envsubst, which is not provisioned and is absent from stock macOS. Applying
# this file directly with kubectl leaves the __KIND_NAMESPACE__ token unexpanded
# and fails; use `make kind-up` (KIND_JAEGER=true) or render it the same way.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: __KIND_NAMESPACE__
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          # Jaeger v2 (built on the OpenTelemetry Collector). Running the image
          # with no arguments starts the all-in-one profile with in-memory
          # storage, and the OTLP receivers on 4317/4318 are enabled by default,
          # so the v1 COLLECTOR_OTLP_ENABLED env is no longer needed.
          image: jaegertracing/jaeger:2.20.0
          ports:
            - containerPort: 4317
              name: otlp-grpc
            # OTLP/HTTP receiver for the web console browser + BFF, which cannot
            # speak OTLP gRPC.
            - containerPort: 4318
              name: otlp-http
            - containerPort: 16686
              name: query-ui
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: __KIND_NAMESPACE__
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: query-ui
      port: 16686
      targetPort: 16686
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger
  namespace: __KIND_NAMESPACE__
spec:
  parentRefs:
    - name: hypershell-gw
      namespace: __KIND_NAMESPACE__
  hostnames:
    - jaeger.hypershell.localhost
  rules:
    - backendRefs:
        - name: jaeger
          port: 16686
