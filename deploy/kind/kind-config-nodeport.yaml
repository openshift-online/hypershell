kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: __KIND_HOST_MOUNT_PATH__
        containerPath: /mnt/host
        readOnly: false
    extraPortMappings:
      - containerPort: 30080
        hostPort: 23080
        protocol: TCP
      - containerPort: 30090
        hostPort: 29000
        protocol: TCP
      - containerPort: 30100
        hostPort: 24434
        protocol: TCP
      - containerPort: 30110
        hostPort: 23000
        protocol: TCP
