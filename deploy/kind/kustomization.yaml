apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # base is app-only (keycloak + CNPG db-cluster were decoupled out of it so the
  # GitOps hub overlay can inject them per-environment). Kind is a self-contained
  # dev overlay, so it re-adds both here, mirroring deploy/openshift. The keycloak
  # Deployment and the hypershell-db Cluster below are required targets for the
  # keycloak patch in this file and the CNPG-Cluster delete in the
  # database-deployment component (scripts/kind/up.sh).
  - ../base/hypershell-db-cluster.yaml
  - ../base/keycloak/
  - ../base
  - certificates.yaml
  - gateway.yaml
  - httproutes.yaml
  - oidc-secrets.yaml
patches:
  # --- Controller: Kind env vars + OIDC ---
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hypershell-controller
        namespace: hypershell-system
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: GATEWAY_API_GATEWAY_NAMESPACE
                    value: hypershell-system
                  - name: GATEWAY_API_BASE_DOMAIN
                    value: gw.localhost
                  - name: GATEWAY_API_GATEWAY_NAME
                    value: hypershell-gw
                  - name: GATEWAY_API_TLS_ISSUER_NAME
                    value: hypershell-ca-issuer
                  # The per-gateway console attaches its HTTPRoute to the shared
                  # Gateway's grpc listener (broadened to accept HTTPRoute in
                  # gateway.yaml); the console host console-<ns>.gw.localhost is
                  # covered by the same *.gw.localhost cert as the gRPC route.
                  - name: GATEWAY_API_HTTP_LISTENER_NAME
                    value: grpc
                  # The console dashboard and oauth2-proxy sidecar images are
                  # public registry images; the control plane's ImageDefaults
                  # already point at them (dashboard pinned by digest on quay),
                  # so Kind pulls them at pod start (imagePullPolicy IfNotPresent)
                  # with no overlay override or pre-load needed. Override
                  # HYPERSHELL_CONSOLE_IMAGE / HYPERSHELL_OAUTH2_PROXY_IMAGE only
                  # to test a different build.
                  # Kind's Gateway data plane is cloud-provider-kind's Envoy,
                  # which runs as an out-of-cluster Docker container. Its source
                  # IP cannot be matched by the per-tenant gateway
                  # NetworkPolicies' namespace/pod selectors, so those policies
                  # would blackhole all gateway ingress (503s). Dev needs no
                  # tenant isolation, so skip creating them entirely here;
                  # production/OpenShift leaves this unset to keep them enforced.
                  - name: GATEWAY_SKIP_NETWORK_POLICIES
                    value: "true"
                  # Shorten periodic namespace GC for e2e (production defaults 5m/10m).
                  # Go time.ParseDuration accepts seconds too (e.g. 30s, 1m30s).
                  # tests/e2e seeds a synthetic orphan after gateway provisioning (after step 2); step 11a asserts the reaper deleted it.
                  - name: GATEWAY_NAMESPACE_GC_INTERVAL
                    value: "30s"
                  - name: GATEWAY_NAMESPACE_GC_GRACE_PERIOD
                    value: "30s"
                  - name: OIDC_ISSUER
                    value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/hypershell"
                  - name: OIDC_CLIENT_ID
                    value: "hypershell-control-plane"
                  # Client-facing gateway OIDC issuer (pod, console, CLI). Must
                  # equal Keycloak KC_HOSTNAME so the token `iss` validates
                  # (config.issuer == discovery.issuer == token.iss). In Kind this
                  # is HTTPS on :443, matching production's issuer form: the gateway
                  # pod and host both reach it through the gateway LB's https
                  # listener (keycloak.hypershell.localhost -> gateway LB via the
                  # CoreDNS patch, see scripts/kind/lib.sh), which terminates TLS
                  # with the *.hypershell.localhost cert and forwards to
                  # keycloak-service:8080. The gateway trusts the self-signed CA
                  # via the gateway-trusted-ca ConfigMap (SSL_CERT_FILE), created
                  # by scripts/kind/up.sh. Keep this in sync with keycloak
                  # KC_HOSTNAME. (Production/OpenShift uses the same https form in
                  # deploy/keycloak.)
                  - name: GATEWAY_OIDC_ISSUER_URL
                    value: "https://keycloak.hypershell.localhost/realms/hypershell"
                  - name: OIDC_TOKEN_ENDPOINT
                    value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/hypershell/protocol/openid-connect/token"
                  - name: OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: hypershell-cp-oidc
                        key: client-secret
  # --- Web console: OIDC ---
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hypershell-web-console
        namespace: hypershell-system
      spec:
        template:
          spec:
            containers:
              - name: web-console
                env:
                  - name: OIDC_ISSUER
                    value: "https://keycloak.hypershell.localhost/realms/hypershell"
                  - name: OIDC_CLIENT_ID
                    value: "hypershell-frontend"
                  - name: OIDC_REDIRECT_URI
                    value: "https://console.hypershell.localhost/auth/callback"
                  # local-dev-only: lets the web console BFF trust Kind's
                  # self-signed cert-manager CA. Never set this in deploy/base
                  # or deploy/openshift.
                  - name: NODE_TLS_REJECT_UNAUTHORIZED
                    value: "0"
                  - name: SESSION_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: hypershell-oidc-session
                        key: session-secret
  # --- API server: enable JWT + JWK cert URL + bypass paths ---
  # Appending --enable-jwt=true is index-independent: --enable-jwt is a pflag
  # BoolVar, and repeated single-value flags are last-value-wins, so the
  # appended true overrides the base --enable-jwt=false no matter where it sits
  # in deploy/base/api-server.yaml's command array.
  - target:
      kind: Deployment
      name: hypershell-api-server
      namespace: hypershell-system
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--enable-jwt=true"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--enable-authz=true"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--jwk-cert-url=http://keycloak-service.keycloak.svc.cluster.local:8080/realms/hypershell/protocol/openid-connect/certs"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--auth-bypass-paths=/healthcheck,/metrics,/api/hypershell/v1/metadata,/api/hypershell/v1/openapi,/openapi"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--auth-bypass-methods=/grpc.health.v1.Health/,/grpc.reflection.v1alpha.ServerReflection/,/hypershell.v1.GatewayService/WatchGateways,/hypershell.v1.GatewayReleaseService/WatchGatewayReleases,/hypershell.v1.ManagedClusterService/WatchManagedClusters,/hypershell.v1.ManagedDatabaseService/WatchManagedDatabases,/hypershell.v1.GatewayNetworkService/WatchGatewayNetworks"
  # --- API server: select the development_oidc environment + enforce RBAC ---
  # The binary's default `development` environment force-disables JWT in its
  # OverrideConfig, which overrides the --enable-jwt=true flag above. The
  # `development_oidc` environment leaves JWT driven by flags, so JWT
  # enforcement and JWKS loading from Keycloak actually take effect.
  #
  # RBAC_ENFORCE=true turns on the three-role gateway RBAC model
  # (gateway:creator/owner/viewer). It is the sole gate for that model
  # (plugins/rbac/plugin.go) -- independent of --enable-authz, which only adds
  # the framework's identity-presence check. admin carries gateway:creator (via
  # the realm_access.roles mapper in deploy/base/keycloak); developers do not,
  # so their POST /gateways is rejected with 403.
  #
  # RBAC_SERVICE_ACCOUNTS bypasses the gRPC RBAC interceptor for the control
  # plane's service account. The control plane writes gateway status via the
  # gRPC UpdateGateway method (not bypassed by --auth-bypass-methods, which only
  # covers Watch*), but the gRPC provisioning path never syncs JWT roles
  # (pkg/rbac/grpc_interceptor.go), so the SA can never earn a gateway:creator
  # binding. The bypass is the supported mechanism for trusted service accounts.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hypershell-api-server
        namespace: hypershell-system
      spec:
        template:
          spec:
            containers:
              - name: api-server
                env:
                  - name: API_ENV
                    value: "development_oidc"
                  - name: RBAC_ENFORCE
                    value: "true"
                  - name: RBAC_SERVICE_ACCOUNTS
                    value: "service-account-hypershell-control-plane"
  # --- Keycloak: fixed HTTPS issuer reachable in-cluster and from host ---
  # The token `iss` is derived from KC_HOSTNAME. Gateways validate tokens by
  # requiring config.issuer == discovery.issuer == token.iss, so the issuer
  # must be a single URL reachable over HTTPS both in-cluster (via CoreDNS ->
  # gateway LB) and from the host (via the gateway LB :443). The LB terminates
  # TLS with the *.hypershell.localhost cert and forwards to keycloak-service:8080;
  # Keycloak stays plain HTTP internally and honors X-Forwarded-Proto
  # (KC_PROXY_HEADERS=xforwarded). This value matches E2E_OIDC_ISSUER and the
  # seeded gateway OIDC issuer.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keycloak
        namespace: keycloak
      spec:
        template:
          spec:
            containers:
              - name: keycloak
                env:
                  - name: KC_HOSTNAME
                    value: "https://keycloak.hypershell.localhost"
  - target:
      kind: Deployment
      name: hypershell-api-server
    path: wait-for-keycloak.patch.yaml
  - target:
      kind: Deployment
      name: hypershell-web-console
    path: wait-for-keycloak.patch.yaml
images:
  - name: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-api-server-main
    newTag: latest
  - name: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-control-plane-main
    newTag: latest
  - name: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-web-console-main
    newTag: latest
