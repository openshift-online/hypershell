apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - hypershell-db-secret.yaml

patches:
  # The API server has no CA bundle for the stand-in server's throwaway TLS
  # certificate in Kind; switch sslmode from require to disable in both the
  # migrate init container and the api-server container.
  - target:
      kind: Deployment
      name: hypershell-api-server
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-used
      spec:
        template:
          spec:
            initContainers:
              - name: migrate
                env:
                  - name: DB_SSLMODE
                    value: disable
            containers:
              - name: api-server
                env:
                  - name: DB_SSLMODE
                    value: disable
