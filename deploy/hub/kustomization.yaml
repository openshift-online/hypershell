apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# App-only OpenShift base for the GitOps fleet hub (bootstrap-hyperfleet).
#
# This inherits the core base and applies OpenShift-specific configurations
# (routes, SCCs, network policies) but intentionally omits the bundled Keycloak
# and CNPG databases so they can be injected dynamically per-environment by GitOps.
resources:
  - ../base
  - route.yaml
  - scc.yaml

