apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Compatibility composition for existing GitOps fleet hub consumers.
# Includes both platform and application resources, but not bundled Keycloak or
# databases. Production injects externally provisioned PostgreSQL per environment.
# New two-instance Argo CD consumers use deploy/gitops/{platform,applications}
# separately at the same source commit. See ../gitops/README.md.
resources:
  - ../gitops/platform
  - ../gitops/applications
