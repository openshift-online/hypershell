apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hypershell-api-server
  template:
    metadata:
      labels:
        app: hypershell-api-server
    spec:
      serviceAccountName: hypershell-api-server
      initContainers:
        - name: migrate
          image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-api-server-main:latest
          command:
            - /usr/local/bin/hypershell
            - migrate
            - --db-host-file=/secrets/host
            - --db-port-file=/secrets/port
            - --db-name-file=/secrets/name
            - --db-user-file=/secrets/user
            - --db-password-file=/secrets/password
            - --db-sslmode=disable
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: db-secrets
              mountPath: /secrets
              readOnly: true
      containers:
        - name: api-server
          image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-api-server-main:latest
          command:
            - /usr/local/bin/hypershell
            - serve
            - --api-server-bindaddress=0.0.0.0:8000
            - --grpc-server-bindaddress=0.0.0.0:9000
            - --metrics-server-bindaddress=0.0.0.0:4433
            - --health-check-server-bindaddress=0.0.0.0:4434
            - --enable-authz=false
            - --enable-jwt=false
            - --db-host-file=/secrets/host
            - --db-port-file=/secrets/port
            - --db-name-file=/secrets/name
            - --db-user-file=/secrets/user
            - --db-password-file=/secrets/password
            - --db-sslmode=disable
          env:
            - name: API_ENV
              value: "production"
            # Plaintext in-cluster gRPC to the control-plane provisioner. A
            # NetworkPolicy restricts port 9443 to this pod; the channel mirrors
            # the sibling control-plane -> api-server watch channel (no mTLS).
            - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_ADDR
              value: "hypershell-control-plane:9443"
          ports:
            - name: api
              containerPort: 8000
            - name: grpc
              containerPort: 9000
            - name: metrics
              containerPort: 4433
            - name: health
              containerPort: 4434
          startupProbe:
            httpGet:
              path: /healthcheck
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: db-secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: db-secrets
          secret:
            secretName: hypershell-db
