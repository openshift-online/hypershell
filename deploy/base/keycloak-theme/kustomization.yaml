apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: keycloak-hypershell-theme
    files:
      - theme.properties
      - login.css
      - messages_en.properties
  - name: keycloak-hypershell-theme-assets
    files:
      - hypershell-logo.png
      - RedHatText-latin.woff2
