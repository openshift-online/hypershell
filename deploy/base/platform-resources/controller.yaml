apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypershell-controller
  namespace: hypershell-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-controller
  namespace: hypershell-system
spec:
  replicas: 1
  # One active controller (openshell-gateway-helm-adoption.spec.md, stuck
  # release recovery): Recreate stops the old pod before the new one starts,
  # so two controllers never run helm against the same gateway release at
  # once. A RollingUpdate would overlap them, and the new pod could act on a
  # release the old pod is still upgrading. Every overlay inherits this.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hypershell-controller
  template:
    metadata:
      labels:
        app: hypershell-controller
    spec:
      serviceAccountName: hypershell-controller
      securityContext:
        runAsNonRoot: true
      # The admin host is always an FQDN (Kind in-cluster Service, RDS, IBM
      # Cloud). Kubernetes defaults ndots:5, so a four-dot name is searched as
      # a relative name first and burns connect_timeout on NXDOMAIN suffixes.
      # ndots:2 is set in this base overlay for every environment, not Kind
      # only: in-namespace short names still search, and the FQDN is treated
      # as absolute. Kind CoreDNS is the motivating flake; production
      # controllers benefit the same way.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      containers:
        - name: controller
          image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-control-plane-main:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Required per overlay, intentionally not set here:
          #   HYPERSHELL_MANAGED_CLUSTER_NAME  the name this control plane
          #     registers under (unique per control plane, e.g. local-kind,
          #     local-openshift, hub, hyp0-mc1);
          #   HYPERSHELL_CLUSTER_PLATFORM  the host platform (openshift or
          #     kubernetes); explicit deployment configuration, never inferred
          #     from API discovery (CTRL-CORE-16). The controller exits non-zero
          #     without it.
          #   OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET  its own OIDC
          #     client, holding the managed-cluster-registrar realm role.
          # Every control plane registers with the hub and scopes its watches to
          # the returned cluster_id; without these it exits at startup naming the
          # missing variable (control-plane.spec.md, Mandatory Cluster Identity).
          # HYPERSHELL_GRPC_SERVER_ADDR selects the gRPC transport: in-cluster
          # names (no dot, *.svc, *.svc.*, localhost) dial plaintext, anything
          # else dials TLS with the system trust store.
          env:
            - name: HYPERSHELL_GRPC_SERVER_ADDR
              value: "hypershell-api-server:9000"
            - name: HYPERSHELL_API_SERVER_URL
              value: "http://hypershell-api-server:8000"
            - name: HYPERSHELL_MANAGED_CLUSTER_CAPABILITIES
              value: "provider/aws,network/public"
            - name: HYPERSHELL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HYPERSHELL_LOG_LEVEL
              value: "info"
            # Plaintext in-cluster gRPC provisioner endpoint. A NetworkPolicy
            # restricts port 9443 to the api-server pod; the channel mirrors the
            # sibling control-plane -> api-server watch channel (no mTLS).
            - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_BIND_ADDRESS
              value: "0.0.0.0:9443"
            # Tags must match OPENSHELL_VERSION when bumping the OpenShell release.
            - name: GATEWAY_IMAGE
              value: quay.io/opendatahub/odh-openshell-gateway:v0.1.8-rhaiv.0
            - name: GATEWAY_SUPERVISOR_IMAGE
              value: quay.io/opendatahub/odh-openshell-supervisor:v0.1.8-rhaiv.0
            - name: GATEWAY_SANDBOX_RUNTIME_IMAGE
              value: quay.io/opendatahub/odh-openshell-sandbox:v0.1.8-rhaiv.0
            # Per-gateway console (quay.io/ai-openshell/console), pinned by digest.
            # Required: the controller refuses to start without it. Stamped from
            # OPENSHELL_CONSOLE_IMAGE and OPENSHELL_CONSOLE_DIGEST by
            # `make sync-openshell-version`. Pinned to console release v0.1.4
            # (gateway line 0.1); edit this release note by hand on a bump.
            - name: HYPERSHELL_CONSOLE_IMAGE
              value: quay.io/ai-openshell/console@sha256:5c93f09dc9eae4ece3b46160c981b7c8ba573f3ab7b08b1ef4db4c297d7d5b37
            # Directory the gateway database admin credentials Secret is mounted
            # at (one file per key). The controller refuses to start without it.
            - name: GATEWAY_DATABASE_ADMIN_DIR
              value: /etc/hypershell/gateway-database
            # In-cluster ReportPolicyEvents endpoint for the interceptor
            # sidecars (CTRL-CORE-22). A NetworkPolicy admits only gateway pods.
            - name: HYPERSHELL_POLICY_EVENTS_BIND_ADDRESS
              value: "0.0.0.0:9444"
            # The controller runs the sidecar from its own image digest, read
            # from its own Pod status (PLAT-PGP-09).
            - name: HYPERSHELL_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: gateway-database-admin
              mountPath: /etc/hypershell/gateway-database
              readOnly: true
          ports:
            - containerPort: 9443
              name: provisioner
            - containerPort: 9444
              name: policy-events
          # These probes are coupled to the service account provisioner port (9443).
          # If HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_BIND_ADDRESS is ever empty,
          # the provisioner is disabled, nothing binds port 9443, and the controller will fail probes.
          # Overlays that disable the provisioner must also override or remove these probes.
          startupProbe:
            tcpSocket:
              port: provisioner
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: provisioner
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: provisioner
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        # PostgreSQL admin credentials for gateway database provisioning. Keys:
        # host, port, user, password, sslrootcert (PEM CA bundle) required;
        # dbname and sslmode (verify-full only) optional. Staged out-of-band by
        # the platform team, for example through External Secrets Operator
        # (deploy/components/gateway-database-admin-secret). See
        # specs/platform/openshell-gateway-database.spec.md.
        - name: gateway-database-admin
          secret:
            secretName: hypershell-gateway-database-admin
            defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: hypershell-controller
  namespace: hypershell-system
spec:
  selector:
    app: hypershell-controller
  ports:
    - name: provisioner
      port: 9443
      targetPort: 9443
      appProtocol: grpc
    - name: policy-events
      port: 9444
      targetPort: 9444
      appProtocol: grpc
