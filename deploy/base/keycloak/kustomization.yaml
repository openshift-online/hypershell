apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - namespace.yaml
  - keycloak.yaml
configMapGenerator:
  - name: keycloak-hypershell-theme
    options:
      disableNameSuffixHash: true
    files:
      - theme.properties
      - login.css
      - messages_en.properties
  - name: keycloak-hypershell-theme-assets
    options:
      disableNameSuffixHash: true
    files:
      - hypershell-logo.png
      - RedHatText-latin.woff2
