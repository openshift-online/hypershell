apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Renders GitHub IdP / e2e-client values and OpenShift console redirect
        # URIs into the realm JSON. Keycloak --import-realm does not substitute
        # placeholders (upstream keycloak#20199), and start-dev's ephemeral H2
        # store drops any admin-API redirect URI patch on pod recycle.
        - name: render-realm-config
          image: registry.access.redhat.com/hi/python:3.13-builder@sha256:75f0b15a73e9510e97dc3c3613a8c17794a0efbfc42ecfb4203e419450163763
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: PR_ENV_GITHUB_IDP_ENABLED
              valueFrom:
                secretKeyRef:
                  name: hypershell-github-oauth
                  key: idp-enabled
                  optional: true
            - name: PR_ENV_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hypershell-github-oauth
                  key: client-id
                  optional: true
            - name: PR_ENV_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hypershell-github-oauth
                  key: client-secret
                  optional: true
            - name: PR_ENV_GITHUB_ORG
              valueFrom:
                secretKeyRef:
                  name: hypershell-github-oauth
                  key: org
                  optional: true
            - name: PR_ENV_GITHUB_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: hypershell-github-oauth
                  key: allowlist
                  optional: true
            - name: HYPERSHELL_E2E_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hypershell-github-oauth
                  key: e2e-client-secret
                  optional: true
            - name: HYPERSHELL_E2E_CLIENT_ENABLED
              valueFrom:
                secretKeyRef:
                  name: hypershell-github-oauth
                  key: e2e-client-enabled
                  optional: true
            # Set by make openshift-up from the web-console Route host. Unset on
            # Kind, so the renderer keeps the localhost frontend redirect URIs.
            - name: HYPERSHELL_CONSOLE_HOST
              value: ""
          command:
            - python3
            - /scripts/render-realm-config.py
            - /config/hypershell-realm.json
            - /rendered/hypershell-realm.json
          volumeMounts:
            - name: realm-config-source
              mountPath: /config
              readOnly: true
            - name: realm-renderer
              mountPath: /scripts
              readOnly: true
            - name: realm-config
              mountPath: /rendered
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.2@sha256:831330513f55695572286e521f94fcd3c7e285250ed5b848090265a33192f669
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          args:
            - start-dev
            - --import-realm
          env:
            - name: JAVA_OPTS_APPEND
              value: "-Djava.security.egd=file:/dev/./urandom"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # KC_HOSTNAME pins the issuer/frontend URL to HTTPS; a TLS-terminating
            # proxy (the networking Gateway in Kind, the Route on OpenShift)
            # fronts the plain-HTTP listener below. Overlays patch this to their
            # own external hostname (deploy/kind, deploy/keycloak).
            - name: KC_HOSTNAME
              value: "https://keycloak.hypershell.localhost"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            # Legacy token-exchange (requested_subject impersonation) plus FGAP
            # v1. Keycloak 26 standard token-exchange rejects that parameter,
            # and FGAP v2 (the 26.2+ default) has no token-exchange permission.
            # The e2e suite impersonates seeded users onto gateway and frontend
            # audiences, which needs both features.
            - name: KC_FEATURES
              value: "token-exchange,admin-fine-grained-authz:v1"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 15
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: hypershell-theme
              mountPath: /opt/keycloak/themes/hypershell/login/theme.properties
              subPath: theme.properties
            - name: hypershell-theme
              mountPath: /opt/keycloak/themes/hypershell/login/resources/css/login.css
              subPath: login.css
            - name: hypershell-theme-assets
              mountPath: /opt/keycloak/themes/hypershell/login/resources/img/hypershell-logo.png
              subPath: hypershell-logo.png
            - name: hypershell-theme-assets
              mountPath: /opt/keycloak/themes/hypershell/login/resources/fonts/RedHatText-latin.woff2
              subPath: RedHatText-latin.woff2
            - name: hypershell-theme
              mountPath: /opt/keycloak/themes/hypershell/login/messages/messages_en.properties
              subPath: messages_en.properties
      volumes:
        - name: realm-config-source
          configMap:
            name: keycloak-realm
        - name: realm-renderer
          configMap:
            name: keycloak-realm-renderer
            defaultMode: 0444
        - name: realm-config
          emptyDir: {}
        - name: hypershell-theme
          configMap:
            name: keycloak-hypershell-theme
        - name: hypershell-theme-assets
          configMap:
            name: keycloak-hypershell-theme-assets
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# hypershell-e2e client: confidential CI client for the OpenShift pull-request
# e2e suite (ephemeral-pr-environments.spec.md). Disabled by default so Kind,
# local, and stage realms do not ship an enabled admin client with a well-known
# secret. PR environments set e2e-client-enabled=true and a random secret via
# hypershell-github-oauth. Its service account holds platform:admin +
# gateway:creator so E2E_OIDC_GRANT=client_credentials can obtain admin tokens
# without a GitHub login. Standard token exchange is enabled so the suite can
# impersonate the seeded developer principal. Distinct from
# hypershell-provisioner (manage-clients / manage-users). The "description"
# field below is kept short because Keycloak's CLIENT.DESCRIPTION column is
# VARCHAR(255); exceeding that fails the whole realm import at boot.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  hypershell-realm.json: |
    {
      "realm": "hypershell",
      "enabled": true,
      "loginTheme": "hypershell",
      "registrationAllowed": false,
      "clients": [
        {
          "clientId": "hypershell-frontend",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "fullScopeAllowed": true,
          "redirectUris": ["https://console.hypershell.localhost/*", "https://console.hypershell.localhost:*"],
          "webOrigins": ["+"],
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "protocolMappers": [
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "hypershell-frontend",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "claim.name": "groups",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "realm-access-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "userinfo.token.claim": "false",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "hypershell-cli",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "fullScopeAllowed": true,
          "attributes": {
            "oauth2.device.authorization.grant.enabled": "true",
            "pkce.code.challenge.method": "S256"
          },
          "redirectUris": ["http://127.0.0.1:*"],
          "webOrigins": [],
          "defaultClientScopes": ["openid", "email", "profile"],
          "protocolMappers": [
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "hypershell-frontend",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "claim.name": "groups",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "realm-access-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "userinfo.token.claim": "false",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "hypershell-provisioner",
          "enabled": true,
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "secret": "provisioner-secret"
        },
        {
          "clientId": "hypershell-e2e",
          "description": "Confidential CI client for the OpenShift e2e suite (ephemeral-pr-environments.spec.md)",
          "enabled": "${HYPERSHELL_E2E_CLIENT_ENABLED:false}",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "secret": "${HYPERSHELL_E2E_CLIENT_SECRET:}",
          "attributes": {
            "standard.token.exchange.enabled": "false"
          },
          "defaultClientScopes": ["profile", "roles"],
          "protocolMappers": [
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "hypershell-frontend",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "preferred-username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-hardcoded-claim-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "preferred_username",
                "claim.value": "admin",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "hypershell-control-plane",
          "enabled": true,
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "secret": "control-plane-secret",
          "defaultClientScopes": ["profile"],
          "protocolMappers": [
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "hypershell-frontend",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "gateway-roles",
          "description": "Emits a user's gateway client roles under resource_access.${client_id}.roles. Realm prerequisite for per-gateway OpenShell console clients (openshell-gateway-keycloak.spec.md).",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "gateway-client-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-client-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "claim.name": "resource_access.${client_id}.roles",
                "jsonType.label": "String",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "profile",
          "description": "OpenID Connect built-in scope: profile. Emits preferred_username (required by the API server to resolve the caller identity) and standard name claims. Defined explicitly because supplying any clientScopes suppresses Keycloak's auto-seeded defaults.",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "given name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "firstName",
                "claim.name": "given_name",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "family name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "lastName",
                "claim.name": "family_name",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "full name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-full-name-mapper",
              "consentRequired": false,
              "config": {
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "email",
          "description": "OpenID Connect built-in scope: email. Defined explicitly because supplying any clientScopes suppresses Keycloak's auto-seeded defaults.",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "email",
                "claim.name": "email",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "email verified",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "emailVerified",
                "claim.name": "email_verified",
                "jsonType.label": "boolean",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "roles",
          "description": "OpenID Connect built-in scope: roles. Referenced by the per-gateway console clients' defaultClientScopes. Defined explicitly because supplying any clientScopes suppresses Keycloak's auto-seeded defaults.",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "false",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "realm roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "userinfo.token.claim": "false",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "client roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-client-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "claim.name": "resource_access.${client_id}.roles",
                "jsonType.label": "String",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "userinfo.token.claim": "false",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "audience resolve",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-resolve-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "web-origins",
          "description": "OpenID Connect built-in scope: web-origins. Referenced by the per-gateway console clients' defaultClientScopes. Defined explicitly because supplying any clientScopes suppresses Keycloak's auto-seeded defaults.",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "false",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "allowed web origins",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-allowed-origins-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "acr",
          "description": "OpenID Connect built-in scope: acr. Referenced by the per-gateway console clients' defaultClientScopes. Defined explicitly because supplying any clientScopes suppresses Keycloak's auto-seeded defaults.",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "false",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "acr loa level",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-acr-mapper",
              "consentRequired": false,
              "config": {
                "id.token.claim": "true",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        }
      ],
      "roles": {
        "realm": [
          { "name": "hypershell-admins", "description": "HyperShell administrators" },
          { "name": "hypershell-users", "description": "HyperShell users" },
          { "name": "gateway:creator", "description": "HyperShell platform gateway creators (gateway:creator RBAC role)" },
          { "name": "platform:admin", "description": "HyperShell platform administrators with global view and delete access (platform:admin RBAC role)" }
        ]
      },
      "users": [
        {
          "username": "admin",
          "firstName": "Admin",
          "lastName": "User",
          "email": "admin@hypershell.local",
          "emailVerified": true,
          "enabled": true,
          "credentials": [{ "type": "password", "value": "admin", "temporary": false }],
          "realmRoles": ["hypershell-admins", "hypershell-users", "gateway:creator"]
        },
        {
          "username": "developer",
          "firstName": "Developer",
          "lastName": "User",
          "email": "developer@hypershell.local",
          "emailVerified": true,
          "enabled": true,
          "credentials": [{ "type": "password", "value": "developer", "temporary": false }],
          "realmRoles": ["hypershell-users"]
        },
        {
          "username": "platform-admin",
          "firstName": "Platform",
          "lastName": "Administrator",
          "email": "platform-admin@hypershell.local",
          "emailVerified": true,
          "enabled": true,
          "credentials": [{ "type": "password", "value": "platform-admin", "temporary": false }],
          "realmRoles": ["hypershell-users", "platform:admin"]
        },
        {
          "username": "service-account-hypershell-provisioner",
          "enabled": true,
          "serviceAccountClientId": "hypershell-provisioner",
          "clientRoles": {
            "realm-management": ["manage-clients", "manage-users"]
          }
        },
        {
          "username": "service-account-hypershell-e2e",
          "enabled": true,
          "serviceAccountClientId": "hypershell-e2e",
          "realmRoles": ["platform:admin", "gateway:creator"],
          "clientRoles": {
            "realm-management": ["impersonation"]
          }
        }
      ],
