apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypershell-service-account-provisioner
  namespace: hypershell-system
  labels:
    app.kubernetes.io/name: hypershell
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: hypershell-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hypershell-api-server
      ports:
        - protocol: TCP
          port: 9443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshell-gateway-sandbox-ssh
  namespace: hypershell-system
  labels:
    app.kubernetes.io/name: hypershell
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchExpressions:
      - key: openshell.ai/managed-by
        operator: In
        values: ["openshell"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell
              app.kubernetes.io/instance: openshell-gateway
      ports:
        - protocol: TCP
          port: 2222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshell-gateway-sandbox-ssh-v2
  namespace: hypershell-system
  labels:
    app.kubernetes.io/name: hypershell
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchExpressions:
      - key: agents.x-k8s.io/sandbox-name-hash
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell
              app.kubernetes.io/instance: openshell-gateway
      ports:
        - protocol: TCP
          port: 2222
---
