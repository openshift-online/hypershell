apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypershell-controller
  namespace: hypershell-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-controller
  namespace: hypershell-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hypershell-controller
  template:
    metadata:
      labels:
        app: hypershell-controller
    spec:
      serviceAccountName: hypershell-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: controller
          image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-control-plane-main:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HYPERSHELL_GRPC_SERVER_ADDR
              value: "hypershell-api-server:9000"
            - name: HYPERSHELL_API_SERVER_URL
              value: "http://hypershell-api-server:8000"
            - name: HYPERSHELL_NAMESPACE
              value: "hypershell-system"
            - name: HYPERSHELL_LOG_LEVEL
              value: "info"
            - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_BIND_ADDRESS
              value: "0.0.0.0:9443"
            - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_TLS_CERT
              value: "/var/run/hypershell/provisioner/tls.crt"
            - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_TLS_KEY
              value: "/var/run/hypershell/provisioner/tls.key"
            - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_TLS_CLIENT_CA
              value: "/var/run/hypershell/provisioner/ca.crt"
            - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_EXPECTED_CLIENT_CN
              value: "hypershell-api-server"
          ports:
            - containerPort: 9443
              name: provisioner
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: service-account-provisioner-tls
              mountPath: /var/run/hypershell/provisioner
              readOnly: true
      volumes:
        - name: service-account-provisioner-tls
          secret:
            secretName: hypershell-service-account-provisioner-server-tls
---
apiVersion: v1
kind: Service
metadata:
  name: hypershell-controller
  namespace: hypershell-system
spec:
  selector:
    app: hypershell-controller
  ports:
    - name: provisioner
      port: 9443
      targetPort: 9443
      appProtocol: grpc
