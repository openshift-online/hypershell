apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypershell-api-server
  namespace: hypershell-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-api-server
  namespace: hypershell-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hypershell-api-server
  template:
    metadata:
      labels:
        app: hypershell-api-server
    spec:
      serviceAccountName: hypershell-api-server
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: migrate
          image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-api-server-main:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /usr/local/bin/hypershell
            - migrate
            - --db-host-file=/secrets/host
            - --db-port-file=/secrets/port
            - --db-name-file=/secrets/dbname
            - --db-user-file=/secrets/user
            - --db-password-file=/secrets/password
            - --db-sslmode=$(DB_SSLMODE)
          env:
            - name: DB_SSLMODE
              value: require
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: db-secrets
              mountPath: /secrets
              readOnly: true
      containers:
        - name: api-server
          image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-api-server-main:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /usr/local/bin/hypershell
            - serve
            - --api-server-bindaddress=0.0.0.0:8000
            - --grpc-server-bindaddress=0.0.0.0:9000
            - --health-check-server-bindaddress=0.0.0.0:8434
            - --metrics-server-bindaddress=0.0.0.0:4433
            - --enable-authz=false
            - --enable-jwt=false
            - --db-host-file=/secrets/host
            - --db-port-file=/secrets/port
            - --db-name-file=/secrets/dbname
            - --db-user-file=/secrets/user
            - --db-password-file=/secrets/password
            - --db-sslmode=$(DB_SSLMODE)
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9000
              name: grpc
            - containerPort: 8434
              name: health
            - containerPort: 4433
              name: metrics
          env:
            # Plaintext in-cluster gRPC to the control-plane provisioner. A
            # NetworkPolicy restricts port 9443 to this pod; the channel mirrors
            # the sibling control-plane -> api-server watch channel (no mTLS).
            # Use a cluster-local FQDN. grpc-go's DNS resolver does not apply
            # kube-DNS search domains, so the short name hypershell-controller
            # fails even when libc lookup (nc) succeeds. POD_NAMESPACE is this
            # pod's namespace (downward API), the same source as the
            # controller's HYPERSHELL_NAMESPACE instance identity. Kubelet
            # expands $(POD_NAMESPACE) so the dial target tracks the Deployment
            # namespace without a hardcoded hypershell-system segment.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_ADDR
              value: "hypershell-controller.$(POD_NAMESPACE).svc.cluster.local:9443"
            - name: DB_SSLMODE
              value: require
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8434
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8434
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8434
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: db-secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: db-secrets
          secret:
            secretName: hypershell-db-app
---
apiVersion: v1
kind: Service
metadata:
  name: hypershell-api-server
  namespace: hypershell-system
spec:
  selector:
    app: hypershell-api-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 9000
      targetPort: 9000
      appProtocol: grpc
    - name: health
      port: 8434
      targetPort: 8434
    - name: metrics
      port: 4433
      targetPort: 4433
