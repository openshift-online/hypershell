# SCC *use* is namespace-scoped: a RoleBinding to a built-in SCC ClusterRole
# grants use within one namespace. Ephemeral environments cannot share a
# ClusterRoleBinding name, and namespace-scoped access is enough for use.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hypershell-controller-scc
  namespace: hypershell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:restricted-v2
subjects:
  - kind: ServiceAccount
    name: hypershell-controller
    namespace: hypershell-system
---
# Sandbox pods require the privileged SCC for container-in-container
# execution (see specs/platform/openshell-gateway.spec.md §OpenShift).
# The controller creates additional per-tenant RoleBindings at runtime
# (reconcileOpenShiftSCC) once a privileged actor has granted it bind.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hypershell-sandbox-scc
  namespace: hypershell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: openshell-gateway-sandbox
    namespace: hypershell-system
---
# The static binding above only covers the sandbox SA in the controller's own
# namespace. In practice each gateway lands in its own namespace, so the
# controller creates a per-namespace RoleBinding to the privileged SCC at
# runtime (reconcileOpenShiftSCC). Kubernetes escalation prevention only lets it
# create that binding if it can "bind" the referenced ClusterRole -- grant the
# controller `bind` scoped to exactly the privileged SCC ClusterRole. Using
# `bind` (rather than binding the controller to privileged directly) lets it
# grant the SCC without its own pods being able to use it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hypershell-controller-scc-bind
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["system:openshift:scc:privileged"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hypershell-controller-scc-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hypershell-controller-scc-bind
subjects:
  - kind: ServiceAccount
    name: hypershell-controller
    namespace: hypershell-system
