apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/hypershell-db-cluster.yaml
  - ../base/keycloak/
  - ../base
  - certificates.yaml
  - networkpolicies.yaml
  - route.yaml
  - keycloak-route.yaml
  - keycloak-networkpolicy.yaml
  - scc.yaml
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hypershell-controller
        namespace: hypershell-system
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: GATEWAY_API_GATEWAY_NAME
                    # OVERRIDE: set to the name of the pre-existing Gateway resource
                    value: openshell-grpc-gateway
                  - name: GATEWAY_API_GATEWAY_NAMESPACE
                    value: openshift-ingress
                  - name: GATEWAY_API_BASE_DOMAIN
                    # OVERRIDE: set to your wildcard domain (e.g. openshell.stage.example.com)
                    value: openshell.stage.example.com
                  - name: GATEWAY_API_TLS_ISSUER_NAME
                    value: hypershell-ca-issuer
                  # Shared Gateway listener is named grpc (see
                  # deploy/openshift/infrastructure/gateway.yaml). Console
                  # HTTPRoutes default sectionName to https, which yields
                  # NoMatchingParent on this cluster.
                  - name: GATEWAY_API_HTTP_LISTENER_NAME
                    value: grpc
                  - name: OIDC_ISSUER
                    valueFrom:
                      secretKeyRef:
                        name: hypershell-api-config
                        key: api-service.issuerUrl
                  - name: OIDC_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: hypershell-api-config
                        key: api-service.clientId
                  - name: OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: hypershell-api-config
                        key: api-service.clientSecret
  # --- API server: enable JWT + JWK cert URL from OIDC secret + enforce RBAC ---
  # The JWKS URL is read from the hypershell-api-config secret so it stays in
  # sync with the Keycloak instance provisioned for this cluster. Without this,
  # the framework defaults to sso.redhat.com and rejects Keycloak-issued tokens.
  #
  # RBAC_ENFORCE=true turns on the three-role gateway RBAC model
  # (gateway:creator/owner/viewer); it is the sole gate for that model
  # (plugins/rbac/plugin.go), independent of --enable-authz. RBAC_SERVICE_ACCOUNTS
  # bypasses the gRPC RBAC interceptor for the control plane's service account,
  # whose UpdateGateway writes are not covered by --auth-bypass-methods and whose
  # gRPC path never syncs JWT roles (pkg/rbac/grpc_interceptor.go).
  #
  # BREAKING CHANGE for existing clusters: once applied, every gateway operation
  # requires the caller's token to carry gateway:creator (create) or a matching
  # per-gateway RoleBinding (read/write). On a real cluster the IdP is external
  # SSO, so before/with this rollout the SSO MUST define gateway:creator, assign
  # it to platform operators, and emit it in realm_access.roles -- otherwise
  # creates 403 and reads 404 immediately after upgrade. See the operator note in
  # specs/security/rbac-enforcement.spec.md (Production Rollout) and coordinate the
  # SSO role mapping with the release that makes this overlay enforce RBAC.
  - target:
      kind: Deployment
      name: hypershell-api-server
      namespace: hypershell-system
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          # API_ENV selects the rh-trex runtime environment. The default
          # "development" hard-forces Auth.EnableJWT=false in OverrideConfig()
          # AFTER flag parsing, which silently clobbers --enable-jwt=true below
          # and leaves REST with no identity so RBAC 401s every request.
          # "development_oidc" is the purpose-built environment for a
          # self-contained Keycloak: it leaves EnableJWT to the flags and keeps
          # the OCM/AMS client mocked (enable-mock=true default), so the
          # api-server does NOT require sso.redhat.com secret files. Any overlay
          # that enables JWT against a self-hosted IdP MUST set this. Mirrors the
          # deploy/kind overlay and the gitops jwt-enforce component.
          - name: API_ENV
            value: "development_oidc"
          # Re-declare the base env: this JSON6902 add REPLACES the whole env
          # array, so the base values would otherwise be dropped.
          - name: HYPERSHELL_SERVICE_ACCOUNT_PROVISIONER_ADDR
            value: "hypershell-controller.hypershell-system.svc.cluster.local:9443"
          - name: DB_SSLMODE
            value: require
          - name: JWK_CERT_URL
            valueFrom:
              secretKeyRef:
                name: hypershell-api-config
                key: api-service.jwkCertUrl
          - name: RBAC_ENFORCE
            value: "true"
          - name: RBAC_SERVICE_ACCOUNTS
            value: "service-account-hypershell-control-plane"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--enable-jwt=true"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--enable-authz=true"
      # NOTE: the OCM/Red Hat AMS client stays mocked via API_ENV=development_oidc
      # (enable-mock=true default), so no explicit --enable-mock flag is needed.
      # A self-contained Keycloak deployment has no sso.redhat.com secret files,
      # and the AMS client is unused here; JWT auth (enable-jwt) and gateway RBAC
      # (RBAC_ENFORCE) are independent of the mock and stay on.
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--jwk-cert-url=$(JWK_CERT_URL)"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--auth-bypass-paths=/healthcheck,/metrics,/api/hypershell/v1/openapi,/openapi"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--auth-bypass-methods=/grpc.health.v1.Health/,/grpc.reflection.v1alpha.ServerReflection/,/hypershell.v1.GatewayService/WatchGateways,/hypershell.v1.GatewayReleaseService/WatchGatewayReleases,/hypershell.v1.ManagedClusterService/WatchManagedClusters,/hypershell.v1.ManagedDatabaseService/WatchManagedDatabases,/hypershell.v1.GatewayNetworkService/WatchGatewayNetworks"
