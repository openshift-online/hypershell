apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - certificates.yaml
  - networkpolicies.yaml
  - route.yaml
  - scc.yaml
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hypershell-controller
        namespace: hypershell-system
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: GATEWAY_API_GATEWAY_CLASS
                    value: openshift-default
                  - name: GATEWAY_API_GATEWAY_NAMESPACE
                    value: openshift-ingress
                  - name: GATEWAY_API_BASE_DOMAIN
                    # OVERRIDE: set to your cluster's wildcard domain
                    value: apps.example.com
                  - name: GATEWAY_API_TLS_ISSUER_NAME
                    value: hypershell-ca-issuer
                  - name: HYPERSHELL_DATABASE_IMAGE
                    # TODO: pin with @sha256: digest (requires registry.redhat.io auth to resolve)
                    value: "registry.redhat.io/rhel9/postgresql-16:1-82"
                  - name: OIDC_ISSUER
                    valueFrom:
                      secretKeyRef:
                        name: hypershell-api-config
                        key: api-service.issuerUrl
                  - name: OIDC_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: hypershell-api-config
                        key: api-service.clientId
                  - name: OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: hypershell-api-config
                        key: api-service.clientSecret
  # --- API server: enable JWT + JWK cert URL from OIDC secret ---
  # The JWKS URL is read from the hypershell-api-config secret so it stays in
  # sync with the Keycloak instance provisioned for this cluster. Without this,
  # the framework defaults to sso.redhat.com and rejects Keycloak-issued tokens.
  - target:
      kind: Deployment
      name: hypershell-api-server
      namespace: hypershell-system
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: JWK_CERT_URL
            valueFrom:
              secretKeyRef:
                name: hypershell-api-config
                key: api-service.jwkCertUrl
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--enable-jwt=true"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--enable-authz=true"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--jwk-cert-url=$(JWK_CERT_URL)"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--auth-bypass-paths=/healthcheck,/metrics,/api/hypershell/v1/openapi,/openapi"
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: "--auth-bypass-methods=/grpc.health.v1.Health/,/grpc.reflection.v1alpha.ServerReflection/,/hypershell.v1.FleetService/WatchFleets,/hypershell.v1.GatewayService/WatchGateways,/hypershell.v1.GatewayReleaseService/WatchGatewayReleases,/hypershell.v1.ManagedClusterService/WatchManagedClusters,/hypershell.v1.ManagedDatabaseService/WatchManagedDatabases,/hypershell.v1.GatewayNetworkService/WatchGatewayNetworks"
