# Pre-requisite Gateway resource for OpenShell GRPCRoutes.
#
# The control plane does NOT create Gateway resources — an administrator
# provisions this as cluster infrastructure, similar to a GatewayClass.
# All tenant GRPCRoutes attach to this shared Gateway.
#
# Before applying, set up:
#   1. A ClusterIssuer for your domain (see GATEWAY-SETUP.md)
#   2. A cert-manager Certificate for the wildcard hostname
#
# Then update the hostname and certificateRefs below to match your environment.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshell-grpc-gateway
  namespace: openshift-ingress
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: grpc
      hostname: "*.openshell.example.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-openshell-tls
            kind: Secret
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: GRPCRoute
        namespaces:
          from: All
