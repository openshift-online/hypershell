apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - external-secret.yaml
patches:
  - target:
      kind: Deployment
      name: hypershell-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hypershell-controller
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: GATEWAY_DATABASE_ADMIN_SECRET_NAME
                    value: gateway-database-admin
