apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hypershell-gateway-database-admin
  namespace: hypershell-system
  labels:
    app.kubernetes.io/name: hypershell
    app.kubernetes.io/component: controller
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    # OVERRIDE: the ClusterSecretStore that can read the gateway-database
    # credentials for this environment.
    name: gateway-databases
  target:
    name: hypershell-gateway-database-admin
    creationPolicy: Owner
    template:
      type: Opaque
      # Merge keeps every key pulled from the remote JSON document (host, port,
      # user, password, sslrootcert, optional dbname) and adds/pins the ones
      # below. The controller rejects any sslmode other than verify-full, so it
      # is fixed here rather than trusted from the store.
      mergePolicy: Merge
      data:
        sslmode: verify-full
  dataFrom:
    - extract:
        # OVERRIDE: remote key holding a JSON document with the fields listed
        # in README.md. Every top-level field becomes a Secret key.
        key: hypershell/production/gateway-database
