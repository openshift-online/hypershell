apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenShift platform package: namespace, privileged controller, monitoring,
# shared certificates/network policies, cluster RBAC, and SCC bindings.
# This does not install the operators/CRDs required by these resources.
resources:
  - ../../base/platform-resources
  - scc.yaml
