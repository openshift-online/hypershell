apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Optional cost dashboard rate card (WEB-COST-03). See README.md.
configMapGenerator:
  - name: hypershell-cost-rate-card
    namespace: hypershell-system
    files:
      - rate-card.json
    options:
      disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: hypershell-web-console
    path: web-console.yaml
