# yaml-language-server: $schema=https://docs.mergify.com/mergify-configuration-schema.json
# Open Source plan: one ordered queue with parallel speculative validation.
# Desired state: specs/platform/mergify-parallel-merge-queue.spec.md (CICD-MRG).
# Scopes, multi-PR batching, priorities and two-step CI are intentionally absent.
queue_rules:
  - name: agent/review-code-approved
    queue_conditions:
      - base = main
      - label = agent/review-code-approved
      - -draft
      - check-success = Checks CI Gate
      - check-success = Tests CI Gate
    merge_method: squash
    # Inject any additional GitHub required checks at both entry and merge.
    # Mergify has a confirmed bypass of the native GitHub merge-queue rule.
    branch_protection_injection_mode: queue
    commit_message_format:
      title: pr-title
      body: inherit
      trailers: []
merge_queue:
  mode: serial
  max_parallel_checks: 10
pull_request_rules:
  - name: Automatically queue approved and validated pull requests
    conditions:
      - base = main
      - label = agent/review-code-approved
      - -draft
      - check-success = Checks CI Gate
      - check-success = Tests CI Gate
    actions:
      queue:
        name: agent/review-code-approved
