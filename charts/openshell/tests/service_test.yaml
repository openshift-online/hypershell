suite: Gateway Service
templates:
  - templates/service.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  # OSG-ROUT-13.03 -- the Service exposes a grpc port (appProtocol: grpc) and an
  # http port (appProtocol: http), both targeting the single gateway pod port.
  - it: exposes dual-protocol grpc and http ports on the same backend pod port
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: openshell
      # gRPC port carries the Gateway's HTTP/2 traffic.
      - equal:
          path: spec.ports[0].name
          value: grpc
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].appProtocol
          value: grpc
      - equal:
          path: spec.ports[0].targetPort
          value: grpc
      # HTTP/1.1 port carries sandbox-service / WebSocket traffic; it targets the
      # same pod container port (grpc) as the gRPC port.
      - equal:
          path: spec.ports[1].name
          value: http
      - equal:
          path: spec.ports[1].port
          value: 8090
      - equal:
          path: spec.ports[1].appProtocol
          value: http
      - equal:
          path: spec.ports[1].targetPort
          value: grpc

  - it: omits the http port when service.httpPort is unset
    set:
      service.httpPort: null
    asserts:
      - notContains:
          path: spec.ports
          content:
            name: http
          any: true
