packages:
  - tools/architecture-site
  - components/sdk-typescript
  - packages/fleet-dashboard-ui
  - packages/gateway-management-ui
  - packages/operational-dashboard-ui
  - components/web-console
  - components/web-console/bff
  - components/web-console/domain-probes
  - packages/spec-viewer-ui

registries:
  default: https://registry.npmjs.org/

sharedWorkspaceLockfile: true
saveExact: true
saveWorkspaceProtocol: true
linkWorkspacePackages: false
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
strictPeerDependencies: true
disallowWorkspaceCycles: true
failIfNoMatch: true
# engines.node is the compatibility floor (Mintmaker/Renovate runs Node 24.11.0).
# .node-version pins the recommended version for local dev, CI, and container builds.
engineStrict: true

minimumReleaseAge: 20160
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # @babel/core resolves this legacy semver line; 6.3.1 predates npm provenance
  # adoption and is still protected by the committed lockfile integrity hash.
  - semver@6.3.1
trustLockfile: false
blockExoticSubdeps: true

verifyStoreIntegrity: true
strictStorePkgContentCheck: true
verifyDepsBeforeRun: error
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  esbuild@0.28.2: true
  msw@2.15.0: false
minimumReleaseAgeExclude:
  # Renovate security update: vite@8.1.6
  - vite@8.1.6
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
  # Renovate security update: fastify@5.12.6
  - fastify@5.12.6
  # Renovate security update: storybook@10.6.2
  - storybook@10.6.2
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: @vitest/coverage-v8@4.1.11
  - "@vitest/coverage-v8@4.1.11"
