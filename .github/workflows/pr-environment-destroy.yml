name: Destroy PR Environment

# Tears down the ephemeral OpenShift environment when an origin pull request
# merges or closes (ephemeral-pr-environments.spec.md). Lives in its own
# workflow so Tests / E2E deploy and OpenShift jobs do not list a skipped
# "Destroy PR environment" check. GitHub's pull_request `closed` event covers
# both merge and close-without-merge. Destroys whether or not the pull
# request was retained.
#
# Shares the per-PR concurrency group with E2E / Deploy OpenShift Environment and
# E2E / OpenShift so a close cancels an in-flight deploy or suite rather
# than racing it. The out-of-band reaper (deploy/e2e/reaper) is the backstop
# when this event does not fire.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  PR_ENV_AWS_ROLE_ARN: ${{ vars.PR_ENV_AWS_ROLE_ARN || 'arn:aws:iam::451971655738:role/hypershell-ci-hysh-aws-01-cluster-login' }}

concurrency:
  group: pr-env-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  destroy:
    name: Destroy PR environment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      OPENSHIFT_NAMESPACE: hypershell-ci-pr-${{ github.event.pull_request.number }}
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install oc
        run: |
          mkdir -p "$(dirname "${KUBECONFIG}")"
          curl -LsS https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin oc kubectl
          oc version --client

      - name: Log in to the target cluster
        uses: ./.github/actions/openshift-cluster-login
        with:
          role-arn: ${{ env.PR_ENV_AWS_ROLE_ARN }}

      # Primary destroy path. The out-of-band reaper is the backstop when this
      # event does not fire. If teardown cannot confirm the destroy, fail so an
      # operator frees the environment.
      - name: Remove environment (make openshift-down)
        run: make openshift-down
