name: ZZZ Debug HYPERSHELL-488 (temporary)

# TEMPORARY diagnostic workflow. Not a reusable/workflow_call workflow, so it
# can declare its own top-level permissions without an escalation restriction
# from a caller. Runs the same api-server unit-test command the real "Unit /
# Go - API server" job runs, and posts a failure excerpt as a PR comment so it
# can be read without access to the Actions log blob storage. Delete this file
# before merge.

on:
  push:
    branches:
      - implementer/spec-HYPERSHELL-488-default-workspace-membership

permissions:
  contents: read
  pull-requests: write

jobs:
  debug-api-server-tests:
    name: Debug API server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: components/api-server/go.mod
          cache-dependency-path: components/api-server/go.sum
      - name: Run API server unit tests
        working-directory: components/api-server
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/api-server-test.log
      - name: Post excerpt on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<details><summary>TEMP DEBUG: api-server unit test failures</summary>'
            echo
            echo '```'
            grep -n -B 5 -A 60 -- '--- FAIL\|^FAIL\|panic:\|DATA RACE' /tmp/api-server-test.log | head -c 55000
            echo '```'
            echo '</details>'
          } > /tmp/pr-comment-body.md
          gh pr comment 982 --repo openshift-online/hypershell --body-file /tmp/pr-comment-body.md
