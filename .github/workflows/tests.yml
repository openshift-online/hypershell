name: Tests

# Orchestrator for the unit/e2e pipeline. Checks (lint, repository policy,
# SDK drift) lives in the separate, independently-triggered
# .github/workflows/checks.yml so it shows as its own entry in the PR checks
# list and runs fully concurrently with this workflow -- GitHub Actions
# `needs:` only works within a single workflow file, so Checks cannot gate
# Tests without a cross-workflow poller, and this repo deliberately avoids
# that pattern for Unit vs Checks. Each triggers its own `detect-changes`
# job rather than sharing one, which is the cost of that split. The one
# exception is Tests / E2E / OpenShift, which needs the Deploy OpenShift
# Environment job in e2e.yml (same should_run gate) because
# that environment is the suite's target.
#
# Within this workflow, unit and e2e are reusable workflows (on:
# workflow_call) that both depend only on detect-changes, so they run
# concurrently: e2e's slow cluster setup overlaps the unit stage. The cost is
# that a SHA whose unit tests fail still spends an e2e run. The Tests CI Gate
# fails only on the unit stage (CICD-MRG-05): E2E's 10-20 minute runtime is
# deliberately kept off the required merge path, so a failed or pending E2E
# never blocks the merge queue even though it still runs and reports its
# `E2E / <job>` checks. e2e does not wait on Checks either; a lint/policy/drift
# failure alone will not stop e2e from starting.
#
# Change detection runs exactly once here (the detect-changes job) and is
# passed into each stage as inputs; the stage workflows no longer detect
# internally.
#
# Each stage is a reusable-workflow call, so its individual jobs surface as
# `Unit / <job>` and (once it runs) `E2E / <job>` checks -- there is no
# single check named just `Unit`/`E2E`. To give branch protection a stable,
# always-present required check, the `tests-gate` job below runs with
# `if: always()`, reads the detect-changes and unit rolled-up `result` via
# `needs` (NOT e2e -- CICD-MRG-05), and fails unless detect-changes succeeded
# and the unit stage did not fail or get cancelled. Because it always runs, it
# is never left pending by path-filtered skips (a skipped stage still passes
# the gate), so THIS is
# the check to mark required in branch protection alongside checks.yml's own
# gate job. The two are named distinctly (`Tests CI Gate` here, `Checks CI
# Gate` there) rather than both plain `CI Gate`: this repo's branch
# protection is a ruleset whose required_status_checks match by
# (context name, integration_id) only, not by workflow file, and both
# workflows' checks share the same "GitHub Actions" integration_id -- so two
# identically-named gates from different workflows would be indistinguishable
# to the ruleset, and either one succeeding could satisfy the requirement
# while the other silently failed.
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

# Union of the permissions the called workflows need. A reusable workflow can
# never be granted more than its caller, so this ceiling must cover e2e's
# `checks: read` (Konflux build waits) and `pull-requests: write` (access
# comment) in addition to the shared `contents: read`. Tests / E2E also
# grants `id-token: write` on the caller job so OpenShift cluster login can
# use GitHub OIDC. e2e.yml does not declare a workflow-level permissions
# block; Kind omits id-token, and only deploy/OpenShift request it.
permissions:
  contents: read
  checks: read
  pull-requests: write

# CICD-MRG-07: post-merge runs on `main` use a SHA-specific concurrency group
# and do NOT cancel in progress, so a rapid series of merges cannot cancel an
# earlier commit's nearly-complete E2E validation -- each pushed commit gets its
# own run to completion. Pull requests still key on the PR number with
# cancel-in-progress so a superseded revision's run is cancelled. merge_group
# keeps the ref-based group (its E2E stage is suppressed below anyway).
concurrency:
  group: >-
    tests-${{
      github.event.pull_request.number ||
      (github.event_name == 'push' && format('sha-{0}', github.sha)) ||
      github.ref
    }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  detect-changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    outputs:
      api_server: ${{ steps.detect.outputs.api_server }}
      bash_tests: ${{ steps.detect.outputs.bash_tests }}
      cli: ${{ steps.detect.outputs.cli }}
      control_plane: ${{ steps.detect.outputs.control_plane }}
      e2e: ${{ steps.detect.outputs.e2e }}
      gateway_management_ui: ${{ steps.detect.outputs.gateway_management_ui }}
      operational_dashboard_ui: ${{ steps.detect.outputs.operational_dashboard_ui }}
      pr_test: ${{ steps.detect.outputs.pr_test }}
      sdk_go: ${{ steps.detect.outputs.sdk_go }}
      sdk_typescript: ${{ steps.detect.outputs.sdk_typescript }}
      web_console: ${{ steps.detect.outputs.web_console }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed components
        id: detect
        run: bash .github/scripts/detect-components.sh

  unit:
    name: Unit
    needs: detect-changes
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read
    with:
      api_server: ${{ needs.detect-changes.outputs.api_server }}
      bash_tests: ${{ needs.detect-changes.outputs.bash_tests }}
      cli: ${{ needs.detect-changes.outputs.cli }}
      control_plane: ${{ needs.detect-changes.outputs.control_plane }}
      gateway_management_ui: ${{ needs.detect-changes.outputs.gateway_management_ui }}
      operational_dashboard_ui: ${{ needs.detect-changes.outputs.operational_dashboard_ui }}
      sdk_go: ${{ needs.detect-changes.outputs.sdk_go }}
      sdk_typescript: ${{ needs.detect-changes.outputs.sdk_typescript }}
      web_console: ${{ needs.detect-changes.outputs.web_console }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODECOV_ENTERPRISE_URL: ${{ secrets.CODECOV_ENTERPRISE_URL }}

  # Runs concurrently with unit (needs only change detection) and is NOT part
  # of the Tests CI Gate (CICD-MRG-05). CICD-MRG-06: the e2e job below is the
  # operative E2E suppression for the merge path. It skips this expensive call on
  # same-repo Mergify temporary queue PRs, whose head branch carries Mergify's
  # queue_branch_prefix. The default prefix is `mergify/merge-queue/`
  # (docs.mergify.com/merge-queue/rules/, verified 2026-10-22); the legacy
  # `tmp-mergify/merge-queue/` variant is matched too so a prefix change across
  # Mergify versions does not quietly re-enable E2E on queue PRs. The prefix is
  # trusted only on same-repo PRs so a fork PR cannot self-suppress by spoofing
  # it. head_ref is empty for push/workflow_dispatch, so ordinary PRs, push to
  # main, and manual dispatch still run E2E (draft status alone does not
  # suppress it). The merge_group guard is a defensive no-op: this repo uses
  # Mergify's draft-PR queue, not GitHub's native merge queue, so merge_group
  # never fires here. If the prefix were ever wrong the failure is fail-open and
  # visible (E2E simply runs and reports as checks), never a silent merge break.
  #
  # Keep the `id-token: write` grant close under `name: E2E`:
  # scripts/ci/ephemeral-ci-secrets_test.sh locks that the E2E caller grants it,
  # so do not reinsert a comment block between the job name and the permissions.
  e2e:
    name: E2E
    if: >-
      github.event_name != 'merge_group' &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.head_ref, 'mergify/merge-queue/') ||
         startsWith(github.head_ref, 'tmp-mergify/merge-queue/')))
    needs: detect-changes
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      checks: read
      pull-requests: write
      id-token: write
    secrets: inherit
    with:
      api_server: ${{ needs.detect-changes.outputs.api_server }}
      control_plane: ${{ needs.detect-changes.outputs.control_plane }}
      e2e: ${{ needs.detect-changes.outputs.e2e }}
      pr_test: ${{ needs.detect-changes.outputs.pr_test }}

  # Stable rollup check for branch protection. Always runs, so a
  # path-filtered stage that skips its internal jobs never leaves a required
  # check pending. A stage that was skipped (result 'skipped') passes the
  # gate; only an actual 'failure'/'cancelled' -- or a detect-changes that did
  # not succeed -- fails it.
  #
  # CICD-MRG-05: this gate depends only on detect-changes and unit -- NOT e2e.
  # E2E's 10-20 minute runtime no longer gates the merge path; it still runs as
  # a stage of this workflow (concurrently with unit) and its result is visible
  # as `E2E / <job>` checks for developer awareness, but a failed or pending
  # E2E never blocks the merge queue. A unit failure still fails the gate.
  tests-gate:
    name: Tests CI Gate
    needs:
      - detect-changes
      - unit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify unit stage passed
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          if [[ "${DETECT_RESULT}" != "success" ]]; then
            echo "detect-changes did not succeed (result: ${DETECT_RESULT})"
            exit 1
          fi
          if [[ "${UNIT_RESULT}" == "failure" || "${UNIT_RESULT}" == "cancelled" ]]; then
            echo "Unit stage did not pass (result: ${UNIT_RESULT})"
            exit 1
          fi
          echo "Tests gate OK (unit: ${UNIT_RESULT}; e2e is not part of the merge gate)"
