name: Tests

# Single orchestrator for the checks/unit/e2e pipeline. Each stage is a
# reusable workflow (on: workflow_call) wired with native `needs:` gating --
# no cross-workflow `wait-on-check-action` polling.
#
# Topology is fan-out then join: checks and unit both run straight after
# detect-changes (concurrently, so a checks failure never delays unit and vice
# versa), and e2e joins on BOTH. e2e is the expensive stage -- it provisions
# Kind and runs the full test matrix -- so gating it behind the cheap stages
# means we never spend a deploy+test cycle on a SHA that checks or unit
# already failed, and such failures surface as a clean red Checks/Unit check
# instead of a misleading e2e "environment did not deploy". The wall-clock
# cost is small: Konflux image builds are triggered by the push itself and
# run during checks/unit regardless, so by the time the join clears they are
# mostly done and e2e's build wait is short.
#
# Change detection runs exactly once here (the detect-changes job) and is
# passed into each stage as inputs; the stage workflows no longer detect
# internally. Repository policy (`make check`) and OpenAPI SDK drift, which
# used to be their own independently-triggered workflows, are now jobs inside
# the `checks` stage so they run off this same detection pass instead of
# duplicating change detection.
#
# Each stage is a reusable-workflow call, so its individual jobs surface as
# `Checks / <job>`, `Unit / <job>`, and (once it runs) `E2E / <job>` checks --
# there is no single check named just `Checks`/`Unit`/`E2E`. To give branch
# protection stable, always-present required checks, the two `*-gate` jobs
# below run with `if: always()`, read the relevant stage(s) rolled-up
# `result` via `needs`, and fail unless detect-changes succeeded and no
# covered stage failed or was cancelled:
#   - `Checks CI Gate` covers the `checks` stage alone.
#   - `Tests CI Gate` covers both `unit` and `e2e` as a single required check,
#     since they are both "running the code" stages as opposed to static
#     checks.
# Because they always run, they are never left pending by path-filtered
# skips (a skipped stage still passes its gate), so THESE are the checks to
# mark required in branch protection.
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

# Union of the permissions the called workflows need. A reusable workflow can
# never be granted more than its caller, so this ceiling must cover e2e's
# `checks: read` (Konflux build waits) in addition to the shared `contents:
# read`.
permissions:
  contents: read
  checks: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    outputs:
      api_server: ${{ steps.detect.outputs.api_server }}
      bash_tests: ${{ steps.detect.outputs.bash_tests }}
      cli: ${{ steps.detect.outputs.cli }}
      control_plane: ${{ steps.detect.outputs.control_plane }}
      e2e: ${{ steps.detect.outputs.e2e }}
      gateway_management_ui: ${{ steps.detect.outputs.gateway_management_ui }}
      operational_dashboard_ui: ${{ steps.detect.outputs.operational_dashboard_ui }}
      pr_test: ${{ steps.detect.outputs.pr_test }}
      sdk_go: ${{ steps.detect.outputs.sdk_go }}
      sdk_typescript: ${{ steps.detect.outputs.sdk_typescript }}
      web_console: ${{ steps.detect.outputs.web_console }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed components
        id: detect
        run: bash .github/scripts/detect-components.sh

  checks:
    name: Checks
    needs: detect-changes
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      api_server: ${{ needs.detect-changes.outputs.api_server }}
      cli: ${{ needs.detect-changes.outputs.cli }}
      control_plane: ${{ needs.detect-changes.outputs.control_plane }}
      gateway_management_ui: ${{ needs.detect-changes.outputs.gateway_management_ui }}
      operational_dashboard_ui: ${{ needs.detect-changes.outputs.operational_dashboard_ui }}
      pr_test: ${{ needs.detect-changes.outputs.pr_test }}
      sdk_go: ${{ needs.detect-changes.outputs.sdk_go }}
      sdk_typescript: ${{ needs.detect-changes.outputs.sdk_typescript }}
      web_console: ${{ needs.detect-changes.outputs.web_console }}

  unit:
    name: Unit
    needs: detect-changes
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read
    with:
      api_server: ${{ needs.detect-changes.outputs.api_server }}
      bash_tests: ${{ needs.detect-changes.outputs.bash_tests }}
      cli: ${{ needs.detect-changes.outputs.cli }}
      control_plane: ${{ needs.detect-changes.outputs.control_plane }}
      gateway_management_ui: ${{ needs.detect-changes.outputs.gateway_management_ui }}
      operational_dashboard_ui: ${{ needs.detect-changes.outputs.operational_dashboard_ui }}
      sdk_go: ${{ needs.detect-changes.outputs.sdk_go }}
      sdk_typescript: ${{ needs.detect-changes.outputs.sdk_typescript }}
      web_console: ${{ needs.detect-changes.outputs.web_console }}

  e2e:
    name: E2E
    needs:
      - detect-changes
      - checks
      - unit
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      checks: read
    with:
      api_server: ${{ needs.detect-changes.outputs.api_server }}
      control_plane: ${{ needs.detect-changes.outputs.control_plane }}
      e2e: ${{ needs.detect-changes.outputs.e2e }}
      pr_test: ${{ needs.detect-changes.outputs.pr_test }}

  # Stable rollup checks for branch protection. Each always runs, so a
  # path-filtered stage that skips its internal jobs never leaves a required
  # check pending. A stage that was skipped (result 'skipped') passes its
  # gate; only an actual 'failure'/'cancelled' -- or a detect-changes that did
  # not succeed -- fails it.
  checks-gate:
    name: Checks CI Gate
    needs:
      - detect-changes
      - checks
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify checks stage passed
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          STAGE_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "${DETECT_RESULT}" != "success" ]]; then
            echo "detect-changes did not succeed (result: ${DETECT_RESULT})"
            exit 1
          fi
          if [[ "${STAGE_RESULT}" == "failure" || "${STAGE_RESULT}" == "cancelled" ]]; then
            echo "Checks stage did not pass (result: ${STAGE_RESULT})"
            exit 1
          fi
          echo "Checks stage OK (result: ${STAGE_RESULT})"

  tests-gate:
    name: Tests CI Gate
    needs:
      - detect-changes
      - unit
      - e2e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify unit and e2e stages passed
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [[ "${DETECT_RESULT}" != "success" ]]; then
            echo "detect-changes did not succeed (result: ${DETECT_RESULT})"
            exit 1
          fi
          if [[ "${UNIT_RESULT}" == "failure" || "${UNIT_RESULT}" == "cancelled" ]]; then
            echo "Unit stage did not pass (result: ${UNIT_RESULT})"
            exit 1
          fi
          if [[ "${E2E_RESULT}" == "failure" || "${E2E_RESULT}" == "cancelled" ]]; then
            echo "E2E stage did not pass (result: ${E2E_RESULT})"
            exit 1
          fi
          echo "Tests stages OK (unit: ${UNIT_RESULT}, e2e: ${E2E_RESULT})"
