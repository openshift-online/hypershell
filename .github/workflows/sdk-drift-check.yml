name: OpenAPI SDK drift

on:
  pull_request:
    paths:
      - components/api-server/openapi/**
      - components/api-server/pkg/api/openapi/**
      - components/sdk-typescript/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/sdk-generator/**
      - components/api-server/Dockerfile.openapi
      - components/api-server/Makefile
      - .github/workflows/sdk-drift-check.yml
  push:
    branches:
      - main
    paths:
      - components/api-server/openapi/**
      - components/api-server/pkg/api/openapi/**
      - components/sdk-typescript/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/sdk-generator/**
      - components/api-server/Dockerfile.openapi
      - components/api-server/Makefile
      - .github/workflows/sdk-drift-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-drift:
    name: Check generated OpenAPI SDK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: scripts/sdk-generator/go.mod
          cache-dependency-path: scripts/sdk-generator/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: bash scripts/bootstrap_pnpm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate OpenAPI SDK
        working-directory: components/api-server
        run: make generate generate-sdk
      - name: Check for drift
        run: |
          drift="$(git status --porcelain --untracked-files=all -- components/api-server/pkg/api/openapi components/sdk-typescript/src)"
          if [[ -n "${drift}" ]]; then
            echo "Generated OpenAPI SDK files are out of date."
            echo "Run 'cd components/api-server && make generate generate-sdk' and commit the result."
            echo "Changed files:"
            echo "${drift}"
            git diff -- components/api-server/pkg/api/openapi components/sdk-typescript/src
            exit 1
          fi
          echo "Generated OpenAPI SDK files are up to date."
