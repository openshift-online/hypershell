name: Unit

# Reusable unit-test stage of the Tests pipeline. Invoked by
# .github/workflows/tests.yml, which runs it concurrently with the E2E stage
# (both depend only on detect-changes). The separate Checks workflow
# (.github/workflows/checks.yml, lint/policy/drift) runs fully concurrently
# with Tests as its own top-level entry in the PR checks list -- GitHub
# Actions `needs:` cannot gate across independently-triggered workflows
# without a cross-workflow poller, which this repo deliberately avoids.
# tests.yml owns the triggers, concurrency group, stage sequencing, and
# change detection: the per-component flags below arrive as inputs instead
# of being detected here. The stage's rolled-up result, together with e2e's,
# is turned into a single required check by the `Tests CI Gate` job in tests.yml,
# so this workflow needs no summary/gate job of its own.
on:
  workflow_call:
    inputs:
      api_server:
        type: string
        default: 'false'
      bash_tests:
        type: string
        default: 'false'
      cli:
        type: string
        default: 'false'
      control_plane:
        type: string
        default: 'false'
      gateway_management_ui:
        type: string
        default: 'false'
      operational_dashboard_ui:
        type: string
        default: 'false'
      sdk_go:
        type: string
        default: 'false'
      sdk_typescript:
        type: string
        default: 'false'
      spec_viewer:
        type: string
        default: 'false'
      web_console:
        type: string
        default: 'false'
    # Optional: absent on fork pull requests, where the upload step skips.
    secrets:
      CODECOV_TOKEN:
        required: false
      CODECOV_ENTERPRISE_URL:
        required: false

# Shared by every "Upload coverage" step (scripts/codecov-upload.sh).
# On pull requests coverage is attached to the PR head commit, not the
# synthetic merge commit in github.sha.
env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  CODECOV_ENTERPRISE_URL: ${{ secrets.CODECOV_ENTERPRISE_URL }}
  CODECOV_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CODECOV_BRANCH: ${{ github.head_ref || github.ref_name }}
  CODECOV_PR: ${{ github.event.pull_request.number }}
  CODECOV_PARENT_SHA: ${{ github.event.pull_request.base.sha }}

permissions:
  contents: read

jobs:
  test-frontend:
    name: Frontend
    if: >-
      inputs.web_console == 'true' ||
      inputs.gateway_management_ui == 'true' ||
      inputs.operational_dashboard_ui == 'true' ||
      inputs.spec_viewer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: bash scripts/bootstrap_pnpm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend unit tests
        run: pnpm run test:web

  test-api-server:
    name: Go - API server
    if: inputs.api_server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # All plugins/* packages self-provision PostgreSQL via testcontainers-go
    # once API_ENV=integration_testing is set (see the Makefile's test target).
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: components/api-server/go.mod
          cache-dependency-path: components/api-server/go.sum
      - name: Run API server unit tests
        working-directory: components/api-server
        run: make test GO_TEST_FLAGS="-coverprofile=coverage.out -covermode=atomic"
      - name: Upload api-server coverage
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        # Coverage reporting must never block a merge on a Codecov outage.
        continue-on-error: true
        run: bash scripts/codecov-upload.sh api-server components/api-server/coverage.out

  test-control-plane:
    name: Go - control plane
    if: inputs.control_plane == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: components/control-plane/go.mod
          cache-dependency-path: components/control-plane/go.sum
      - name: Run control plane unit tests
        working-directory: components/control-plane
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload control-plane coverage
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        # Coverage reporting must never block a merge on a Codecov outage.
        continue-on-error: true
        run: bash scripts/codecov-upload.sh control-plane components/control-plane/coverage.out

  test-cli:
    name: Go - CLI
    if: >-
      inputs.cli == 'true' ||
      inputs.sdk_go == 'true' ||
      inputs.sdk_typescript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: components/cli/go.mod
          cache-dependency-path: |
            components/cli/go.sum
            scripts/sdk-generator/go.sum
      - name: Run CLI unit tests
        if: inputs.cli == 'true'
        working-directory: components/cli
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload cli coverage
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && (inputs.cli == 'true')
        # Coverage reporting must never block a merge on a Codecov outage.
        continue-on-error: true
        run: bash scripts/codecov-upload.sh cli components/cli/coverage.out
      - name: Run SDK generator unit tests
        if: >-
          inputs.sdk_go == 'true' ||
          inputs.sdk_typescript == 'true'
        working-directory: scripts/sdk-generator
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload sdk-generator coverage
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && (inputs.sdk_go == 'true' || inputs.sdk_typescript == 'true')
        # Coverage reporting must never block a merge on a Codecov outage.
        continue-on-error: true
        run: bash scripts/codecov-upload.sh sdk-generator scripts/sdk-generator/coverage.out

  test-bash:
    name: Shell
    if: inputs.bash_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for local dispatcher tests
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .hypershell/execute-sdlc/dispatcher/go.mod
          cache-dependency-path: .hypershell/execute-sdlc/dispatcher/go.sum
      - name: Run discovered *_test.sh tests
        run: make ci-test
