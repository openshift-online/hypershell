name: E2E

# Reusable final stage of the Tests pipeline. Invoked by
# .github/workflows/tests.yml only after the Unit stage succeeds
# (parent-level `needs: [detect-changes, unit]`), so Kind never spins up
# against a SHA whose unit tests are failing -- no wasted e2e run, and no
# in-workflow poller waiting on that gate. It does NOT wait on the separate
# Checks workflow (.github/workflows/checks.yml, lint/policy/drift) -- that
# workflow runs fully concurrently with Tests as its own top-level entry in
# the PR checks list, and GitHub Actions `needs:` cannot gate across
# independently-triggered workflows without a cross-workflow poller, which
# this repo deliberately avoids for Unit vs Checks. tests.yml owns the
# triggers, concurrency group, stage sequencing, and change detection: the
# per-component flags used by plan-images arrive as inputs instead of being
# detected here. The stage's rolled-up result, together with unit's, is
# turned into a single required check by the `Tests CI Gate` job in
# tests.yml, so this workflow needs no summary/gate job of its own. The
# `checks: read` permission and the wait-on-check-action steps below remain:
# they gate on Konflux image builds, which this workflow cannot order with
# `needs:`. Deploy OpenShift Environment lives in this workflow so OpenShift can
# `needs:` it instead of polling a separate PR Environment workflow, and so
# unit failure (this stage never starts) skips deploy. After the suite, the
# OpenShift job tears the environment down unless the pull request is marked
# retained (/pr-extend). Origin pull requests deploy hypershell-ci-pr-<n>;
# push to main deploys hypershell-ci-main-<short-sha>; a merge queue entry
# deploys hypershell-ci-mq-<short-sha> -- both per-commit so a cancelled
# older run cannot tear down a newer deploy's namespace. Concurrency keys on
# the PR number, 'main', or the merge-queue commit SHA so unrelated runs
# never cancel each other while rapid pushes to the same target still
# serialize. Neither main nor a merge queue entry ever carries the
# retainment label, so teardown always runs for them. Fork PRs skip deploy
# and OpenShift (no per-PR environment; a fork PR cannot enter the merge
# queue either).
on:
  workflow_call:
    inputs:
      api_server:
        type: string
        default: 'false'
      control_plane:
        type: string
        default: 'false'
      e2e:
        type: string
        default: 'false'
      pr_test:
        type: string
        default: 'false'

# No workflow-level permissions key: a block here would apply the same grant
# to every job, including Kind. Tests / E2E still grants id-token: write on
# the caller so OpenShift jobs can request it. Kind and plan-images declare
# job permissions that omit id-token, so fork code in Kind cannot mint an
# OIDC token (ephemeral-ci-secrets.spec.md).

env:
  KONFLUX_REGISTRY: quay.io/redhat-user-workloads/hcm-eng-prod-tenant/hypershell-main
  BASELINE_REGISTRY: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main
  PR_ENV_AWS_ROLE_ARN: ${{ vars.PR_ENV_AWS_ROLE_ARN || 'arn:aws:iam::451971655738:role/hypershell-ci-hysh-aws-01-cluster-login' }}

jobs:
  plan-images:
    name: Plan component images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      api_server_image: ${{ steps.plan.outputs.api_server_image }}
      control_plane_image: ${{ steps.plan.outputs.control_plane_image }}
      web_console_image: ${{ steps.plan.outputs.web_console_image }}
      wait_api_server: ${{ steps.plan.outputs.wait_api_server }}
      wait_control_plane: ${{ steps.plan.outputs.wait_control_plane }}
      wait_web_console: ${{ steps.plan.outputs.wait_web_console }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only components whose path-filtered pipelines actually run may use the
      # event's commit-tagged image and wait for the corresponding check.
      # Only pull_request, merge_group, and push events select a real
      # Konflux pipeline suffix; workflow_dispatch has none, so plan-images'
      # `*` branch below does not depend on this step.
      - name: Compute changed files
        id: diff
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group' ||
          github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          case "${EVENT_NAME}" in
            pull_request)
              # Three-dot (merge-base) diff: compares the PR head against the
              # point where this PR forked from the base branch, so a
              # component change that landed on the base branch *after* this
              # PR forked is never misattributed to the PR.
              changed_files="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")"
              pipeline_suffix="pull-request"
              ;;
            merge_group)
              changed_files="$(git diff --name-only "${MERGE_GROUP_BASE_SHA}...${PUSH_SHA}")"
              pipeline_suffix="merge-queue"
              ;;
            push)
              if [[ -z "${PUSH_BEFORE_SHA}" || "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
                changed_files="$(git show --pretty=format: --name-only "${PUSH_SHA}")"
              else
                changed_files="$(git diff --name-only "${PUSH_BEFORE_SHA}...${PUSH_SHA}")"
              fi
              pipeline_suffix="push"
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          echo "pipeline_suffix=${pipeline_suffix}" >> "${GITHUB_OUTPUT}"
          {
            echo "changed_files<<EOF"
            echo "${changed_files}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Detect Konflux components
        id: detect-konflux
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group' ||
          github.event_name == 'push'
        uses: ./.github/actions/detect-konflux-components
        with:
          changed-files: ${{ steps.diff.outputs.changed_files }}
          pipeline-suffix: ${{ steps.diff.outputs.pipeline_suffix }}

      - name: Plan images and required Konflux builds
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          DETECT_API_SERVER: ${{ inputs.api_server }}
          DETECT_CONTROL_PLANE: ${{ inputs.control_plane }}
          DETECT_E2E: ${{ inputs.e2e }}
          DETECT_PR_TEST: ${{ inputs.pr_test }}
          KONFLUX_API_SERVER: ${{ steps.detect-konflux.outputs.api_server }}
          KONFLUX_CONTROL_PLANE: ${{ steps.detect-konflux.outputs.control_plane }}
          KONFLUX_WEB_CONSOLE: ${{ steps.detect-konflux.outputs.web_console }}
        run: |
          baseline_api="${BASELINE_REGISTRY}/hypershell-api-server-main:latest"
          baseline_cp="${BASELINE_REGISTRY}/hypershell-control-plane-main:latest"
          baseline_wc="${BASELINE_REGISTRY}/hypershell-web-console-main:latest"

          # Default: nothing to wait for. The e2e-kind job waits for Konflux builds
          # sequentially before e2e tests when the current event triggers a
          # component build.
          echo "wait_api_server=false"    >> "${GITHUB_OUTPUT}"
          echo "wait_control_plane=false" >> "${GITHUB_OUTPUT}"
          echo "wait_web_console=false"   >> "${GITHUB_OUTPUT}"

          # Shared e2e-relevant gate for pull_request and merge_group. detect-
          # components tracks api_server, control_plane, e2e, and pr_test
          # (broad: Makefile, deploy, tests, workflow files). Web-console is
          # narrower: only Konflux CEL paths, so an SDK/lockfile-only change
          # does not spin Kind. merge_group uses the batch diff against
          # merge_group.base_sha, so a docs PR batched with a component change
          # still runs.
          detect_e2e_relevant=false
          if [[ "${DETECT_API_SERVER:-false}" == "true" || \
                "${DETECT_CONTROL_PLANE:-false}" == "true" || \
                "${DETECT_E2E:-false}" == "true" || \
                "${DETECT_PR_TEST:-false}" == "true" ]]; then
            detect_e2e_relevant=true
          fi

          case "${EVENT_NAME}" in
            pull_request)
              # Determine which components need a Konflux-built image, via the
              # detect-konflux step above (pipeline-suffix pull-request).
              # detect-components (DETECT_*) uses broad paths (includes
              # Makefile, .github/, sdk-typescript, lockfiles, etc.) which is
              # correct for lint but NOT for "will Konflux build an image" or
              # "should Kind e2e run". A PR that changes only the pipeline
              # file itself (or, for control-plane, the root Dockerfile)
              # still triggers that component's on-pr build, so we must wait
              # for it -- otherwise we silently fall back to main's image and
              # skip the on-pr image this PR actually produces.
              api_konflux="${KONFLUX_API_SERVER}"
              cp_konflux="${KONFLUX_CONTROL_PLANE}"
              wc_konflux="${KONFLUX_WEB_CONSOLE}"

              e2e_relevant=false
              if [[ "${detect_e2e_relevant}" == "true" || "${wc_konflux}" == "true" ]]; then
                e2e_relevant=true
              fi

              if [[ "${e2e_relevant}" != "true" ]]; then
                echo "No e2e-relevant components changed"
                echo "should_run=false" >> "${GITHUB_OUTPUT}"
                exit 0
              fi

              if [[ "${api_konflux}" != "true" && "${cp_konflux}" != "true" && "${wc_konflux}" != "true" ]]; then
                echo "No source components changed -- using latest Konflux on-push images from main"
                main_sha=$(git rev-parse origin/main)
                main_tag="${main_sha}"
                konflux_api="${KONFLUX_REGISTRY}/hypershell-api-server-main:${main_tag}"
                konflux_cp="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${main_tag}"
                konflux_wc="${KONFLUX_REGISTRY}/hypershell-web-console-main:${main_tag}"
                # Konflux publishes component images independently based on path
                # filters. Use each available main image independently; a component
                # that did not change on main has no commit-tagged image and should
                # use the stable baseline instead of forcing the whole set back to
                # an older revision.
                api_img="${baseline_api}"
                cp_img="${baseline_cp}"
                wc_img="${baseline_wc}"
                if skopeo inspect --raw "docker://${konflux_api}" >/dev/null 2>&1; then
                  api_img="${konflux_api}"
                  echo "  api-server -> ${api_img}"
                else
                  echo "  api-server image not found for main -- using baseline"
                fi
                if skopeo inspect --raw "docker://${konflux_cp}" >/dev/null 2>&1; then
                  cp_img="${konflux_cp}"
                  echo "  control-plane -> ${cp_img}"
                else
                  echo "  control-plane image not found for main -- using baseline"
                fi
                if skopeo inspect --raw "docker://${konflux_wc}" >/dev/null 2>&1; then
                  wc_img="${konflux_wc}"
                  echo "  web-console -> ${wc_img}"
                else
                  echo "  web-console image not found for main -- using baseline"
                fi
                echo "should_run=true" >> "${GITHUB_OUTPUT}"
                echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
                echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
                echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
                exit 0
              fi

              # Source components changed. The image ref is deterministic
              # (on-pr-<head_sha>); e2e-kind waits for the matching Konflux build
              # in parallel with kind-up, then swaps the image in.
              # Components that did not change keep the stable baseline image.
              tag="on-pr-${PR_HEAD_SHA}"
              api_img="${baseline_api}"
              cp_img="${baseline_cp}"
              wc_img="${baseline_wc}"

              if [[ "${api_konflux}" == "true" ]]; then
                api_img="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"
                echo "wait_api_server=true" >> "${GITHUB_OUTPUT}"
                echo "  api-server -> ${api_img} (waiting for Konflux build)"
              fi
              if [[ "${cp_konflux}" == "true" ]]; then
                cp_img="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"
                echo "wait_control_plane=true" >> "${GITHUB_OUTPUT}"
                echo "  control-plane -> ${cp_img} (waiting for Konflux build)"
              fi
              if [[ "${wc_konflux}" == "true" ]]; then
                wc_img="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"
                echo "wait_web_console=true" >> "${GITHUB_OUTPUT}"
                echo "  web-console -> ${wc_img} (waiting for Konflux build)"
              fi

              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
              echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
              echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
              ;;

            merge_group)
              # GitHub merge queue builds images through the dedicated Konflux
              # merge-queue pipelines (.tekton/*-merge-queue.yaml): a push to
              # gh-readonly-queue/main/... runs
              # hypershell-<component>-main-on-merge-queue and pushes an
              # ephemeral on-merge-queue-<merge_sha>, distinct from the PR
              # pipelines' on-pr-<head_sha> so a merge-queue image is never
              # confused with an already-tested PR image. The on-push pipelines
              # require target_branch == "main" and never fire here, so mirror
              # the pull_request path: use on-merge-queue-<merge_sha> for each
              # component the merge queue rebuilt and the stable baseline image for the
              # rest.
              #
              # Same e2e-relevant skip as pull_request, against the merge batch
              # (detect-components and detect-konflux already diff
              # merge_group.base_sha...github.sha). Kind and OpenShift remain the
              # merge-queue gate when those paths change; a docs-only batch must
              # not occupy three Kind runners or a shared-cluster namespace.
              # Tests CI Gate is the required check, so a skipped e2e job does
              # not leave the queue pending.
              if [[ "${detect_e2e_relevant}" != "true" && "${KONFLUX_WEB_CONSOLE}" != "true" ]]; then
                echo "No e2e-relevant components changed in merge batch"
                echo "should_run=false" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              tag="on-merge-queue-${PUSH_SHA}"
              api_img="${baseline_api}"
              cp_img="${baseline_cp}"
              wc_img="${baseline_wc}"
              echo "wait_api_server=${KONFLUX_API_SERVER}" >> "${GITHUB_OUTPUT}"
              echo "wait_control_plane=${KONFLUX_CONTROL_PLANE}" >> "${GITHUB_OUTPUT}"
              echo "wait_web_console=${KONFLUX_WEB_CONSOLE}" >> "${GITHUB_OUTPUT}"

              if [[ "${KONFLUX_API_SERVER}" == "true" ]]; then
                api_img="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"
                echo "  api-server -> ${api_img}"
              fi
              if [[ "${KONFLUX_CONTROL_PLANE}" == "true" ]]; then
                cp_img="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"
                echo "  control-plane -> ${cp_img}"
              fi
              if [[ "${KONFLUX_WEB_CONSOLE}" == "true" ]]; then
                wc_img="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"
                echo "  web-console -> ${wc_img}"
              fi
              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
              echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
              echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
              ;;

            push)
              # On-push component pipelines run concurrently with this workflow.
              # Select commit-tagged images only for components whose path-filtered
              # pipelines were triggered, and make e2e-kind wait for those checks.
              # Falling back to baseline for a changed component would run new tests
              # against old code and can report misleading product failures.
              tag="${PUSH_SHA}"
              api_img="${baseline_api}"
              cp_img="${baseline_cp}"
              wc_img="${baseline_wc}"
              echo "wait_api_server=${KONFLUX_API_SERVER}" >> "${GITHUB_OUTPUT}"
              echo "wait_control_plane=${KONFLUX_CONTROL_PLANE}" >> "${GITHUB_OUTPUT}"
              echo "wait_web_console=${KONFLUX_WEB_CONSOLE}" >> "${GITHUB_OUTPUT}"

              if [[ "${KONFLUX_API_SERVER}" == "true" ]]; then
                api_img="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"
                echo "  api-server -> ${api_img} (waiting for Konflux build)"
              fi
              if [[ "${KONFLUX_CONTROL_PLANE}" == "true" ]]; then
                cp_img="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"
                echo "  control-plane -> ${cp_img} (waiting for Konflux build)"
              fi
              if [[ "${KONFLUX_WEB_CONSOLE}" == "true" ]]; then
                wc_img="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"
                echo "  web-console -> ${wc_img} (waiting for Konflux build)"
              fi

              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
              echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
              echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
              ;;

            *)
              # workflow_dispatch does not trigger Konflux builds. Reuse a full
              # commit-tagged image set when one already exists; otherwise use the
              # stable baseline set rather than mixing component revisions.
              tag="${PUSH_SHA}"
              konflux_api="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"
              konflux_cp="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"
              konflux_wc="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"
              if skopeo inspect --raw "docker://${konflux_api}" >/dev/null 2>&1 && \
                 skopeo inspect --raw "docker://${konflux_cp}" >/dev/null 2>&1 && \
                 skopeo inspect --raw "docker://${konflux_wc}" >/dev/null 2>&1; then
                echo "Using existing Konflux images (${PUSH_SHA:0:7})"
                api_img="${konflux_api}"
                cp_img="${konflux_cp}"
                wc_img="${konflux_wc}"
              else
                echo "Complete Konflux image set not found -- using baseline"
                api_img="${baseline_api}"
                cp_img="${baseline_cp}"
                wc_img="${baseline_wc}"
              fi
              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
              echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
              echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
              ;;
          esac


  e2e-kind:
    name: Kind
    needs: plan-images
    if: needs.plan-images.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    # This job now also absorbs the Konflux build wait that plan-images used to
    # hold: kind-up runs first and overlaps the remote build, the
    # wait-on-check-action steps then block for whatever build time is left (up
    # to the 900s discovery ceiling plus the build itself), and only then does
    # the bash e2e suite run followed by the browser trace verification (Node
    # install, Chromium download, Playwright run). 45 minutes covers that
    # combined budget with headroom; 25 min was the ceiling before the wait
    # moved in, so a tighter value (e.g. 30) risks tripping on a slow build.
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: components/control-plane/go.mod
          cache-dependency-path: components/control-plane/go.sum

      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          kind version

      # The e2e test installs the CLI from the observed gateway version.

      - name: Create Kind cluster with OIDC
        env:
          KIND_ENABLE_OIDC: "true"
          # Deploy Jaeger and point the web-console BFF at it so the browser
          # trace verification below has a collector to export to (WEB-TRACE-10).
          KIND_JAEGER: "true"
          # Defer platform seeding until after the image swap below. kind-up
          # deploys the baseline placeholder image first; seeding a request
          # contract change (e.g. a removed/added required field) against that
          # stale image would 400 and abort. The "Seed platform resources" step
          # runs it once the working-tree images are swapped in.
          SKIP_SEED: "true"
        run: make kind-up

      # Block until each triggered component build has concluded.
      # wait-on-check-action waits for the named check to both appear and finish,
      # so a build whose check has not been created yet cannot be skipped. Push
      # events select only their on-push check because the same commit can also
      # retain successful merge-queue checks. A non-success conclusion fails the
      # step instead of letting E2E run against a stale baseline image.
      - name: Wait for api-server Konflux build
        id: wait-api-server
        if: needs.plan-images.outputs.wait_api_server == 'true'
        continue-on-error: true
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-regexp: ${{ github.event_name == 'push' && 'hypershell-api-server-main-on-push$' || 'hypershell-api-server-main-on-(pull-request|merge-queue)$' }}
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 900
          allowed-conclusions: success

      - name: Wait for control-plane Konflux build
        id: wait-control-plane
        if: needs.plan-images.outputs.wait_control_plane == 'true'
        continue-on-error: true
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-regexp: ${{ github.event_name == 'push' && 'hypershell-control-plane-main-on-push$' || 'hypershell-control-plane-main-on-(pull-request|merge-queue)$' }}
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 900
          allowed-conclusions: success

      - name: Wait for web-console Konflux build
        id: wait-web-console
        if: needs.plan-images.outputs.wait_web_console == 'true'
        continue-on-error: true
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-regexp: ${{ github.event_name == 'push' && 'hypershell-web-console-main-on-push$' || 'hypershell-web-console-main-on-(pull-request|merge-queue)$' }}
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 900
          allowed-conclusions: success

      - name: Gate on Konflux builds
        env:
          API_WAIT: ${{ needs.plan-images.outputs.wait_api_server }}
          API_RESULT: ${{ steps.wait-api-server.outcome }}
          CP_WAIT: ${{ needs.plan-images.outputs.wait_control_plane }}
          CP_RESULT: ${{ steps.wait-control-plane.outcome }}
          WC_WAIT: ${{ needs.plan-images.outputs.wait_web_console }}
          WC_RESULT: ${{ steps.wait-web-console.outcome }}
        run: |
          failed=()
          if [[ "${API_WAIT}" == "true" && "${API_RESULT}" != "success" ]]; then
            failed+=("api-server")
          fi
          if [[ "${CP_WAIT}" == "true" && "${CP_RESULT}" != "success" ]]; then
            failed+=("control-plane")
          fi
          if [[ "${WC_WAIT}" == "true" && "${WC_RESULT}" != "success" ]]; then
            failed+=("web-console")
          fi

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::Konflux image builds failed for: ${failed[*]}. E2E tests cannot run without fresh container images. This is a Konflux infrastructure issue, not an e2e test failure. Re-run this workflow once the Konflux builds pass, or check the Konflux pipeline runs for build errors."
            exit 1
          fi
          echo "All required Konflux builds succeeded."

      - name: Swap component images
        env:
          API_SERVER_IMAGE: ${{ needs.plan-images.outputs.api_server_image }}
          CONTROL_PLANE_IMAGE: ${{ needs.plan-images.outputs.control_plane_image }}
          WEB_CONSOLE_IMAGE: ${{ needs.plan-images.outputs.web_console_image }}
        run: |
          bash scripts/kind/set-component-images.sh
          echo "::group::Kind environment configuration"
          make kind-env
          echo "::endgroup::"

      # Seed platform resources now that the working-tree images are live (the
      # swap above rolled them in). Deferred from kind-up so the seed exercises
      # this PR's request contract instead of the baseline placeholder image.
      # SEED_STRICT fails the job here with the real HTTP error if a create
      # is rejected, rather than surfacing later as a confusing discovery miss.
      - name: Seed platform resources
        env:
          SEED_STRICT: "true"
        run: make kind-seed

      - name: Run e2e tests
        env:
          E2E_INFRA_DRIVER: kind
          E2E_OPENSHELL_INSTALL: always
          # Test the candidate installer before its public main URL is available.
          OPENSHELL_INSTALL_SCRIPT_URL: file://${{ github.workspace }}/scripts/install-openshell.sh
          E2E_PROVISION_TIMEOUT: "300"
          E2E_SANDBOX_TIMEOUT: "180"
          # Force plain, non-graphical output from the openshell CLI. Off a TTY
          # its miette-style renderer wraps long diagnostics with a box-drawing
          # gutter (│) at an assumed 80-col width, which garbles captured logs.
          TERM: dumb
          NO_COLOR: "1"
        run: bash tests/e2e/e2e-openshell.sh

      # Browser-driven distributed-trace verification (WEB-TRACE-10): drive a
      # real gateway workflow in the deployed console, then assert one trace in
      # Jaeger joins the browser and the BFF. Reuses the same Node + Chromium
      # setup the web-console lint job uses.
      #
      # These steps run on pull_request, push, and workflow_dispatch -- NOT
      # merge_group. The trace path is already gated at pull_request time
      # against the freshly built PR image and re-verified on push to main
      # against the post-merge image, so re-running it on the merge gate is
      # redundant coverage that would add a Node install, a Chromium download,
      # and a Playwright run to every merge. It is also not always testable
      # there: when a merge batch does not touch web-console the console image
      # falls back to baseline, which lags main and cannot contain
      # not-yet-merged tracing code, so the deployed console would emit no
      # spans and the assertion would test the wrong artifact.

      - name: Set up Node.js
        if: github.event_name != 'merge_group'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        if: github.event_name != 'merge_group'
        run: bash scripts/bootstrap_pnpm.sh
      - name: Install dependencies
        if: github.event_name != 'merge_group'
        run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: playwright-version
        if: github.event_name != 'merge_group'
        run: echo "version=$(pnpm --filter @openshift-online/hypershell-web-console exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Install Chromium without `--with-deps` so the flaky apt phase
      # (actions/runner-images#11347) never lands on the critical path -- the
      # ubuntu-24.04 runner image already ships Chromium's system libraries.
      # Cache the browser download too, keyed on the resolved Playwright
      # version; only the default branch writes the cache, so PR runs cannot
      # poison it.
      - name: Restore Chromium cache
        id: playwright-chromium-cache
        if: github.event_name != 'merge_group'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: github.event_name != 'merge_group'
        timeout-minutes: 5
        run: pnpm --filter @openshift-online/hypershell-web-console exec playwright install chromium
      - name: Save Chromium cache
        if: github.event_name != 'merge_group' && github.ref == 'refs/heads/main' && steps.playwright-chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-chromium-cache.outputs.cache-primary-key }}
      - name: Verify end-to-end traces reach Jaeger
        if: github.event_name != 'merge_group'
        run: pnpm --filter @openshift-online/hypershell-web-console test:e2e:live

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-diagnostics

          echo "::group::All pods"
          kubectl get pods -A -o wide 2>&1 | tee e2e-diagnostics/pods.txt || true
          echo "::endgroup::"

          echo "::group::Pod descriptions (hypershell-system)"
          kubectl describe pods -n hypershell-system 2>&1 | tee e2e-diagnostics/pod-describes.txt || true
          echo "::endgroup::"

          echo "::group::Pod logs (hypershell-system)"
          {
            for label in app.kubernetes.io/name=hypershell app=hypershell-api-server app=hypershell-controller app=hypershell-web-console; do
              kubectl logs --all-containers --prefix --tail=200 -l "${label}" -n hypershell-system 2>&1 || true
            done
          } | tee e2e-diagnostics/pod-logs.txt
          echo "::endgroup::"

          echo "::group::Stand-in postgres logs"
          kubectl logs --all-containers --prefix --tail=200 -l app=postgres -n external-cloud-db 2>&1 | tee e2e-diagnostics/postgres.txt || true
          echo "::endgroup::"

          echo "::group::Keycloak logs"
          kubectl logs --all-containers --prefix --tail=100 -l app=keycloak -n keycloak 2>&1 | tee e2e-diagnostics/keycloak-logs.txt || true
          echo "::endgroup::"

          echo "::group::Tracing (Jaeger) diagnostics"
          {
            kubectl get pods,svc,httproutes -l app=jaeger -n hypershell-system -o wide 2>&1 || true
            kubectl logs --all-containers --prefix --tail=100 -l app=jaeger -n hypershell-system 2>&1 || true
            echo "--- web-console OTEL env ---"
            kubectl get deployment/hypershell-web-console -n hypershell-system \
              -o jsonpath='{range .spec.template.spec.containers[*].env[*]}{.name}={.value}{"\n"}{end}' 2>&1 | grep -i otel || true
          } | tee e2e-diagnostics/tracing.txt
          echo "::endgroup::"

          echo "::group::Events (hypershell-system)"
          kubectl get events --sort-by=.lastTimestamp -n hypershell-system 2>&1 | tee e2e-diagnostics/events.txt || true
          echo "::endgroup::"

          echo "::group::Gateway API resources"
          {
            kubectl get gateways,grpcroutes,httproutes -A -o wide 2>&1 || true
            for ns in $(kubectl get ns -l hypershell.redhat.io/managed=true -o name 2>/dev/null); do
              ns_name="${ns##*/}"
              echo "--- $ns ---"
              kubectl get pods,svc,deployments -n "${ns_name}" 2>&1 || true
              echo "--- pod descriptions ($ns_name) ---"
              kubectl describe pods -n "${ns_name}" 2>&1 || true
              echo "--- events ($ns_name) ---"
              kubectl get events --sort-by=.lastTimestamp -n "${ns_name}" 2>&1 || true
              for pod in $(kubectl get pods -n "${ns_name}" -o name 2>/dev/null); do
                echo "--- logs ${pod} ($ns_name) ---"
                kubectl logs "${pod}" --all-containers --tail=80 -n "${ns_name}" 2>&1 || true
                echo "--- previous logs ${pod} ($ns_name) ---"
                kubectl logs "${pod}" --all-containers --previous --tail=80 -n "${ns_name}" 2>&1 || true
              done
            done
          } | tee e2e-diagnostics/gateway-api.txt
          echo "::endgroup::"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-diagnostics
          path: e2e-diagnostics/
          retention-days: 7

  # Origin-PR deploy of hypershell-ci-pr-<n>, hypershell-ci-main-<short-sha> on
  # push to main, or hypershell-ci-mq-<short-sha> for a merge queue entry
  # (ephemeral-pr-environments.spec.md). Per-commit main/merge-queue
  # namespaces mean cancel-in-progress teardown of an older run cannot delete
  # a newer deploy. Concurrency keys on the PR number, 'main', or the
  # merge-queue commit SHA, so unrelated runs (including two merge queue
  # entries validated concurrently) never cancel each other while repeats of
  # the same target still serialize. Same plan-images / should_run gate as
  # Kind and OpenShift. Runs after Unit because this workflow is only called
  # then. Shares pr-env-<n> (or pr-env-main) with /pr-extend, /pr-destroy,
  # and close so those cannot race an in-flight deploy. Kind runs in
  # parallel with this job. Fork PRs skip it (no per-PR environment; a fork
  # PR cannot enter the merge queue either).
  deploy:
    name: Deploy OpenShift Environment
    needs: plan-images
    if: >-
      needs.plan-images.outputs.should_run == 'true' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'merge_group' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
      pull-requests: write
      id-token: write
    concurrency:
      group: >-
        pr-env-${{
          github.event.pull_request.number ||
          (github.event_name == 'merge_group' && format('mq-{0}', github.sha)) ||
          'main'
        }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_ENV_RETAINED_MAX_HOURS: ${{ vars.PR_ENV_RETAINED_MAX_HOURS || '72' }}
      PR_ENV_UNRETAINED_MAX_HOURS: ${{ vars.PR_ENV_UNRETAINED_MAX_HOURS || '24' }}
      PR_ENV_GITHUB_ORG: ${{ vars.PR_ENV_GITHUB_ORG || 'openshift-online' }}
      PR_ENV_GITHUB_ALLOWLIST: ${{ vars.PR_ENV_GITHUB_ALLOWLIST }}
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve OpenShift namespace
        run: bash scripts/ci/resolve-openshift-namespace.sh

      - name: Deploy OpenShift Environment
        uses: ./.github/actions/deploy-pr-environment
        with:
          pr_number: ${{ github.event.pull_request.number }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          updated: ${{ github.event.action == 'synchronize' && 'true' || 'false' }}
          retained: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pr-environment/pr-extended') && 'true' || 'false' }}
          wait_api_server: ${{ needs.plan-images.outputs.wait_api_server }}
          wait_control_plane: ${{ needs.plan-images.outputs.wait_control_plane }}
          wait_web_console: ${{ needs.plan-images.outputs.wait_web_console }}
          api_server_image: ${{ needs.plan-images.outputs.api_server_image }}
          control_plane_image: ${{ needs.plan-images.outputs.control_plane_image }}
          web_console_image: ${{ needs.plan-images.outputs.web_console_image }}
          api_server_check_regexp: ${{ github.event_name == 'push' && 'hypershell-api-server-main-on-push$' || github.event_name == 'merge_group' && 'hypershell-api-server-main-on-merge-queue$' || 'hypershell-api-server-main-on-pull-request$' }}
          control_plane_check_regexp: ${{ github.event_name == 'push' && 'hypershell-control-plane-main-on-push$' || github.event_name == 'merge_group' && 'hypershell-control-plane-main-on-merge-queue$' || 'hypershell-control-plane-main-on-pull-request$' }}
          web_console_check_regexp: ${{ github.event_name == 'push' && 'hypershell-web-console-main-on-push$' || github.event_name == 'merge_group' && 'hypershell-web-console-main-on-merge-queue$' || 'hypershell-web-console-main-on-pull-request$' }}

      # OpenShift never starts if this job fails or is cancelled, so tear down
      # here. Skip ONLY when the environment is retained.
      - name: Teardown failed/cancelled environment
        if: ${{ always() && (failure() || cancelled()) }}
        run: bash scripts/ci/teardown-unretained-pr-env.sh

  # Runs the OpenShift e2e suite against the environment this workflow just
  # deployed (ephemeral-pr-environments.spec.md). needs: deploy replaces the
  # old cross-workflow poller. Same should_run gate as Kind. After the suite
  # (pass, fail, or cancel) tears the environment down unless retained.
  # Neither main nor a merge queue entry ever has pr-environment/pr-extended,
  # so teardown always runs there. Destroy uses if: always() so an unretained
  # env is torn down after a failed suite. The suite step itself fails the job.
  e2e-openshift:
    name: OpenShift
    needs: [plan-images, deploy]
    if: >-
      needs.plan-images.outputs.should_run == 'true' &&
      needs.deploy.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'merge_group' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: >-
        pr-env-${{
          github.event.pull_request.number ||
          (github.event_name == 'merge_group' && format('mq-{0}', github.sha)) ||
          'main'
        }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve OpenShift namespace
        run: bash scripts/ci/resolve-openshift-namespace.sh

      - name: Install oc and openshell CLI
        run: |
          mkdir -p "$(dirname "${KUBECONFIG}")"
          curl -LsS https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin oc kubectl
          oc version --client
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/v0.0.110/install.sh | OPENSHELL_VERSION=v0.0.110 sh
          openshell --version

      - name: Log in to the target cluster
        uses: ./.github/actions/openshift-cluster-login
        with:
          role-arn: ${{ env.PR_ENV_AWS_ROLE_ARN }}

      - name: Run OpenShift e2e suite
        id: e2e-suite
        env:
          E2E_INFRA_DRIVER: openshift
          TERM: dumb
          NO_COLOR: "1"
        run: |
          if [[ -n "${PR_NUMBER}" ]]; then
            secret="$(bash scripts/ci/read-e2e-client-secret.sh)"
            echo "::add-mask::${secret}"
            export E2E_OIDC_GRANT=client_credentials
            export E2E_OIDC_SA_CLIENT_ID=hypershell-e2e
            export E2E_OIDC_SA_CLIENT_SECRET="${secret}"
          fi
          bash tests/e2e/e2e-openshell.sh

      - name: Collect diagnostics
        if: steps.e2e-suite.outcome == 'failure'
        run: |
          mkdir -p e2e-diagnostics
          oc get pods -n "${OPENSHIFT_NAMESPACE}" -o wide 2>&1 | tee e2e-diagnostics/pods.txt || true
          oc get events --sort-by=.lastTimestamp -n "${OPENSHIFT_NAMESPACE}" 2>&1 | tee e2e-diagnostics/events.txt || true
          oc logs --all-containers --prefix --tail=200 -l app=hypershell-api-server -n "${OPENSHIFT_NAMESPACE}" 2>&1 | tee e2e-diagnostics/api-server.txt || true
          oc logs --all-containers --prefix --tail=200 -l app=hypershell-controller -n "${OPENSHIFT_NAMESPACE}" 2>&1 | tee e2e-diagnostics/controller.txt || true

      - name: Upload diagnostics
        if: steps.e2e-suite.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: >-
            pr-env-diagnostics-${{
              github.event.pull_request.number ||
              (github.event_name == 'merge_group' && format('mq-{0}', github.sha)) ||
              'main'
            }}
          path: e2e-diagnostics/
          retention-days: 7

      # Skip ONLY when the environment is retained. Runs on success, failure,
      # and cancel so an unretained namespace is not left behind.
      - name: Destroy unretained environment
        if: always()
        run: bash scripts/ci/teardown-unretained-pr-env.sh
