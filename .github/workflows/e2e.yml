name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KONFLUX_REGISTRY: quay.io/redhat-user-workloads/hcm-eng-prod-tenant/hypershell-main
  BASELINE_REGISTRY: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main

jobs:
  plan-images:
    name: Plan component images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      api_server_image: ${{ steps.plan.outputs.api_server_image }}
      control_plane_image: ${{ steps.plan.outputs.control_plane_image }}
      web_console_image: ${{ steps.plan.outputs.web_console_image }}
      wait_api_server: ${{ steps.plan.outputs.wait_api_server }}
      wait_control_plane: ${{ steps.plan.outputs.wait_control_plane }}
      wait_web_console: ${{ steps.plan.outputs.wait_web_console }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/detect-components.sh

      - name: Detect Konflux components
        id: detect-konflux
        if: github.event_name == 'merge_group' || github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          case "${EVENT_NAME}" in
            merge_group)
              changed_files="$(git diff --name-only "${MERGE_GROUP_BASE_SHA}...${PUSH_SHA}")"
              pipeline_suffix="merge-queue"
              ;;
            push)
              if [[ -z "${PUSH_BEFORE_SHA}" || "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
                changed_files="$(git show --pretty=format: --name-only "${PUSH_SHA}")"
              else
                changed_files="$(git diff --name-only "${PUSH_BEFORE_SHA}...${PUSH_SHA}")"
              fi
              pipeline_suffix="push"
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          api_server=false
          control_plane=false
          web_console=false

          # These patterns MUST mirror each component's event-specific Konflux
          # CEL trigger in .tekton/hypershell-<component>-main-${pipeline_suffix}.yaml.
          # Only components whose path-filtered pipelines actually run may use
          # the event's commit-tagged image and wait for the corresponding check.
          if grep -qE "^components/api-server/|^\\.tekton/hypershell-api-server-main-${pipeline_suffix}\\.yaml$" <<<"${changed_files}"; then
            api_server=true
          fi
          if grep -qE "^components/control-plane/|^\\.tekton/hypershell-control-plane-main-${pipeline_suffix}\\.yaml$|^Dockerfile$" <<<"${changed_files}"; then
            control_plane=true
          fi
          if grep -qE "^components/web-console/|^packages/gateway-management-ui/|^\\.tekton/hypershell-web-console-main-${pipeline_suffix}\\.yaml$" <<<"${changed_files}"; then
            web_console=true
          fi

          echo "api_server=${api_server}" >> "${GITHUB_OUTPUT}"
          echo "control_plane=${control_plane}" >> "${GITHUB_OUTPUT}"
          echo "web_console=${web_console}" >> "${GITHUB_OUTPUT}"

      - name: Plan images and required Konflux builds
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_SHA: ${{ github.sha }}
          DETECT_API_SERVER: ${{ steps.detect.outputs.api_server }}
          DETECT_CONTROL_PLANE: ${{ steps.detect.outputs.control_plane }}
          DETECT_E2E: ${{ steps.detect.outputs.e2e }}
          DETECT_PR_TEST: ${{ steps.detect.outputs.pr_test }}
          KONFLUX_API_SERVER: ${{ steps.detect-konflux.outputs.api_server }}
          KONFLUX_CONTROL_PLANE: ${{ steps.detect-konflux.outputs.control_plane }}
          KONFLUX_WEB_CONSOLE: ${{ steps.detect-konflux.outputs.web_console }}
        run: |
          baseline_api="${BASELINE_REGISTRY}/hypershell-api-server-main:latest"
          baseline_cp="${BASELINE_REGISTRY}/hypershell-control-plane-main:latest"
          baseline_wc="${BASELINE_REGISTRY}/hypershell-web-console-main:latest"

          # Default: nothing to wait for. The e2e-kind job waits for Konflux builds
          # sequentially before e2e tests when the current event triggers a
          # component build.
          echo "wait_api_server=false"    >> "${GITHUB_OUTPUT}"
          echo "wait_control_plane=false" >> "${GITHUB_OUTPUT}"
          echo "wait_web_console=false"   >> "${GITHUB_OUTPUT}"

          case "${EVENT_NAME}" in
            pull_request)
              api_changed="${DETECT_API_SERVER:-false}"
              cp_changed="${DETECT_CONTROL_PLANE:-false}"
              e2e_changed="${DETECT_E2E:-false}"
              pr_test_changed="${DETECT_PR_TEST:-false}"

              # Determine which components need a Konflux-built image. These
              # patterns MUST mirror each component's pull-request Konflux CEL
              # trigger in .tekton/hypershell-<component>-main-pull-request.yaml.
              # detect-components uses broad paths (includes Makefile, .github/,
              # sdk-typescript, lockfiles, etc.) which is correct for lint but
              # NOT for "will Konflux build an image" or "should Kind e2e run".
              # A PR that changes only the pipeline file itself (or, for
              # control-plane, the root Dockerfile) still triggers that
              # component's on-pr build, so we must wait for it -- otherwise we
              # silently fall back to main's image and skip the on-pr image this
              # PR actually produces.
              #
              # Use a three-dot (merge-base) diff: "${PR_BASE_SHA}...${PR_HEAD_SHA}"
              # compares the PR head against the point where this PR forked from the
              # base branch. A two-dot "${PR_BASE_SHA} HEAD" diff (where HEAD is a
              # merge commit) would also report component changes that landed on the
              # base branch *after* this PR forked, misattributing them to the PR --
              # then we would wait for a Konflux build that only ever runs for files
              # this PR actually touched.
              changed_files="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")"
              api_konflux=false
              cp_konflux=false
              wc_konflux=false
              if grep -qE '^components/api-server/|^\.tekton/hypershell-api-server-main-pull-request\.yaml$' <<<"${changed_files}"; then api_konflux=true; fi
              if grep -qE '^components/control-plane/|^\.tekton/hypershell-control-plane-main-pull-request\.yaml$|^Dockerfile$' <<<"${changed_files}"; then cp_konflux=true; fi
              if grep -qE '^components/web-console/|^packages/gateway-management-ui/|^\.tekton/hypershell-web-console-main-pull-request\.yaml$' <<<"${changed_files}"; then wc_konflux=true; fi

              e2e_relevant=false
              if [[ "${api_changed}" == "true" || "${cp_changed}" == "true" || \
                    "${e2e_changed}" == "true" || "${pr_test_changed}" == "true" || \
                    "${wc_konflux}" == "true" ]]; then
                e2e_relevant=true
              fi

              if [[ "${e2e_relevant}" != "true" ]]; then
                echo "No e2e-relevant components changed"
                echo "should_run=false" >> "${GITHUB_OUTPUT}"
                exit 0
              fi

              if [[ "${api_konflux}" != "true" && "${cp_konflux}" != "true" && "${wc_konflux}" != "true" ]]; then
                echo "No source components changed -- using latest Konflux on-push images from main"
                main_sha=$(git rev-parse origin/main)
                main_tag="${main_sha}"
                konflux_api="${KONFLUX_REGISTRY}/hypershell-api-server-main:${main_tag}"
                konflux_cp="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${main_tag}"
                konflux_wc="${KONFLUX_REGISTRY}/hypershell-web-console-main:${main_tag}"
                # Konflux publishes component images independently based on path
                # filters. Use each available main image independently; a component
                # that did not change on main has no commit-tagged image and should
                # use the stable baseline instead of forcing the whole set back to
                # an older revision.
                api_img="${baseline_api}"
                cp_img="${baseline_cp}"
                wc_img="${baseline_wc}"
                if skopeo inspect --raw "docker://${konflux_api}" >/dev/null 2>&1; then
                  api_img="${konflux_api}"
                  echo "  api-server -> ${api_img}"
                else
                  echo "  api-server image not found for main -- using baseline"
                fi
                if skopeo inspect --raw "docker://${konflux_cp}" >/dev/null 2>&1; then
                  cp_img="${konflux_cp}"
                  echo "  control-plane -> ${cp_img}"
                else
                  echo "  control-plane image not found for main -- using baseline"
                fi
                if skopeo inspect --raw "docker://${konflux_wc}" >/dev/null 2>&1; then
                  wc_img="${konflux_wc}"
                  echo "  web-console -> ${wc_img}"
                else
                  echo "  web-console image not found for main -- using baseline"
                fi
                echo "should_run=true" >> "${GITHUB_OUTPUT}"
                echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
                echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
                echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
                exit 0
              fi

              # Source components changed. The image ref is deterministic
              # (on-pr-<head_sha>); e2e-kind waits for the matching Konflux build
              # in parallel with kind-up, then swaps the image in.
              # Components that did not change keep the stable baseline image.
              tag="on-pr-${PR_HEAD_SHA}"
              api_img="${baseline_api}"
              cp_img="${baseline_cp}"
              wc_img="${baseline_wc}"

              if [[ "${api_konflux}" == "true" ]]; then
                api_img="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"
                echo "wait_api_server=true" >> "${GITHUB_OUTPUT}"
                echo "  api-server -> ${api_img} (waiting for Konflux build)"
              fi
              if [[ "${cp_konflux}" == "true" ]]; then
                cp_img="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"
                echo "wait_control_plane=true" >> "${GITHUB_OUTPUT}"
                echo "  control-plane -> ${cp_img} (waiting for Konflux build)"
              fi
              if [[ "${wc_konflux}" == "true" ]]; then
                wc_img="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"
                echo "wait_web_console=true" >> "${GITHUB_OUTPUT}"
                echo "  web-console -> ${wc_img} (waiting for Konflux build)"
              fi

              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
              echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
              echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
              ;;

            merge_group)
              # GitHub merge queue builds images through the dedicated Konflux
              # merge-queue pipelines (.tekton/*-merge-queue.yaml): a push to
              # gh-readonly-queue/main/... runs
              # hypershell-<component>-main-on-merge-queue and pushes an
              # ephemeral on-merge-queue-<merge_sha>, distinct from the PR
              # pipelines' on-pr-<head_sha> so a merge-queue image is never
              # confused with an already-tested PR image. The on-push pipelines
              # require target_branch == "main" and never fire here, so mirror
              # the pull_request path: use on-merge-queue-<merge_sha> for each
              # component the merge queue rebuilt and the stable baseline image for the
              # rest. Always run e2e -- this is the merge gate.
              tag="on-merge-queue-${PUSH_SHA}"
              api_img="${baseline_api}"
              cp_img="${baseline_cp}"
              wc_img="${baseline_wc}"
              echo "wait_api_server=${KONFLUX_API_SERVER}" >> "${GITHUB_OUTPUT}"
              echo "wait_control_plane=${KONFLUX_CONTROL_PLANE}" >> "${GITHUB_OUTPUT}"
              echo "wait_web_console=${KONFLUX_WEB_CONSOLE}" >> "${GITHUB_OUTPUT}"

              if [[ "${KONFLUX_API_SERVER}" == "true" ]]; then
                api_img="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"
                echo "  api-server -> ${api_img}"
              fi
              if [[ "${KONFLUX_CONTROL_PLANE}" == "true" ]]; then
                cp_img="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"
                echo "  control-plane -> ${cp_img}"
              fi
              if [[ "${KONFLUX_WEB_CONSOLE}" == "true" ]]; then
                wc_img="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"
                echo "  web-console -> ${wc_img}"
              fi
              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
              echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
              echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
              ;;

            push)
              # On-push component pipelines run concurrently with this workflow.
              # Select commit-tagged images only for components whose path-filtered
              # pipelines were triggered, and make e2e-kind wait for those checks.
              # Falling back to baseline for a changed component would run new tests
              # against old code and can report misleading product failures.
              tag="${PUSH_SHA}"
              api_img="${baseline_api}"
              cp_img="${baseline_cp}"
              wc_img="${baseline_wc}"
              echo "wait_api_server=${KONFLUX_API_SERVER}" >> "${GITHUB_OUTPUT}"
              echo "wait_control_plane=${KONFLUX_CONTROL_PLANE}" >> "${GITHUB_OUTPUT}"
              echo "wait_web_console=${KONFLUX_WEB_CONSOLE}" >> "${GITHUB_OUTPUT}"

              if [[ "${KONFLUX_API_SERVER}" == "true" ]]; then
                api_img="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"
                echo "  api-server -> ${api_img} (waiting for Konflux build)"
              fi
              if [[ "${KONFLUX_CONTROL_PLANE}" == "true" ]]; then
                cp_img="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"
                echo "  control-plane -> ${cp_img} (waiting for Konflux build)"
              fi
              if [[ "${KONFLUX_WEB_CONSOLE}" == "true" ]]; then
                wc_img="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"
                echo "  web-console -> ${wc_img} (waiting for Konflux build)"
              fi

              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
              echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
              echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
              ;;

            *)
              # workflow_dispatch does not trigger Konflux builds. Reuse a full
              # commit-tagged image set when one already exists; otherwise use the
              # stable baseline set rather than mixing component revisions.
              tag="${PUSH_SHA}"
              konflux_api="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"
              konflux_cp="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"
              konflux_wc="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"
              if skopeo inspect --raw "docker://${konflux_api}" >/dev/null 2>&1 && \
                 skopeo inspect --raw "docker://${konflux_cp}" >/dev/null 2>&1 && \
                 skopeo inspect --raw "docker://${konflux_wc}" >/dev/null 2>&1; then
                echo "Using existing Konflux images (${PUSH_SHA:0:7})"
                api_img="${konflux_api}"
                cp_img="${konflux_cp}"
                wc_img="${konflux_wc}"
              else
                echo "Complete Konflux image set not found -- using baseline"
                api_img="${baseline_api}"
                cp_img="${baseline_cp}"
                wc_img="${baseline_wc}"
              fi
              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
              echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
              echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
              ;;
          esac


  e2e-kind:
    name: E2E Kind (${{ matrix.database-provider }})
    needs: plan-images
    if: needs.plan-images.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database-provider: [deployment, cnpg]
    # This job now also absorbs the Konflux build wait that plan-images used to
    # hold: kind-up runs first and overlaps the remote build, the
    # wait-on-check-action steps then block for whatever build time is left (up
    # to the 900s discovery ceiling plus the build itself), and only then does
    # the bash e2e suite run followed by the browser trace verification (Node
    # install, Chromium download, Playwright run). 45 minutes covers that
    # combined budget with headroom; 25 min was the ceiling before the wait
    # moved in, so a tighter value (e.g. 30) risks tripping on a slow build.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: components/control-plane/go.mod
          cache-dependency-path: components/control-plane/go.sum

      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          kind version

      - name: Install openshell CLI
        run: |
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/v0.0.110/install.sh | OPENSHELL_VERSION=v0.0.110 sh
          openshell --version

      - name: Create Kind cluster with OIDC
        env:
          # Exercise both the default per-gateway Deployment path and the
          # explicitly selected CNPG path through the full E2E workflow.
          DATABASE_PROVIDER: ${{ matrix.database-provider }}
          KIND_ENABLE_OIDC: "true"
          # Deploy Jaeger and point the web-console BFF at it so the browser
          # trace verification below has a collector to export to (WEB-TRACE-10).
          KIND_JAEGER: "true"
          # Defer platform seeding until after the image swap below. kind-up
          # deploys the baseline placeholder image first; seeding a request
          # contract change (e.g. a removed/added required field) against that
          # stale image would 400 and abort. The "Seed platform resources" step
          # runs it once the working-tree images are swapped in.
          SKIP_SEED: "true"
        run: make kind-up

      # Block until each triggered component build has concluded.
      # wait-on-check-action waits for the named check to both appear and finish,
      # so a build whose check has not been created yet cannot be skipped. Push
      # events select only their on-push check because the same commit can also
      # retain successful merge-queue checks. A non-success conclusion fails the
      # step instead of letting E2E run against a stale baseline image.
      - name: Wait for api-server Konflux build
        if: needs.plan-images.outputs.wait_api_server == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-regexp: ${{ github.event_name == 'push' && 'hypershell-api-server-main-on-push$' || 'hypershell-api-server-main-on-(pull-request|merge-queue)$' }}
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 900
          # Only success proves that the selected commit-tagged image was pushed.
          # The action defaults to "success,skipped"; a skipped build never
          # pushes the image, so pin strict success to keep the image guarantee.
          allowed-conclusions: success

      - name: Wait for control-plane Konflux build
        if: needs.plan-images.outputs.wait_control_plane == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-regexp: ${{ github.event_name == 'push' && 'hypershell-control-plane-main-on-push$' || 'hypershell-control-plane-main-on-(pull-request|merge-queue)$' }}
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 900
          # Only success proves that the selected commit-tagged image was pushed.
          # The action defaults to "success,skipped"; a skipped build never
          # pushes the image, so pin strict success to keep the image guarantee.
          allowed-conclusions: success

      - name: Wait for web-console Konflux build
        if: needs.plan-images.outputs.wait_web_console == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-regexp: ${{ github.event_name == 'push' && 'hypershell-web-console-main-on-push$' || 'hypershell-web-console-main-on-(pull-request|merge-queue)$' }}
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 900
          # Only success proves that the selected commit-tagged image was pushed.
          # The action defaults to "success,skipped"; a skipped build never
          # pushes the image, so pin strict success to keep the image guarantee.
          allowed-conclusions: success

      - name: Swap component images
        env:
          API_SERVER_IMAGE: ${{ needs.plan-images.outputs.api_server_image }}
          CONTROL_PLANE_IMAGE: ${{ needs.plan-images.outputs.control_plane_image }}
          WEB_CONSOLE_IMAGE: ${{ needs.plan-images.outputs.web_console_image }}
        run: |
          bash scripts/kind/set-component-images.sh
          echo "::group::Kind environment configuration"
          make kind-env
          echo "::endgroup::"

      # Seed platform resources now that the working-tree images are live (the
      # swap above rolled them in). Deferred from kind-up so the seed exercises
      # this PR's request contract instead of the baseline placeholder image.
      # SEED_STRICT fails the job here with the real HTTP error if a create
      # is rejected, rather than surfacing later as a confusing discovery miss.
      - name: Seed platform resources
        env:
          DATABASE_PROVIDER: ${{ matrix.database-provider }}
          SEED_STRICT: "true"
        run: make kind-seed

      - name: Run e2e tests
        env:
          E2E_INFRA_DRIVER: kind
          # Mirror the provider used to create this matrix job's cluster.
          DATABASE_PROVIDER: ${{ matrix.database-provider }}
          E2E_PROVISION_TIMEOUT: "300"
          E2E_SANDBOX_TIMEOUT: "180"
          # Force plain, non-graphical output from the openshell CLI. Off a TTY
          # its miette-style renderer wraps long diagnostics with a box-drawing
          # gutter (│) at an assumed 80-col width, which garbles captured logs.
          TERM: dumb
          NO_COLOR: "1"
        run: bash tests/e2e/e2e-openshell.sh

      # Browser-driven distributed-trace verification (WEB-TRACE-10): drive a
      # real gateway workflow in the deployed console, then assert one trace in
      # Jaeger joins the browser and the BFF. Reuses the same Node + Chromium
      # setup the web-console lint job uses.
      #
      # These steps run on pull_request, push, and workflow_dispatch -- NOT
      # merge_group. The trace path is already gated at pull_request time
      # against the freshly built PR image and re-verified on push to main
      # against the post-merge image, so re-running it on the merge gate is
      # redundant coverage that would add a Node install, a Chromium download,
      # and a Playwright run to every merge. It is also not always testable
      # there: when a merge batch does not touch web-console the console image
      # falls back to baseline, which lags main and cannot contain
      # not-yet-merged tracing code, so the deployed console would emit no
      # spans and the assertion would test the wrong artifact.

      - name: Set up Node.js
        if: github.event_name != 'merge_group'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        if: github.event_name != 'merge_group'
        run: bash scripts/bootstrap_pnpm.sh
      - name: Install dependencies
        if: github.event_name != 'merge_group'
        run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: playwright-version
        if: github.event_name != 'merge_group'
        run: echo "version=$(pnpm --filter @openshift-online/hypershell-web-console exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Install Chromium without `--with-deps` so the flaky apt phase
      # (actions/runner-images#11347) never lands on the critical path -- the
      # ubuntu-24.04 runner image already ships Chromium's system libraries.
      # Cache the browser download too, keyed on the resolved Playwright
      # version; only the default branch writes the cache, so PR runs cannot
      # poison it.
      - name: Restore Chromium cache
        id: playwright-chromium-cache
        if: github.event_name != 'merge_group'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: github.event_name != 'merge_group'
        timeout-minutes: 5
        run: pnpm --filter @openshift-online/hypershell-web-console exec playwright install chromium
      - name: Save Chromium cache
        if: github.event_name != 'merge_group' && github.ref == 'refs/heads/main' && steps.playwright-chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-chromium-cache.outputs.cache-primary-key }}
      - name: Verify end-to-end traces reach Jaeger
        if: github.event_name != 'merge_group'
        run: pnpm --filter @openshift-online/hypershell-web-console test:e2e:live

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-diagnostics

          echo "::group::All pods"
          kubectl get pods -A -o wide 2>&1 | tee e2e-diagnostics/pods.txt || true
          echo "::endgroup::"

          echo "::group::Pod descriptions (hypershell-system)"
          kubectl describe pods -n hypershell-system 2>&1 | tee e2e-diagnostics/pod-describes.txt || true
          echo "::endgroup::"

          echo "::group::Pod logs (hypershell-system)"
          {
            for label in app.kubernetes.io/name=hypershell app=hypershell-api-server app=hypershell-controller app=hypershell-web-console; do
              kubectl logs --all-containers --prefix --tail=200 -l "${label}" -n hypershell-system 2>&1 || true
            done
          } | tee e2e-diagnostics/pod-logs.txt
          echo "::endgroup::"

          echo "::group::Keycloak logs"
          kubectl logs --all-containers --prefix --tail=100 -l app=keycloak -n keycloak 2>&1 | tee e2e-diagnostics/keycloak-logs.txt || true
          echo "::endgroup::"

          echo "::group::Tracing (Jaeger) diagnostics"
          {
            kubectl get pods,svc,httproutes -l app=jaeger -n hypershell-system -o wide 2>&1 || true
            kubectl logs --all-containers --prefix --tail=100 -l app=jaeger -n hypershell-system 2>&1 || true
            echo "--- web-console OTEL env ---"
            kubectl get deployment/hypershell-web-console -n hypershell-system \
              -o jsonpath='{range .spec.template.spec.containers[*].env[*]}{.name}={.value}{"\n"}{end}' 2>&1 | grep -i otel || true
          } | tee e2e-diagnostics/tracing.txt
          echo "::endgroup::"

          echo "::group::Events (hypershell-system)"
          kubectl get events --sort-by=.lastTimestamp -n hypershell-system 2>&1 | tee e2e-diagnostics/events.txt || true
          echo "::endgroup::"

          echo "::group::Gateway API resources"
          {
            kubectl get gateways,grpcroutes,httproutes -A -o wide 2>&1 || true
            for ns in $(kubectl get ns -l hypershell.redhat.io/managed=true -o name 2>/dev/null); do
              ns_name="${ns##*/}"
              echo "--- $ns ---"
              kubectl get pods,svc,deployments -n "${ns_name}" 2>&1 || true
              echo "--- pod descriptions ($ns_name) ---"
              kubectl describe pods -n "${ns_name}" 2>&1 || true
              echo "--- events ($ns_name) ---"
              kubectl get events --sort-by=.lastTimestamp -n "${ns_name}" 2>&1 || true
              for pod in $(kubectl get pods -n "${ns_name}" -o name 2>/dev/null); do
                echo "--- logs ${pod} ($ns_name) ---"
                kubectl logs "${pod}" --all-containers --tail=80 -n "${ns_name}" 2>&1 || true
                echo "--- previous logs ${pod} ($ns_name) ---"
                kubectl logs "${pod}" --all-containers --previous --tail=80 -n "${ns_name}" 2>&1 || true
              done
            done
          } | tee e2e-diagnostics/gateway-api.txt
          echo "::endgroup::"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-diagnostics
          path: e2e-diagnostics/
          retention-days: 7

  summary:
    name: E2E CI gate
    if: ${{ always() && !cancelled() }}
    needs:
      - plan-images
      - e2e-kind
    runs-on: ubuntu-24.04
    steps:
      - name: Check e2e results
        env:
          PLAN_RESULT: ${{ needs.plan-images.result }}
          E2E_KIND_RESULT: ${{ needs.e2e-kind.result }}
        run: |
          for result in "${PLAN_RESULT}" "${E2E_KIND_RESULT}"; do
            if [[ "${result}" == failure || "${result}" == cancelled ]]; then
              echo "One or more e2e jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All e2e jobs passed or were skipped."
