name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KONFLUX_REGISTRY: quay.io/redhat-user-workloads/hcm-eng-prod-tenant/hypershell-main
  BASELINE_REGISTRY: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main

jobs:
  resolve-images:
    name: Wait for component image builds
    runs-on: ubuntu-24.04
    # Bounds the total time spent waiting on Konflux builds. The old bash poll
    # loop enforced its own 1200s ceiling; wait-on-check-action relies on the
    # job timeout instead.
    timeout-minutes: 25
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      api_server_image: ${{ steps.plan.outputs.api_server_image }}
      control_plane_image: ${{ steps.plan.outputs.control_plane_image }}
      web_console_image: ${{ steps.plan.outputs.web_console_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/detect-components.sh

      - name: Plan images and required Konflux builds
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_SHA: ${{ github.sha }}
          DETECT_API_SERVER: ${{ steps.detect.outputs.api_server }}
          DETECT_CONTROL_PLANE: ${{ steps.detect.outputs.control_plane }}
          DETECT_E2E: ${{ steps.detect.outputs.e2e }}
          DETECT_PR_TEST: ${{ steps.detect.outputs.pr_test }}
          DETECT_WEB_CONSOLE: ${{ steps.detect.outputs.web_console }}
        run: |
          baseline_api="${BASELINE_REGISTRY}/hypershell-api-server-main:latest"
          baseline_cp="${BASELINE_REGISTRY}/hypershell-control-plane-main:latest"
          baseline_wc="${BASELINE_REGISTRY}/hypershell-web-console-main:latest"

          # Default: nothing to wait for. The wait-on-check-action steps below
          # only run when a component's own source tree changed on a PR, which is
          # what triggers a Konflux on-pull-request build for that component.
          echo "wait_api_server=false"    >> "${GITHUB_OUTPUT}"
          echo "wait_control_plane=false" >> "${GITHUB_OUTPUT}"
          echo "wait_web_console=false"   >> "${GITHUB_OUTPUT}"

          case "${EVENT_NAME}" in
            pull_request)
              api_changed="${DETECT_API_SERVER:-false}"
              cp_changed="${DETECT_CONTROL_PLANE:-false}"
              e2e_changed="${DETECT_E2E:-false}"
              pr_test_changed="${DETECT_PR_TEST:-false}"
              web_console_changed="${DETECT_WEB_CONSOLE:-false}"

              e2e_relevant=false
              if [[ "${api_changed}" == "true" || "${cp_changed}" == "true" || \
                    "${e2e_changed}" == "true" || "${pr_test_changed}" == "true" || \
                    "${web_console_changed}" == "true" ]]; then
                e2e_relevant=true
              fi

              if [[ "${e2e_relevant}" != "true" ]]; then
                echo "No e2e-relevant components changed"
                echo "should_run=false" >> "${GITHUB_OUTPUT}"
                exit 0
              fi

              # Determine which components need a Konflux-built image.
              # detect-components uses broad paths (includes Makefile, .github/,
              # etc.) which is correct for "should we re-run e2e" but NOT for
              # "will Konflux build an image".  Konflux only triggers on files
              # under components/<name>/ -- check the actual diff.
              #
              # Use a three-dot (merge-base) diff: "${PR_BASE_SHA}...${PR_HEAD_SHA}"
              # compares the PR head against the point where this PR forked from the
              # base branch. A two-dot "${PR_BASE_SHA} HEAD" diff (where HEAD is a
              # merge commit) would also report component changes that landed on the
              # base branch *after* this PR forked, misattributing them to the PR --
              # then we would wait for a Konflux build that only ever runs for files
              # this PR actually touched.
              changed_files="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")"
              api_konflux=false
              cp_konflux=false
              wc_konflux=false
              if grep -q '^components/api-server/'    <<<"${changed_files}"; then api_konflux=true; fi
              if grep -q '^components/control-plane/' <<<"${changed_files}"; then cp_konflux=true; fi
              if grep -q '^components/web-console/'   <<<"${changed_files}"; then wc_konflux=true; fi

              if [[ "${api_konflux}" != "true" && "${cp_konflux}" != "true" && "${wc_konflux}" != "true" ]]; then
                echo "No source components changed -- using latest Konflux on-push images from main"
                main_sha=$(git rev-parse origin/main)
                main_tag="on-pr-${main_sha}"
                konflux_api="${KONFLUX_REGISTRY}/hypershell-api-server-main:${main_tag}"
                konflux_cp="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${main_tag}"
                konflux_wc="${KONFLUX_REGISTRY}/hypershell-web-console-main:${main_tag}"
                # Fall back to baseline if Konflux images are not available
                if skopeo inspect --raw "docker://${konflux_api}" >/dev/null 2>&1; then
                  echo "  Using Konflux images from main (${main_sha:0:7})"
                  echo "should_run=true" >> "${GITHUB_OUTPUT}"
                  echo "api_server_image=${konflux_api}" >> "${GITHUB_OUTPUT}"
                  echo "control_plane_image=${konflux_cp}" >> "${GITHUB_OUTPUT}"
                  echo "web_console_image=${konflux_wc}" >> "${GITHUB_OUTPUT}"
                else
                  echo "  Konflux images not found for main -- falling back to baseline"
                  echo "should_run=true" >> "${GITHUB_OUTPUT}"
                  echo "api_server_image=${baseline_api}" >> "${GITHUB_OUTPUT}"
                  echo "control_plane_image=${baseline_cp}" >> "${GITHUB_OUTPUT}"
                  echo "web_console_image=${baseline_wc}" >> "${GITHUB_OUTPUT}"
                fi
                exit 0
              fi

              # Source components changed. The image ref is deterministic
              # (on-pr-<head_sha>); the wait-on-check-action steps below block
              # until the matching Konflux build has finished pushing it.
              # Components that did not change keep the stable baseline image.
              tag="on-pr-${PR_HEAD_SHA}"
              api_img="${baseline_api}"
              cp_img="${baseline_cp}"
              wc_img="${baseline_wc}"

              if [[ "${api_konflux}" == "true" ]]; then
                api_img="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"
                echo "wait_api_server=true" >> "${GITHUB_OUTPUT}"
                echo "  api-server -> ${api_img} (waiting for Konflux build)"
              fi
              if [[ "${cp_konflux}" == "true" ]]; then
                cp_img="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"
                echo "wait_control_plane=true" >> "${GITHUB_OUTPUT}"
                echo "  control-plane -> ${cp_img} (waiting for Konflux build)"
              fi
              if [[ "${wc_konflux}" == "true" ]]; then
                wc_img="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"
                echo "wait_web_console=true" >> "${GITHUB_OUTPUT}"
                echo "  web-console -> ${wc_img} (waiting for Konflux build)"
              fi

              echo "should_run=true" >> "${GITHUB_OUTPUT}"
              echo "api_server_image=${api_img}" >> "${GITHUB_OUTPUT}"
              echo "control_plane_image=${cp_img}" >> "${GITHUB_OUTPUT}"
              echo "web_console_image=${wc_img}" >> "${GITHUB_OUTPUT}"
              ;;

            *)
              # push, merge_group, workflow_dispatch -- use latest Konflux on-push images
              push_tag="on-pr-${PUSH_SHA}"
              konflux_api="${KONFLUX_REGISTRY}/hypershell-api-server-main:${push_tag}"
              if skopeo inspect --raw "docker://${konflux_api}" >/dev/null 2>&1; then
                echo "Using Konflux on-push images (${PUSH_SHA:0:7})"
                echo "should_run=true" >> "${GITHUB_OUTPUT}"
                echo "api_server_image=${konflux_api}" >> "${GITHUB_OUTPUT}"
                echo "control_plane_image=${KONFLUX_REGISTRY}/hypershell-control-plane-main:${push_tag}" >> "${GITHUB_OUTPUT}"
                echo "web_console_image=${KONFLUX_REGISTRY}/hypershell-web-console-main:${push_tag}" >> "${GITHUB_OUTPUT}"
              else
                echo "Konflux on-push images not found -- falling back to baseline"
                echo "should_run=true" >> "${GITHUB_OUTPUT}"
                echo "api_server_image=${baseline_api}" >> "${GITHUB_OUTPUT}"
                echo "control_plane_image=${baseline_cp}" >> "${GITHUB_OUTPUT}"
                echo "web_console_image=${baseline_wc}" >> "${GITHUB_OUTPUT}"
              fi
              ;;
          esac

      # Block until each changed component's Konflux on-pull-request build has
      # concluded. wait-on-check-action waits for the *named* check to both
      # appear and finish, so a build whose check has not been created yet
      # cannot be skipped (the failure mode of the previous hand-rolled poll).
      # A non-success conclusion fails the step -> the job -> the E2E gate.
      - name: Wait for api-server Konflux build
        if: steps.plan.outputs.wait_api_server == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: hypershell-api-server-main-on-pull-request$
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 900
          # Only a success conclusion proves the build pushed on-pr-<head_sha>.
          # The action defaults to "success,skipped"; a skipped build never
          # pushes the image, so pin strict success to keep the image guarantee.
          allowed-conclusions: success

      - name: Wait for control-plane Konflux build
        if: steps.plan.outputs.wait_control_plane == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: hypershell-control-plane-main-on-pull-request$
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 900
          # Only a success conclusion proves the build pushed on-pr-<head_sha>.
          # The action defaults to "success,skipped"; a skipped build never
          # pushes the image, so pin strict success to keep the image guarantee.
          allowed-conclusions: success

      - name: Wait for web-console Konflux build
        if: steps.plan.outputs.wait_web_console == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: hypershell-web-console-main-on-pull-request$
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 900
          # Only a success conclusion proves the build pushed on-pr-<head_sha>.
          # The action defaults to "success,skipped"; a skipped build never
          # pushes the image, so pin strict success to keep the image guarantee.
          allowed-conclusions: success

  e2e-kind:
    name: E2E Kind
    needs: resolve-images
    if: needs.resolve-images.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: components/control-plane/go.mod
          cache-dependency-path: components/control-plane/go.sum

      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          kind version

      - name: Install openshell CLI
        run: |
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | sh
          openshell --version

      - name: Create Kind cluster with OIDC
        env:
          API_SERVER_IMAGE: ${{ needs.resolve-images.outputs.api_server_image }}
          CONTROL_PLANE_IMAGE: ${{ needs.resolve-images.outputs.control_plane_image }}
          WEB_CONSOLE_IMAGE: ${{ needs.resolve-images.outputs.web_console_image }}
          KIND_ENABLE_OIDC: "true"
        run: make kind-up

      - name: Run e2e tests
        env:
          E2E_INFRA_DRIVER: kind
          E2E_PROVISION_TIMEOUT: "300"
          E2E_SANDBOX_TIMEOUT: "180"
          # Force plain, non-graphical output from the openshell CLI. Off a TTY
          # its miette-style renderer wraps long diagnostics with a box-drawing
          # gutter (│) at an assumed 80-col width, which garbles captured logs.
          TERM: dumb
          NO_COLOR: "1"
        run: bash tests/e2e/e2e-openshell.sh

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-diagnostics

          echo "::group::All pods"
          kubectl get pods -A -o wide 2>&1 | tee e2e-diagnostics/pods.txt || true
          echo "::endgroup::"

          echo "::group::Pod descriptions (hypershell-system)"
          kubectl describe pods -n hypershell-system 2>&1 | tee e2e-diagnostics/pod-describes.txt || true
          echo "::endgroup::"

          echo "::group::Pod logs (hypershell-system)"
          {
            for label in app.kubernetes.io/name=hypershell app=hypershell-api-server app=hypershell-controller app=hypershell-web-console; do
              kubectl logs --all-containers --prefix --tail=200 -l "${label}" -n hypershell-system 2>&1 || true
            done
          } | tee e2e-diagnostics/pod-logs.txt
          echo "::endgroup::"

          echo "::group::Keycloak logs"
          kubectl logs --all-containers --prefix --tail=100 -l app=keycloak -n keycloak 2>&1 | tee e2e-diagnostics/keycloak-logs.txt || true
          echo "::endgroup::"

          echo "::group::Events (hypershell-system)"
          kubectl get events --sort-by=.lastTimestamp -n hypershell-system 2>&1 | tee e2e-diagnostics/events.txt || true
          echo "::endgroup::"

          echo "::group::Gateway API resources"
          {
            kubectl get gateways,grpcroutes,httproutes -A -o wide 2>&1 || true
            for ns in $(kubectl get ns -l hypershell.redhat.io/managed=true -o name 2>/dev/null); do
              ns_name="${ns##*/}"
              echo "--- $ns ---"
              kubectl get pods,svc,deployments -n "${ns_name}" 2>&1 || true
              echo "--- pod descriptions ($ns_name) ---"
              kubectl describe pods -n "${ns_name}" 2>&1 || true
              echo "--- events ($ns_name) ---"
              kubectl get events --sort-by=.lastTimestamp -n "${ns_name}" 2>&1 || true
              for pod in $(kubectl get pods -n "${ns_name}" -o name 2>/dev/null); do
                echo "--- logs ${pod} ($ns_name) ---"
                kubectl logs "${pod}" --all-containers --tail=80 -n "${ns_name}" 2>&1 || true
                echo "--- previous logs ${pod} ($ns_name) ---"
                kubectl logs "${pod}" --all-containers --previous --tail=80 -n "${ns_name}" 2>&1 || true
              done
            done
          } | tee e2e-diagnostics/gateway-api.txt
          echo "::endgroup::"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-diagnostics
          path: e2e-diagnostics/
          retention-days: 7

  summary:
    name: E2E CI gate
    if: ${{ always() && !cancelled() }}
    needs:
      - resolve-images
      - e2e-kind
    runs-on: ubuntu-24.04
    steps:
      - name: Check e2e results
        env:
          RESOLVE_RESULT: ${{ needs.resolve-images.result }}
          E2E_KIND_RESULT: ${{ needs.e2e-kind.result }}
        run: |
          for result in "${RESOLVE_RESULT}" "${E2E_KIND_RESULT}"; do
            if [[ "${result}" == failure || "${result}" == cancelled ]]; then
              echo "One or more e2e jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All e2e jobs passed or were skipped."
