name: PR Environment

# Ephemeral OpenShift environment for origin pull requests whose e2e-relevant
# paths changed (ephemeral-pr-environments.spec.md, HYPERSHELL-240).
#
# Default cycle: deploy the full stack into a per-PR namespace group, let
# Tests / E2E / OpenShift run against it, then destroy the environment in the
# same cycle whether the suite passed or failed. A write-access collaborator
# comments /pr-extend to keep the environment (sticky across later commits,
# inactivity timebox); /pr-release frees it early. Docs-only and other
# e2e-irrelevant PRs skip Deploy PR environment: that job would only bring up
# a baseline main stack. The gate matches Tests / E2E (plan-images should_run).
#
# The OpenShift e2e suite does NOT run here. Tests / E2E / OpenShift (e2e.yml,
# invoked by tests.yml) waits on this workflow's "Deploy PR environment" check
# and then runs the suite against the live namespace. Deploy failure and e2e
# failure therefore surface as distinct checks. In-run teardown of an
# unretained environment lives in this workflow's Teardown job so it cannot
# mask the e2e result.
#
# Teardown on merge/close lives in pr-environment-release.yml (pull_request
# closed only) so open/synchronize runs do not list a skipped Release check.
# /pr-extend and /pr-release live in pr-environment-commands.yml.
#
# Trust boundary: pull_request only (never pull_request_target). Every job is
# additionally guarded on head.repo == this repo, so a fork PR receives no
# cluster credentials and gets no environment. The GitHub org gate + allowlist
# govern interactive LOGIN to an already-deployed origin environment, not deploy.
#
# Required configuration (generate these; the names are stable):
#   secrets.OPENSHIFT_PR_ENV_SERVER_URL       target cluster API URL
#   secrets.OPENSHIFT_PR_ENV_TOKEN            CI service-account token (oc login)
#   secrets.PR_ENV_GITHUB_OAUTH_CLIENT_ID     GitHub OAuth App client id
#   secrets.PR_ENV_GITHUB_OAUTH_CLIENT_SECRET GitHub OAuth App client secret
#   secrets.PR_ENV_GITHUB_OAUTH_CALLBACK_URL  single stable cluster callback URL
#   vars.PR_ENV_GITHUB_ORG                    org gate (default openshift-online)
#   vars.PR_ENV_GITHUB_ALLOWLIST              extra usernames (comma-separated)
#   vars.PR_ENV_RETAINED_MAX_HOURS            retained max lifetime (default 72)
#   vars.PR_ENV_UNRETAINED_MAX_HOURS          unretained max lifetime (default 6)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  checks: read
  pull-requests: write

# Serialize per pull request so two swaps never leave a mixed digest set; a newer
# run cancels an older in-flight one, keeping the comment SHA honest.
concurrency:
  group: pr-env-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  KONFLUX_REGISTRY: quay.io/redhat-user-workloads/hcm-eng-prod-tenant/hypershell-main
  BASELINE_REGISTRY: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main

jobs:
  # --- Plan which component images this PR's environment should run ----------
  plan-images:
    name: Plan component images
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      api_server_image: ${{ steps.plan.outputs.api_server_image }}
      control_plane_image: ${{ steps.plan.outputs.control_plane_image }}
      web_console_image: ${{ steps.plan.outputs.web_console_image }}
      wait_api_server: ${{ steps.plan.outputs.wait_api_server }}
      wait_control_plane: ${{ steps.plan.outputs.wait_control_plane }}
      wait_web_console: ${{ steps.plan.outputs.wait_web_console }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        run: bash .github/scripts/detect-components.sh

      - name: Plan images and required Konflux builds
        id: plan
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DETECT_API_SERVER: ${{ steps.detect.outputs.api_server }}
          DETECT_CONTROL_PLANE: ${{ steps.detect.outputs.control_plane }}
          DETECT_E2E: ${{ steps.detect.outputs.e2e }}
          DETECT_PR_TEST: ${{ steps.detect.outputs.pr_test }}
        run: |
          # should_run MUST match the E2E workflow's plan-images job:
          # detect-components flags for api-server, control-plane, e2e, and
          # pr-test, plus the web-console Konflux CEL trigger. An
          # e2e-irrelevant PR would only deploy a baseline main environment.
          # Konflux wait patterns MUST mirror each component's pull-request
          # CEL trigger, matching the E2E workflow's plan-images job.
          changed_files="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")"
          api_konflux=false; cp_konflux=false; wc_konflux=false
          if grep -qE '^components/api-server/|^\.tekton/hypershell-api-server-main-pull-request\.yaml$' <<<"${changed_files}"; then api_konflux=true; fi
          if grep -qE '^components/control-plane/|^\.tekton/hypershell-control-plane-main-pull-request\.yaml$|^Dockerfile$' <<<"${changed_files}"; then cp_konflux=true; fi
          if grep -qE '^components/web-console/|^packages/gateway-management-ui/|^\.tekton/hypershell-web-console-main-pull-request\.yaml$' <<<"${changed_files}"; then wc_konflux=true; fi

          api_changed="${DETECT_API_SERVER:-false}"
          cp_changed="${DETECT_CONTROL_PLANE:-false}"
          e2e_changed="${DETECT_E2E:-false}"
          pr_test_changed="${DETECT_PR_TEST:-false}"

          e2e_relevant=false
          if [[ "${api_changed}" == "true" || "${cp_changed}" == "true" || \
                "${e2e_changed}" == "true" || "${pr_test_changed}" == "true" || \
                "${wc_konflux}" == "true" ]]; then
            e2e_relevant=true
          fi

          if [[ "${e2e_relevant}" != "true" ]]; then
            echo "No e2e-relevant components changed -- skipping PR environment deploy"
            {
              echo "should_run=false"
              echo "wait_api_server=false"
              echo "wait_control_plane=false"
              echo "wait_web_console=false"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          tag="on-pr-${PR_HEAD_SHA}"
          # Empty image refs leave the component on whatever make openshift-up
          # deployed (baseline). Only components this PR actually built are
          # swapped, so we do not re-roll unchanged deployments every run.
          api_img=""; cp_img=""; wc_img=""
          wait_api=false; wait_cp=false; wait_wc=false
          if [[ "${api_konflux}" == "true" ]]; then api_img="${KONFLUX_REGISTRY}/hypershell-api-server-main:${tag}"; wait_api=true; fi
          if [[ "${cp_konflux}" == "true" ]]; then cp_img="${KONFLUX_REGISTRY}/hypershell-control-plane-main:${tag}"; wait_cp=true; fi
          if [[ "${wc_konflux}" == "true" ]]; then wc_img="${KONFLUX_REGISTRY}/hypershell-web-console-main:${tag}"; wait_wc=true; fi

          {
            echo "should_run=true"
            echo "api_server_image=${api_img}"
            echo "control_plane_image=${cp_img}"
            echo "web_console_image=${wc_img}"
            echo "wait_api_server=${wait_api}"
            echo "wait_control_plane=${wait_cp}"
            echo "wait_web_console=${wait_wc}"
          } >> "${GITHUB_OUTPUT}"

  # --- Deploy / reconcile the environment -----------------------------------
  deploy:
    name: Deploy PR environment
    needs: plan-images
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.plan-images.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENSHIFT_NAMESPACE: hypershell-ci-pr-${{ github.event.pull_request.number }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_ENV_RETAINED_MAX_HOURS: ${{ vars.PR_ENV_RETAINED_MAX_HOURS || '72' }}
      PR_ENV_UNRETAINED_MAX_HOURS: ${{ vars.PR_ENV_UNRETAINED_MAX_HOURS || '6' }}
      PR_ENV_GITHUB_ORG: ${{ vars.PR_ENV_GITHUB_ORG || 'openshift-online' }}
      PR_ENV_GITHUB_ALLOWLIST: ${{ vars.PR_ENV_GITHUB_ALLOWLIST }}
      OPENSHIFT_PR_ENV_SERVER_URL: ${{ secrets.OPENSHIFT_PR_ENV_SERVER_URL }}
      OPENSHIFT_PR_ENV_TOKEN: ${{ secrets.OPENSHIFT_PR_ENV_TOKEN }}
      PR_ENV_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.PR_ENV_GITHUB_OAUTH_CLIENT_ID }}
      PR_ENV_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.PR_ENV_GITHUB_OAUTH_CLIENT_SECRET }}
      PR_ENV_GITHUB_OAUTH_CALLBACK_URL: ${{ secrets.PR_ENV_GITHUB_OAUTH_CALLBACK_URL }}
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy PR environment
        uses: ./.github/actions/deploy-pr-environment
        with:
          pr_number: ${{ github.event.pull_request.number }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          updated: ${{ github.event.action == 'synchronize' && 'true' || 'false' }}
          retained: ${{ contains(github.event.pull_request.labels.*.name, 'pr-environment/pr-extended') && 'true' || 'false' }}
          wait_api_server: ${{ needs.plan-images.outputs.wait_api_server }}
          wait_control_plane: ${{ needs.plan-images.outputs.wait_control_plane }}
          wait_web_console: ${{ needs.plan-images.outputs.wait_web_console }}
          api_server_image: ${{ needs.plan-images.outputs.api_server_image }}
          control_plane_image: ${{ needs.plan-images.outputs.control_plane_image }}
          web_console_image: ${{ needs.plan-images.outputs.web_console_image }}

  # In-run teardown for unretained cycles. Runs after deploy (pass or fail)
  # and, when deploy succeeded, after Tests / E2E / OpenShift concludes so
  # the suite still has a live target. A separate job so a teardown failure
  # cannot mask the e2e result. Re-reads the retained label because
  # /pr-extend may have landed while e2e was running.
  teardown:
    name: Teardown PR environment
    needs: [plan-images, deploy]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.plan-images.outputs.should_run == 'true' &&
      needs.deploy.result != 'skipped' &&
      needs.deploy.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENSHIFT_NAMESPACE: hypershell-ci-pr-${{ github.event.pull_request.number }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for Tests / E2E / OpenShift
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: 'E2E / OpenShift$'
          repo-token: ${{ github.token }}
          wait-interval: 30
          checks-discovery-timeout: 2400
          allowed-conclusions: success,failure,skipped,cancelled,neutral,timed_out

      - name: Re-read retained state
        id: retained
        run: |
          has="$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
            --jq --arg name "pr-environment/pr-extended" '[.[].name] | index($name) != null')"
          echo "retained=${has}" >> "${GITHUB_OUTPUT}"
          echo "Retained label present: ${has}"

      - name: Install oc
        if: steps.retained.outputs.retained != 'true'
        run: |
          mkdir -p "$(dirname "${KUBECONFIG}")"
          curl -LsS https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin oc kubectl
          oc version --client

      - name: Log in to the target cluster
        if: steps.retained.outputs.retained != 'true'
        env:
          SERVER_URL: ${{ secrets.OPENSHIFT_PR_ENV_SERVER_URL }}
          TOKEN: ${{ secrets.OPENSHIFT_PR_ENV_TOKEN }}
        run: |
          if [[ -z "${SERVER_URL}" || -z "${TOKEN}" ]]; then
            echo "::error::OPENSHIFT_PR_ENV_SERVER_URL / OPENSHIFT_PR_ENV_TOKEN are not set"
            exit 1
          fi
          oc login --server="${SERVER_URL}" --token="${TOKEN}" >/dev/null

      - name: Destroy unretained environment (make openshift-down)
        if: steps.retained.outputs.retained != 'true'
        run: make openshift-down
