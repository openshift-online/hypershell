name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    outputs:
      api_server: ${{ steps.detect.outputs.api_server }}
      cli: ${{ steps.detect.outputs.cli }}
      control_plane: ${{ steps.detect.outputs.control_plane }}
      gateway_management_ui: ${{ steps.detect.outputs.gateway_management_ui }}
      operational_dashboard_ui: ${{ steps.detect.outputs.operational_dashboard_ui }}
      pr_test: ${{ steps.detect.outputs.pr_test }}
      sdk_typescript: ${{ steps.detect.outputs.sdk_typescript }}
      web_console: ${{ steps.detect.outputs.web_console }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed components
        id: detect
        run: bash .github/scripts/detect-components.sh

  lint-api-server:
    name: Go lint - API server
    needs: detect-changes
    if: needs.detect-changes.outputs.api_server == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hypershell
      - name: Check out framework dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openshift-online/rh-trex-ai
          ref: ee905fbd54a8653e16cfc2115ca684adf5d29bb4
          path: rh-trex-ai
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: hypershell/components/api-server/go.mod
          cache-dependency-path: hypershell/components/api-server/go.sum
      - name: Check formatting
        working-directory: hypershell/components/api-server
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files are not formatted:"
            echo "${unformatted}"
            echo "Run 'gofmt -w .' in components/api-server and commit the result."
            exit 1
          fi
      - name: Run go vet
        working-directory: hypershell/components/api-server
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall
          working-directory: hypershell/components/api-server
          args: --timeout=5m

  lint-cli:
    name: Go lint - CLI
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: components/cli/go.mod
          cache-dependency-path: components/cli/go.sum
      - name: Check formatting
        working-directory: components/cli
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following CLI files are not formatted:"
            echo "${unformatted}"
            echo "Run 'gofmt -w .' in components/cli and commit the result."
            exit 1
          fi
      - name: Run go vet
        working-directory: components/cli
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall
          working-directory: components/cli
          args: --timeout=5m

  lint-control-plane:
    name: Go lint - control plane
    needs: detect-changes
    if: needs.detect-changes.outputs.control_plane == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: components/control-plane/go.mod
          cache-dependency-path: components/control-plane/go.sum
      - name: Check formatting
        working-directory: components/control-plane
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files are not formatted:"
            echo "${unformatted}"
            echo "Run 'gofmt -w .' in components/control-plane and commit the result."
            exit 1
          fi
      - name: Run go vet
        working-directory: components/control-plane
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall
          working-directory: components/control-plane
          args: --timeout=5m

  lint-sdk-typescript:
    name: TypeScript check - SDK
    needs: detect-changes
    if: needs.detect-changes.outputs.sdk_typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: bash scripts/bootstrap_pnpm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated SDK
        run: pnpm --filter @openshift-online/hypershell-sdk check

  lint-gateway-management-ui:
    name: Gateway management UI package quality gates
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway_management_ui == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: bash scripts/bootstrap_pnpm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build domain-probe contracts
        run: pnpm --filter @openshift-online/hypershell-domain-probes build
      - name: Run gateway management UI package quality gates
        run: pnpm --filter @openshift-online/hypershell-gateway-management-ui check

  lint-operational-dashboard-ui:
    name: Operational dashboard UI package quality gates
    needs: detect-changes
    if: needs.detect-changes.outputs.operational_dashboard_ui == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: bash scripts/bootstrap_pnpm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run operational dashboard UI package quality gates
        run: pnpm --filter @openshift-online/hypershell-operational-dashboard-ui check

  lint-pr-test:
    name: PR test script validation
    needs: detect-changes
    if: needs.detect-changes.outputs.pr_test == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax
        run: bash -n components/pr-test/e2e-openshell.sh

  lint-web-console:
    name: Web console quality gates
    needs: detect-changes
    if: needs.detect-changes.outputs.web_console == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: bash scripts/bootstrap_pnpm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static, unit, Storybook, and production build gates
        run: pnpm check:web
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @openshift-online/hypershell-web-console exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Install Chromium without `--with-deps` so the flaky apt phase
      # (actions/runner-images#11347) never lands on the critical path -- the
      # ubuntu-24.04 runner image already ships Chromium's system libraries.
      # Cache the browser download too, keyed on the resolved Playwright
      # version; only the default branch writes the cache, so PR runs cannot
      # poison it.
      - name: Restore Chromium cache
        id: playwright-chromium-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @openshift-online/hypershell-web-console exec playwright install chromium
      - name: Save Chromium cache
        if: github.ref == 'refs/heads/main' && steps.playwright-chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-chromium-cache.outputs.cache-primary-key }}
      - name: Run critical Chromium journey
        run: pnpm test:e2e:chromium

  summary:
    name: Lint CI gate
    if: ${{ always() && !cancelled() }}
    needs:
      - detect-changes
      - lint-api-server
      - lint-cli
      - lint-control-plane
      - lint-gateway-management-ui
      - lint-operational-dashboard-ui
      - lint-pr-test
      - lint-sdk-typescript
      - lint-web-console
    runs-on: ubuntu-24.04
    steps:
      - name: Check lint results
        env:
          DETECTION_RESULT: ${{ needs.detect-changes.result }}
          API_SERVER_RESULT: ${{ needs.lint-api-server.result }}
          CLI_RESULT: ${{ needs.lint-cli.result }}
          CONTROL_PLANE_RESULT: ${{ needs.lint-control-plane.result }}
          GATEWAY_MANAGEMENT_UI_RESULT: ${{ needs.lint-gateway-management-ui.result }}
          OPERATIONAL_DASHBOARD_UI_RESULT: ${{ needs.lint-operational-dashboard-ui.result }}
          PR_TEST_RESULT: ${{ needs.lint-pr-test.result }}
          SDK_TYPESCRIPT_RESULT: ${{ needs.lint-sdk-typescript.result }}
          WEB_CONSOLE_RESULT: ${{ needs.lint-web-console.result }}
        run: |
          for result in "${DETECTION_RESULT}" "${API_SERVER_RESULT}" "${CLI_RESULT}" "${CONTROL_PLANE_RESULT}" "${GATEWAY_MANAGEMENT_UI_RESULT}" "${OPERATIONAL_DASHBOARD_UI_RESULT}" "${PR_TEST_RESULT}" "${SDK_TYPESCRIPT_RESULT}" "${WEB_CONSOLE_RESULT}"; do
            if [[ "${result}" == failure || "${result}" == cancelled ]]; then
              echo "One or more lint jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All relevant lint jobs passed or were skipped."
