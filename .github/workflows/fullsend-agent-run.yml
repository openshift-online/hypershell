# GitHub issue label -> keyless CI -> disposable gateway -> fullsend agent run.
#
# Event-driven: labeling a work item with an agent/* label dispatches the matching
# agent(s) (via `fullsend dispatch`, the same harness-trigger evaluation the local
# funnel uses) and runs each on a fresh self-owned disposable gateway. VALIDATED
# end to end on hyp0 (triage triaged + closed a real issue via Claude-on-Vertex).
#
#   1. GitHub OIDC -> Keycloak token-exchange for a HyperShell-API-audience token.
#      The brokered CI identity carries the gateway:creator realm role by default,
#      so the token can create a gateway -- no stored creator credential.
#   2. hsctl apply a placement Gateway (managed mode) + mint an openshell-admin SA.
#   3. openshell logs in with the SA; `fullsend run <agent>` creates a sandbox and
#      runs the agent. Inference is Vertex AI (GH-secret ADC, CLAUDE_CODE_USE_VERTEX).
#   4. Always tear the gateway down.
#
# Prereqs (owner): repo secret VERTEX_SA_KEY (robert-vertex SA JSON); repo var
# FULLSEND_DRY_RUN ("false" to act for real, "true" to decide+log only).
name: Fullsend agent run (disposable gateway)

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      agent:
        description: "fullsend agent to run (manual override; blank = dispatch by label)"
        required: false
        default: ""
      issue_number:
        description: Work item (issue) number for the agent to act on
        required: true
      dry_run:
        description: Decide and log but do not mutate issues/PRs
        required: false
        default: "true"

permissions:
  contents: read
  id-token: write      # GitHub OIDC for the keyless token-exchange
  issues: write        # triage/lifecycle post-scripts apply labels to the work item
  pull-requests: write # PR-phase post-scripts (code/spec review) update PRs

concurrency:
  # Serialize per work item (the funnel is sequential per issue).
  group: fullsend-agent-run-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

env:
  FULLSEND_VERSION: v0.55.0
  OPENSHELL_VERSION: ${{ vars.FULLSEND_OPENSHELL_VERSION || 'v0.1.8-rhaiv.0' }}
  HYPERSHELL_API_URL: ${{ vars.FULLSEND_API_URL || 'https://api.hyp0.infra.hypershell.app' }}
  KEYCLOAK_URL: ${{ vars.FULLSEND_KEYCLOAK_URL || 'https://keycloak.hyp0.infra.hypershell.app' }}
  REALM: ${{ vars.FULLSEND_REALM || 'hypershell' }}
  FLEET_AUD: ${{ vars.FULLSEND_FLEET_AUDIENCE || 'openshell-fleet' }}
  REQUESTER: ${{ vars.FULLSEND_REQUESTER_CLIENT || 'ci-federation' }}
  IDP_ALIAS: ${{ vars.FULLSEND_IDP_ALIAS || 'github-actions' }}
  API_AUDIENCE: ${{ vars.FULLSEND_API_AUDIENCE || 'hypershell-api' }}
  GATEWAY_PLACEMENT: ${{ vars.FULLSEND_GATEWAY_PLACEMENT || 'network/public,provider/ibm' }}
  ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.FULLSEND_VERTEX_PROJECT_ID || 'hypershell-976970' }}
  CLOUD_ML_REGION: ${{ vars.FULLSEND_VERTEX_REGION || 'global' }}
  LABEL_SCOPE: ${{ vars.FULLSEND_SCOPE || 'agent/scope/hyp0' }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve work item + added label
        id: item
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            num="${{ github.event.inputs.issue_number }}"; added=""; dry="${{ github.event.inputs.dry_run }}"
          else
            num="${{ github.event.issue.number }}"; added="${{ github.event.label.name }}"
            dry="${{ vars.FULLSEND_DRY_RUN || 'false' }}"
          fi
          [ -n "$num" ] || { echo "no issue number" >&2; exit 1; }
          # On a label event, only agent/* labels drive dispatch.
          if [ "${{ github.event_name }}" = "issues" ]; then
            case "$added" in agent/*) : ;; *) echo "label '$added' is not agent/*; skip."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          fi
          item="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${num}")"
          state="$(echo "$item" | jq -r '.state')"
          labels="$(echo "$item" | jq -r '[.labels[].name] | join(",")')"
          url="$(echo "$item" | jq -r '.html_url')"
          if [ "$state" != "open" ]; then echo "#$num is $state; skip."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! printf ',%s,' "$labels" | grep -q ",${LABEL_SCOPE},"; then
            echo "#$num not in scope ${LABEL_SCOPE}; skip."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "number=$num"; echo "url=$url"; echo "added=$added"; echo "labels=$labels"; echo "dry=$dry"; echo "skip=false"; } >> "$GITHUB_OUTPUT"

      - name: Install fullsend + openshell + hsctl
        if: steps.item.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"; case "$arch" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac
          ver="${FULLSEND_VERSION#v}"
          curl -fsSL "https://github.com/fullsend-ai/fullsend/releases/download/${FULLSEND_VERSION}/fullsend_${ver}_${os}_${arch}.tar.gz" -o /tmp/fullsend.tgz
          tar -xzf /tmp/fullsend.tgz -C "$HOME/.local/bin" fullsend || tar -xzf /tmp/fullsend.tgz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/fullsend"
          gh release download --repo "${GITHUB_REPOSITORY}" --pattern "hsctl-${os}-${arch}" --dir /tmp/hsctl --clobber
          install -m 0755 "/tmp/hsctl/hsctl-${os}-${arch}" "$HOME/.local/bin/hsctl"
          OPENSHELL_VERSION="${OPENSHELL_VERSION}" sh scripts/install-openshell.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          fullsend --version || true; hsctl version 2>/dev/null || true; openshell version 2>/dev/null || true

      - name: Select agents
        if: steps.item.outputs.skip != 'true'
        id: select
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.agent }}" ]; then
            echo "agents=${{ github.event.inputs.agent }}" >> "$GITHUB_OUTPUT"
            echo "manual agent: ${{ github.event.inputs.agent }}"; exit 0
          fi
          # Build the label_changed event and let fullsend evaluate the harness
          # triggers (same as the local funnel's funnel_dispatch.py).
          labels_json="$(printf '%s' "${{ steps.item.outputs.labels }}" | jq -R 'split(",")')"
          added='${{ steps.item.outputs.added }}'
          [ -n "$added" ] || added="$(printf '%s' "${{ steps.item.outputs.labels }}" | tr ',' '\n' | grep '^agent/' | head -1)"
          event="$(jq -nc --arg repo "${GITHUB_REPOSITORY}" --argjson num "${{ steps.item.outputs.number }}" \
            --arg url "${{ steps.item.outputs.url }}" --arg added "$added" --argjson labels "$labels_json" \
            '{repo:$repo, entity:{kind:"work_item",id:$num,url:$url},
              source:{system:"github",raw_type:"issues",raw_action:"labeled"},
              transition:{kind:"label_changed",label:{name:$added,action:"added"}},
              actor:{id:"gha",kind:"human",role:"write",is_entity_author:false},
              state:{labels:$labels}}')"
          echo "dispatch event: $event"
          # Exclude ingest/reconcile (lifecycle-only, like the local dispatcher).
          agents="$(printf '%s' "$event" | fullsend dispatch --config-dir .fullsend --input-driver json --output-driver json 2>/dev/null \
            | jq -r '[.[].agent] | map(select(. != "ingest" and . != "reconcile")) | unique | join(" ")')" || agents=""
          echo "matched agents: ${agents:-<none>}"
          echo "agents=${agents}" >> "$GITHUB_OUTPUT"

      - name: Stage the Vertex ADC from the GitHub secret
        if: steps.item.outputs.skip != 'true' && steps.select.outputs.agents != ''
        env:
          VERTEX_SA_KEY: ${{ secrets.VERTEX_SA_KEY }}
        run: |
          set -euo pipefail
          [ -n "${VERTEX_SA_KEY}" ] || { echo "VERTEX_SA_KEY secret is empty" >&2; exit 1; }
          umask 077
          printf '%s' "${VERTEX_SA_KEY}" > "${RUNNER_TEMP}/vertex-adc.json"
          python3 -c "import json;d=json.load(open('${RUNNER_TEMP}/vertex-adc.json'));print('ADC ok:',d.get('type'),d.get('project_id'))"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/vertex-adc.json" >> "$GITHUB_ENV"

      - name: Mint GitHub Actions OIDC token
        if: steps.item.outputs.skip != 'true' && steps.select.outputs.agents != ''
        id: oidc
        run: |
          set -euo pipefail
          tok="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${FLEET_AUD}" | jq -r '.value')"
          [ -n "$tok" ] && [ "$tok" != "null" ] || { echo "OIDC mint failed" >&2; exit 1; }
          echo "::add-mask::$tok"; echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Create gateway + admin SA (keyless, re-auth as needed)
        if: steps.item.outputs.skip != 'true' && steps.select.outputs.agents != ''
        id: gw
        run: |
          set -euo pipefail
          relogin() {
            local tok access
            tok="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${FLEET_AUD}" | jq -r '.value')"
            access="$(curl -sS -X POST "${KEYCLOAK_URL}/realms/${REALM}/protocol/openid-connect/token" \
              -d 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
              -d "client_id=${REQUESTER}" -d "subject_token=${tok}" -d "subject_issuer=${IDP_ALIAS}" \
              -d 'subject_token_type=urn:ietf:params:oauth:token-type:jwt' | jq -r '.access_token // empty')"
            [ -n "$access" ] || { echo "re-exchange failed" >&2; return 1; }
            echo "::add-mask::$access"
            printf '%s' "$access" | hsctl login --token-file /dev/stdin --url "${HYPERSHELL_API_URL}" >/dev/null
          }
          relogin
          GW_NAME="ci-${GITHUB_RUN_ID}"
          sel="$(printf '%s' "${GATEWAY_PLACEMENT}" | jq -R 'split(",")')"
          manifest="$(jq -nc --arg n "$GW_NAME" --argjson sel "$sel" \
            '{apiVersion:"hypershell.redhat.io/v1", kind:"Gateway", metadata:{name:$n}, spec:{placement:{selector:$sel}}}')"
          echo "$manifest" | hsctl apply -f - -o json || { echo "gateway apply failed" >&2; exit 1; }
          GW_ID="$(hsctl list gateways -o json 2>/dev/null | jq -r --arg n "$GW_NAME" '(.items//.)[] | select(.name==$n) | .id' | head -1)"
          [ -n "$GW_ID" ] || { echo "could not resolve gateway id" >&2; exit 1; }
          echo "name=$GW_NAME" >> "$GITHUB_OUTPUT"; echo "id=$GW_ID" >> "$GITHUB_OUTPUT"
          echo "Gateway $GW_NAME ($GW_ID) created; minting admin SA..."
          sa_ok=false
          for i in $(seq 1 40); do
            if hsctl create serviceAccount --gateway-id "$GW_ID" --role openshell-admin \
                 --name "ci-admin-${GITHUB_RUN_ID}" --output-file "${RUNNER_TEMP}/gw-admin.json" 2>/tmp/sa.err; then
              sa_ok=true; echo "admin SA minted at t=$((i*15))s"; break
            fi
            grep -q "gateway_not_ready" /tmp/sa.err && echo "  t=$((i*15))s gateway not ready yet..." || { echo "SA error:"; cat /tmp/sa.err; break; }
            [ $((i % 8)) -eq 0 ] && { echo "  refreshing keyless token..."; relogin || true; }
            sleep 15
          done
          [ "$sa_ok" = true ] || { echo "admin SA not minted" >&2; cat /tmp/sa.err >&2; exit 1; }

      - name: openshell login (admin SA) + wait for gateway ready
        if: steps.item.outputs.skip != 'true' && steps.select.outputs.agents != ''
        env:
          GW_NAME: ${{ steps.gw.outputs.name }}
        run: |
          set -euo pipefail
          cred="$(jq -c '.credential // empty' "${RUNNER_TEMP}/gw-admin.json")"
          [ -n "$cred" ] || { echo "no .credential in SA bundle"; exit 1; }
          EP=$(printf '%s' "$cred" | jq -r '.gateway_endpoint'); ISS=$(printf '%s' "$cred" | jq -r '.issuer')
          TE=$(printf '%s' "$cred" | jq -r '.token_endpoint'); CIDG=$(printf '%s' "$cred" | jq -r '.client_id')
          CSG=$(printf '%s' "$cred" | jq -r '.client_secret'); AUDG=$(printf '%s' "$cred" | jq -r '.audience // empty')
          at=""
          for i in $(seq 1 24); do
            at="$(curl -sS -X POST "$TE" -d grant_type=client_credentials -d client_id="$CIDG" \
                   --data-urlencode "client_secret=$CSG" ${AUDG:+--data-urlencode "audience=$AUDG"} | jq -r '.access_token // empty')"
            [ -n "$at" ] && break; echo "  waiting for SA token endpoint..."; sleep 10
          done
          [ -n "$at" ] || { echo "could not mint SA access token" >&2; exit 1; }
          echo "::add-mask::$at"
          CFG="${HOME}/.config/openshell"; GW_DIR="${CFG}/gateways/${GW_NAME}"; mkdir -p "$GW_DIR"
          cat > "${GW_DIR}/metadata.json" <<JSON
          {"name":"${GW_NAME}","gateway_endpoint":"${EP}","is_remote":true,"gateway_port":0,"auth_mode":"oidc","oidc_issuer":"${ISS}","oidc_client_id":"${CIDG}","oidc_audience":"${AUDG:-$CIDG}"}
          JSON
          cat > "${GW_DIR}/oidc_token.json" <<JSON
          {"access_token":"${at}","issuer":"${ISS}","client_id":"${CIDG}"}
          JSON
          printf '%s' "${GW_NAME}" > "${CFG}/active_gateway"; chmod -R a+rX "${CFG}"
          # No OPENSHELL_GATEWAY_INSECURE: the cert verifies, and insecure mode makes the
          # CLI print a TLS warning that fullsend reads as part of `list-profiles -o json`.
          for i in $(seq 1 24); do
            openshell -g "${GW_NAME}" status >/dev/null 2>&1 && { echo "gateway answering at t=$((i*15))s"; break; }
            sleep 15
          done
          openshell -g "${GW_NAME}" whoami 2>&1 | head -5 || true

      - name: Run matched agents (fullsend run)
        if: steps.item.outputs.skip != 'true' && steps.select.outputs.agents != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FULLSEND_FORGE: github
          FULLSEND_LIFECYCLE: github-only
          FULLSEND_GATEWAY_NAME: ${{ steps.gw.outputs.name }}
          OPENSHELL_GATEWAY: ${{ steps.gw.outputs.name }}
          REPOSITORY: ${{ github.repository }}
          REPO_FULL_NAME: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.item.outputs.number }}
          FULLSEND_WORK_ITEM_URL: ${{ steps.item.outputs.url }}
          GITHUB_ISSUE_URL: ${{ steps.item.outputs.url }}
          DRY_RUN: ${{ steps.item.outputs.dry }}
        run: |
          set -euo pipefail
          rc=0
          for agent in ${{ steps.select.outputs.agents }}; do
            echo "::group::fullsend run ${agent} (DRY_RUN=${DRY_RUN})"
            if fullsend run "${agent}" --fullsend-dir .fullsend --target-repo .; then
              echo "agent ${agent}: OK"
            else
              echo "agent ${agent}: FAILED" >&2; rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Tear down the disposable gateway (always)
        if: always() && steps.gw.outputs.id != ''
        run: |
          set -euo pipefail
          tok="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${FLEET_AUD}" | jq -r '.value')" || tok=""
          access="$(curl -sS -X POST "${KEYCLOAK_URL}/realms/${REALM}/protocol/openid-connect/token" \
            -d 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            -d "client_id=${REQUESTER}" -d "subject_token=${tok}" -d "subject_issuer=${IDP_ALIAS}" \
            -d 'subject_token_type=urn:ietf:params:oauth:token-type:jwt' | jq -r '.access_token // empty')" || access=""
          [ -n "$access" ] && printf '%s' "$access" | hsctl login --token-file /dev/stdin --url "${HYPERSHELL_API_URL}" || true
          hsctl delete gateway "${{ steps.gw.outputs.id }}" --yes
          echo "Teardown requested for gateway ${{ steps.gw.outputs.id }}."

      - name: Summary
        if: always()
        run: |
          {
            echo "# Fullsend agent run (disposable gateway)"
            echo "- **Work item:** #${{ steps.item.outputs.number }}"
            echo "- **Trigger:** ${{ github.event_name }}"
            echo "- **Matched agents:** \`${{ steps.select.outputs.agents || '(none / skipped)' }}\`"
            echo "- **DRY_RUN:** \`${{ steps.item.outputs.dry }}\`"
            echo "- **Gateway:** \`${{ steps.gw.outputs.name }}\` (torn down)"
          } >> "$GITHUB_STEP_SUMMARY"
