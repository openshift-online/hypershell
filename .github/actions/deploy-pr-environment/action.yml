name: Deploy OpenShift Environment
description: >
  Bring up or reconcile an OpenShift environment, swap Konflux images by
  digest, and (on a pull request) stamp identity/timebox and update the
  access comment. Push to main omits pr_number: no comment, no GitHub OAuth,
  no retainment stamp.

inputs:
  pr_number:
    required: false
    default: ''
  head_sha:
    required: true
  updated:
    required: false
    default: 'false'
  retained:
    required: false
    default: 'false'
  wait_api_server:
    required: false
    default: 'false'
  wait_control_plane:
    required: false
    default: 'false'
  wait_web_console:
    required: false
    default: 'false'
  api_server_image:
    required: false
    default: ''
  control_plane_image:
    required: false
    default: ''
  web_console_image:
    required: false
    default: ''
  api_server_check_regexp:
    required: false
    default: 'hypershell-api-server-main-on-pull-request$'
  control_plane_check_regexp:
    required: false
    default: 'hypershell-control-plane-main-on-pull-request$'
  web_console_check_regexp:
    required: false
    default: 'hypershell-web-console-main-on-pull-request$'

runs:
  using: composite
  steps:
    # Resolve the inactivity expiry before the deploying comment so that
    # comment, stamp-pr-env.sh, and the ready comment all share one UTC
    # timestamp instead of drifting by the deploy duration.
    - name: Resolve inactivity expiry
      if: inputs.pr_number != ''
      id: timebox
      shell: bash
      env:
        PR_ENV_RETAINED: ${{ inputs.retained }}
      run: |
        # shellcheck source=scripts/ci/pr-env-lib.sh
        source scripts/ci/pr-env-lib.sh
        echo "expires_at=$(pr_env_inactivity_expires_at "${PR_ENV_RETAINED}")" >> "${GITHUB_OUTPUT}"

    - name: Post initial "deploying" comment
      if: inputs.pr_number != ''
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        PR_HEAD_SHA: ${{ inputs.head_sha }}
        PR_ENV_PHASE: deploying
        PR_ENV_RETAINED: ${{ inputs.retained }}
        PR_ENV_EXPIRES_AT: ${{ steps.timebox.outputs.expires_at }}
      run: bash scripts/ci/upsert-pr-comment.sh

    - name: Install oc, skopeo, and openshell CLI
      shell: bash
      run: |
        mkdir -p "$(dirname "${KUBECONFIG}")"
        curl -LsS https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
          | sudo tar -xz -C /usr/local/bin oc kubectl
        oc version --client
        sudo apt-get update
        sudo apt-get install -y skopeo
        skopeo --version
        curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/v0.0.110/install.sh | OPENSHELL_VERSION=v0.0.110 sh
        openshell --version

    - name: Log in to the target cluster
      uses: ./.github/actions/openshift-cluster-login
      with:
        role-arn: ${{ env.PR_ENV_AWS_ROLE_ARN }}

    - name: Install cluster pull secret
      shell: bash
      run: |
        mkdir -p "${HOME}/.docker"
        oc get secret pull-secret -n openshift-config \
          -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > "${HOME}/.docker/config.json"
        echo "Installed cluster pull secret for registry inspect"

    - name: Wait for ESO secrets and ensure e2e client
      if: inputs.pr_number != ''
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        kc_ns="${OPENSHIFT_NAMESPACE}-keycloak"
        oc create namespace "${kc_ns}" --dry-run=client -o yaml | oc apply -f - >/dev/null
        oc label namespace "${kc_ns}" \
          hypershell.redhat.io/ci-keycloak=true \
          --overwrite
        bash scripts/ci/wait-for-secret-keys.sh "${kc_ns}" hypershell-github-oauth \
          client_id client_secret callback_url
        bash scripts/ci/wait-for-secret-keys.sh "${kc_ns}" hypershell-e2e-test-users \
          admin developer platform-admin
        bash scripts/ci/ensure-e2e-client-secret.sh

    - name: Deploy / reconcile environment (make openshift-up)
      shell: bash
      env:
        SKIP_SEED: "true"
      run: make openshift-up

    - name: Recycle Keycloak when GitHub OAuth secret changes
      if: inputs.pr_number != ''
      shell: bash
      run: |
        kc_ns="${OPENSHIFT_NAMESPACE}-keycloak"
        hash="$(oc get secret hypershell-github-oauth -n "${kc_ns}" \
          -o jsonpath='{.data.client_id}{.data.client_secret}{.data.callback_url}' \
          | sha256sum | awk '{print $1}')"
        current="$(oc get deploy/keycloak -n "${kc_ns}" \
          -o jsonpath='{.spec.template.metadata.annotations.hypershell\.redhat\.io/oauth-secret}' || true)"
        if [[ "${current}" == "${hash}" ]]; then
          echo "Keycloak oauth-secret annotation already matches; skip recycle"
          exit 0
        fi
        oc patch deploy/keycloak -n "${kc_ns}" --type=merge -p \
          "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"hypershell.redhat.io/oauth-secret\":\"${hash}\"}}}}}"
        oc rollout status deploy/keycloak -n "${kc_ns}" --timeout=600s

    - name: Stamp namespace group (identity + timebox)
      if: inputs.pr_number != ''
      id: stamp
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        PR_ENV_RETAINED: ${{ inputs.retained }}
        PR_ENV_EXPIRES_AT: ${{ steps.timebox.outputs.expires_at }}
      run: bash scripts/ci/stamp-pr-env.sh

    - name: Wait for api-server Konflux build
      if: inputs.wait_api_server == 'true'
      uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
      with:
        ref: ${{ inputs.head_sha }}
        check-regexp: ${{ inputs.api_server_check_regexp }}
        repo-token: ${{ github.token }}
        wait-interval: 30
        checks-discovery-timeout: 900
        allowed-conclusions: success

    - name: Wait for control-plane Konflux build
      if: inputs.wait_control_plane == 'true'
      uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
      with:
        ref: ${{ inputs.head_sha }}
        check-regexp: ${{ inputs.control_plane_check_regexp }}
        repo-token: ${{ github.token }}
        wait-interval: 30
        checks-discovery-timeout: 900
        allowed-conclusions: success

    - name: Wait for web-console Konflux build
      if: inputs.wait_web_console == 'true'
      uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
      with:
        ref: ${{ inputs.head_sha }}
        check-regexp: ${{ inputs.web_console_check_regexp }}
        repo-token: ${{ github.token }}
        wait-interval: 30
        checks-discovery-timeout: 900
        allowed-conclusions: success

    - name: Swap PR images by digest
      shell: bash
      env:
        API_SERVER_IMAGE: ${{ inputs.api_server_image }}
        CONTROL_PLANE_IMAGE: ${{ inputs.control_plane_image }}
        WEB_CONSOLE_IMAGE: ${{ inputs.web_console_image }}
      run: bash scripts/ci/swap-openshift-images-by-digest.sh

    - name: Seed platform resources
      shell: bash
      env:
        SEED_STRICT: "true"
      run: make openshift-seed

    - name: Discover access URLs
      id: urls
      shell: bash
      run: |
        api_host="$(oc get route hypershell-api -n "${OPENSHIFT_NAMESPACE}" -o jsonpath='{.spec.host}' 2>/dev/null || true)"
        web_host="$(oc get route hypershell-web-console -n "${OPENSHIFT_NAMESPACE}" -o jsonpath='{.spec.host}' 2>/dev/null || true)"
        kc_host="$(oc get route keycloak -n "${OPENSHIFT_NAMESPACE}-keycloak" -o jsonpath='{.spec.host}' 2>/dev/null || true)"
        {
          echo "api_url=https://${api_host}"
          echo "web_url=https://${web_host}"
          echo "keycloak_url=https://${kc_host}"
          echo "console_url=$(oc whoami --show-console 2>/dev/null || echo '')"
          echo "cluster_api_url=$(oc whoami --show-server 2>/dev/null || echo '')"
        } >> "${GITHUB_OUTPUT}"

    - name: Post / update access comment
      if: inputs.pr_number != ''
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        PR_HEAD_SHA: ${{ inputs.head_sha }}
        PR_ENV_UPDATED: ${{ inputs.updated }}
        PR_ENV_RETAINED: ${{ inputs.retained }}
        PR_ENV_EXPIRES_AT: ${{ steps.stamp.outputs.expires_at }}
        PLATFORM_NS: ${{ steps.stamp.outputs.platform_namespace }}
        KEYCLOAK_NS: ${{ steps.stamp.outputs.keycloak_namespace }}
        CONSOLE_URL: ${{ steps.urls.outputs.console_url }}
        API_URL: ${{ steps.urls.outputs.api_url }}
        WEB_URL: ${{ steps.urls.outputs.web_url }}
        KEYCLOAK_URL: ${{ steps.urls.outputs.keycloak_url }}
        CLUSTER_API_URL: ${{ steps.urls.outputs.cluster_api_url }}
      run: bash scripts/ci/upsert-pr-comment.sh

    - name: Collect diagnostics
      if: failure()
      shell: bash
      run: |
        mkdir -p e2e-diagnostics
        oc get pods -n "${OPENSHIFT_NAMESPACE}" -o wide 2>&1 | tee e2e-diagnostics/pods.txt || true
        oc get events --sort-by=.lastTimestamp -n "${OPENSHIFT_NAMESPACE}" 2>&1 | tee e2e-diagnostics/events.txt || true
        oc logs --all-containers --prefix --tail=200 -l app=hypershell-api-server -n "${OPENSHIFT_NAMESPACE}" 2>&1 | tee e2e-diagnostics/api-server.txt || true
        oc logs --all-containers --prefix --tail=200 -l app=hypershell-controller -n "${OPENSHIFT_NAMESPACE}" 2>&1 | tee e2e-diagnostics/controller.txt || true

    - name: Upload diagnostics
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: pr-env-diagnostics-${{ inputs.pr_number || 'main' }}
        path: e2e-diagnostics/
        retention-days: 7
