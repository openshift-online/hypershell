name: OpenShift cluster login from AWS
description: >
  Assume the CI IAM role with GitHub OIDC, fetch hysh-aws-01/ci/cluster-login,
  mask the values, and oc login. Does not read GitHub OAuth or test-tier
  passwords (ephemeral-ci-secrets.spec.md).

inputs:
  role-arn:
    required: true
    description: IAM role ARN that can read only hysh-aws-01/ci/cluster-login.

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (GitHub OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1
        audience: sts.amazonaws.com

    - name: Fetch cluster login and oc login
      shell: bash
      run: bash scripts/ci/login-openshift-from-aws.sh
