name = "tiered"
# Anthropic Claude via Vertex AI Model Garden (provider "anthropic-vertex").
# Location pinned to us-east5 -- the only region with accessible Anthropic
# models in project hypershell-976970. CLOUD_ML_REGION=global in the
# environment does NOT override the location= param here.
#
# Confirmed OK models (no quota issues): haiku-4-5, sonnet-4-6, opus-4-6.
# claude-sonnet-5 and claude-opus-4-8 have near-zero per-minute quota and
# 429 immediately -- use the sandbox profile instead for those.

[tiers.small]
provider = "anthropic-vertex"
model = "claude-haiku-4-5@20251001"
[tiers.small.params]
location = "us-east5"
temperature = 0
price_in_per_m = 1.00
price_out_per_m = 5.00

[tiers.standard]
provider = "anthropic-vertex"
model = "claude-sonnet-4-6"
[tiers.standard.params]
location = "us-east5"
temperature = 0
price_in_per_m = 3.00
price_out_per_m = 15.00

[tiers.deep]
provider = "anthropic-vertex"
model = "claude-opus-4-6"
[tiers.deep.params]
location = "us-east5"
temperature = 0
price_in_per_m = 15.00
price_out_per_m = 75.00

[overrides]
# Override a step's tier by id, e.g.: gap-analysis = "standard"
