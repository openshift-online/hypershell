name = "tiered"
# Anthropic Claude via Vertex AI Model Garden (provider "anthropic-vertex").
# GCP project and region are read from the environment
# (ANTHROPIC_VERTEX_PROJECT_ID / CLOUD_ML_REGION, or GOOGLE_CLOUD_PROJECT /
# GOOGLE_CLOUD_LOCATION); add project=/location= under a tier's params to pin
# them. Model ids must be enabled in your Vertex project. The price_*_per_m
# values are USD per million tokens for local cost estimates only.

[tiers.small]
provider = "anthropic-vertex"
model = "claude-haiku-4-5@20251001"
[tiers.small.params]
temperature = 0
price_in_per_m = 1.00
price_out_per_m = 5.00

[tiers.standard]
provider = "anthropic-vertex"
model = "claude-sonnet-4-5@20250929"
[tiers.standard.params]
temperature = 0
price_in_per_m = 3.00
price_out_per_m = 15.00

[tiers.deep]
provider = "anthropic-vertex"
model = "claude-opus-4-1@20250805"
[tiers.deep.params]
temperature = 0
price_in_per_m = 15.00
price_out_per_m = 75.00

[overrides]
# Override a step's tier by id, e.g. run gap analysis on the mid tier:
# gap-analysis = "standard"
