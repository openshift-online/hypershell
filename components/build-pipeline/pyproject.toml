[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypershell-build-pipeline"
version = "0.1.0"
description = "Agentic build chain for HyperShell (executes the full-stack-pipeline workflow under configurable per-step models)"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-google-vertexai>=2.0",
    # ChatAnthropicVertex (Claude on Vertex, the default provider) wraps
    # anthropic.AnthropicVertex; the [vertex] extra pulls google-auth. Cap to
    # <1 because langchain-google-vertexai requires anthropic<1.0.0 (the 1.x
    # SDK dropped `temperature` from messages.create, which LC always sends).
    "anthropic[vertex]>=0.60,<1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
build-pipeline = "build_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["build_pipeline*"]

[tool.setuptools.package-data]
build_pipeline = ["profiles/*.toml"]
