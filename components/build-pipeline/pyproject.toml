[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypershell-build-pipeline"
version = "0.1.0"
description = "Agentic build chain for HyperShell (executes the full-stack-pipeline workflow under configurable per-step models)"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-google-vertexai>=2.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
build-pipeline = "build_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["build_pipeline*"]

[tool.setuptools.package-data]
build_pipeline = ["profiles/*.toml"]
