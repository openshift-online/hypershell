components:
  parameters:
    id:
      description: The id of record
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    page:
      description: Page number of record list when record list exceeds specified page
        size
      explode: true
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    size:
      description: Maximum number of records to return
      explode: true
      in: query
      name: size
      required: false
      schema:
        default: 100
        minimum: 0
        type: integer
      style: form
    search:
      description: Specifies the search criteria
      explode: true
      in: query
      name: search
      required: false
      schema:
        type: string
      style: form
    orderBy:
      description: Specifies the order by criteria
      explode: true
      in: query
      name: orderBy
      required: false
      schema:
        type: string
      style: form
    fields:
      description: Supplies a comma-separated list of fields to be returned
      explode: true
      in: query
      name: fields
      required: false
      schema:
        type: string
      style: form
    gatewayId:
      description: Selected Gateway ID
      in: path
      name: gateway_id
      required: true
      schema:
        type: string
    status:
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/OpenShellGatewayServiceAccountStatus"
    sort:
      in: query
      name: sort
      required: false
      schema:
        default: created_at
        enum:
        - name
        - role
        - status
        - expires_at
        - created_at
        type: string
    order:
      in: query
      name: order
      required: false
      schema:
        default: desc
        enum:
        - asc
        - desc
        type: string
    serviceAccountId:
      description: OpenShellGatewayServiceAccount ID
      in: path
      name: service_account_id
      required: true
      schema:
        type: string
    role:
      description: Filter by console role tier
      in: query
      name: role
      required: false
      schema:
        $ref: "#/components/schemas/GatewayAccessRole"
    userId:
      description: HyperShell User ID
      in: path
      name: user_id
      required: true
      schema:
        type: string
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    ForbiddenError:
      description: Access token does not have sufficient privileges
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Unexpected error occurred
    BadRequestError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Invalid request or query value
    NotFoundError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Gateway or service account was not found or is not visible
    ConflictError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Gateway is not ready or the active name already exists
    TooManyRequestsError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: A service-account quota is exhausted
    ServiceUnavailableError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Keycloak provisioning or lifecycle verification is unavailable
  schemas:
    List:
      allOf:
      - properties:
          kind:
            type: string
          page:
            type: integer
          size:
            type: integer
          total:
            type: integer
        type: object
      - $ref: "#/components/schemas/ObjectReference"
    ObjectReference:
      example:
        updated_at: 2000-01-23T04:56:07.000+00:00
        kind: kind
        created_at: 2000-01-23T04:56:07.000+00:00
        id: id
        href: href
      properties:
        id:
          type: string
        kind:
          type: string
        href:
          type: string
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    Error:
      allOf:
      - $ref: "#/components/schemas/ObjectReference"
      - properties:
          code:
            type: string
          reason:
            type: string
          operation_id:
            type: string
        type: object
      example:
        reason: reason
        code: code
        updated_at: 2000-01-23T04:56:07.000+00:00
        kind: kind
        created_at: 2000-01-23T04:56:07.000+00:00
        operation_id: operation_id
        id: id
        href: href
    ManagedCluster:
      allOf:
      - $ref: "#/components/schemas/ObjectReference"
      - properties:
          name:
            type: string
          provider:
            type: string
          region:
            type: string
          kubeconfig_secret:
            type: string
          status:
            type: string
          api_server_url:
            type: string
          oidc_subject:
            description: OIDC sub claim of the service account that registered this
              cluster. Server-assigned; not writable.
            readOnly: true
            type: string
          last_seen_at:
            description: Timestamp of the most recent registration call. Updated on
              every POST /registration.
            format: date-time
            readOnly: true
            type: string
        required:
        - kubeconfig_secret
        - name
        - provider
        type: object
      example:
        kind: kind
        created_at: 2000-01-23T04:56:07.000+00:00
        oidc_subject: oidc_subject
        updated_at: 2000-01-23T04:56:07.000+00:00
        provider: provider
        name: name
        kubeconfig_secret: kubeconfig_secret
        id: id
        href: href
        region: region
        last_seen_at: 2000-01-23T04:56:07.000+00:00
        status: status
        api_server_url: api_server_url
    ManagedClusterList:
      allOf:
      - $ref: "#/components/schemas/List"
      - properties:
          items:
            items:
              $ref: "#/components/schemas/ManagedCluster"
            type: array
        type: object
      example:
        total: 1
        size: 6
        updated_at: 2000-01-23T04:56:07.000+00:00
        kind: kind
        created_at: 2000-01-23T04:56:07.000+00:00
        page: 0
        id: id
        href: href
        items:
        - kind: kind
          created_at: 2000-01-23T04:56:07.000+00:00
          oidc_subject: oidc_subject
          updated_at: 2000-01-23T04:56:07.000+00:00
          provider: provider
          name: name
          kubeconfig_secret: kubeconfig_secret
          id: id
          href: href
          region: region
          last_seen_at: 2000-01-23T04:56:07.000+00:00
          status: status
