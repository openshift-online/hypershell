openapi: 3.0.3
info:
  description: HyperShell fleet management API
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: HyperShell API
  version: 1.0.0
servers:
- description: localhost
  url: http://localhost:8000
- description: current domain
  url: /
security:
- Bearer: []
tags:
- description: Default API operations
  name: default
paths:
  /api/hypershell/v1/metadata:
    get:
      operationId: getMetadata
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectReference"
          description: Service metadata
      summary: Service metadata
  /api/hypershell/v1/fleets:
    get:
      operationId: listFleets
      parameters:
      - description: Page number of record list when record list exceeds specified
          page size
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Maximum number of records to return
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 100
          minimum: 0
          type: integer
        style: form
      - description: Specifies the search criteria
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Specifies the order by criteria
        explode: true
        in: query
        name: orderBy
        required: false
        schema:
          type: string
        style: form
      - description: Supplies a comma-separated list of fields to be returned
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetList"
          description: A JSON array of fleet objects
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error occurred
      security:
      - Bearer: []
      summary: Returns a list of fleets
    post:
      operationId: createFleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fleet"
        description: Fleet data
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fleet"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation errors occurred
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Fleet already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected error occurred creating the fleet
      security:
      - Bearer: []
      summary: Create a new fleet
  /api/hypershell/v1/fleets/{id}:
    delete:
      operationId: deleteFleet
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Fleet deleted successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No fleet with specified id exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error deleting fleet
      security:
      - Bearer: []
      summary: Delete a fleet
    get:
      operationId: getFleet
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
