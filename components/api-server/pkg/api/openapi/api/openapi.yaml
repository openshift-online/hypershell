openapi: 3.0.3
info:
  description: HyperShell gateway management API
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: HyperShell API
  version: 1.0.0
servers:
- description: localhost
  url: http://localhost:8000
- description: current domain
  url: /
security:
- Bearer: []
tags:
- description: Default API operations
  name: default
paths:
  /api/hypershell/v1/metadata:
    get:
      operationId: getMetadata
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectReference"
          description: Service metadata
      summary: Service metadata
  /api/hypershell/v1/managed_clusters:
    get:
      operationId: listManagedClusters
      parameters:
      - description: Page number of record list when record list exceeds specified
          page size
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Maximum number of records to return
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 100
          minimum: 0
          type: integer
        style: form
      - description: Specifies the search criteria
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Specifies the order by criteria
        explode: true
        in: query
        name: orderBy
        required: false
        schema:
          type: string
        style: form
      - description: Supplies a comma-separated list of fields to be returned
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedClusterList"
          description: A JSON array of managedCluster objects
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error occurred
      security:
      - Bearer: []
      summary: Returns a list of managedClusters
    post:
      operationId: createManagedCluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedCluster"
        description: ManagedCluster data
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedCluster"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation errors occurred
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: A ManagedCluster with this name already exists (names are unique
            across all records)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected error occurred creating the managedCluster
      security:
      - Bearer: []
      summary: Create a new managedCluster
  /api/hypershell/v1/managed_clusters/registration:
    post:
      description: |
        Idempotent. Creates a ManagedCluster record on first call; returns the existing
        cluster_id on subsequent calls from the same OIDC identity. Updates last_seen_at
        on every call, making this endpoint double as a heartbeat. Requires the
        managed-cluster-registrar Keycloak realm role. Registration never adopts an
        existing record: a name held by a record with a different or empty
        oidc_subject is a 409 Conflict.
      operationId: registerManagedCluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedClusterRegistrationRequest"
        description: Registration request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedClusterRegistrationResponse"
          description: Already registered; last_seen_at updated
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedClusterRegistrationResponse"
          description: Registered for the first time
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing managed-cluster-registrar role
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: |
            The same OIDC subject is already registered under a different name, or the
            requested name is held by a record with a different or empty oidc_subject
            (another control plane, or a record created with POST /managed_clusters).
            The error reason names the existing record's id; an operator must delete it
            (and re-point any gateways that reference it) before this control plane can
            register under that name.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - Bearer: []
      summary: Self-register a control plane as a managed cluster
  /api/hypershell/v1/managed_clusters/{id}:
    delete:
      operationId: deleteManagedCluster
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Managed cluster deleted successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No managed cluster with specified id exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error deleting managed cluster
      security:
      - Bearer: []
      summary: Delete a managed cluster
    get:
      operationId: getManagedCluster
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedCluster"
          description: ManagedCluster found by id
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No managedCluster with specified id exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error occurred
      security:
      - Bearer: []
      summary: Get an managedCluster by id
    patch:
      operationId: updateManagedCluster
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedClusterPatchRequest"
        description: Updated managedCluster data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedCluster"
          description: ManagedCluster updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation errors occurred
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No managedCluster with specified id exists
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ManagedCluster already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error updating managedCluster
      security:
      - Bearer: []
      summary: Update an managedCluster
  /api/hypershell/v1/gateways:
    get:
      operationId: listGateways
      parameters:
      - description: Page number of record list when record list exceeds specified
          page size
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Maximum number of records to return
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 100
          minimum: 0
          type: integer
        style: form
      - description: Specifies the search criteria
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Specifies the order by criteria
        explode: true
        in: query
        name: orderBy
        required: false
        schema:
          type: string
        style: form
      - description: Supplies a comma-separated list of fields to be returned
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayList"
          description: A JSON array of gateway objects
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error occurred
      security:
      - Bearer: []
      summary: Returns a list of gateways
    post:
      operationId: createGateway
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayCreateRequest"
        description: Gateway data
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gateway"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: |
            Validation errors occurred, including a cluster_id that is empty or does not
            reference a ManagedCluster with a registered control plane (non-empty
            oidc_subject). On update, cluster_id is validated only when it changes.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gateway already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected error occurred creating the gateway
      security:
      - Bearer: []
      summary: Create a new gateway
  /api/hypershell/v1/gateways/{id}:
    delete:
      operationId: deleteGateway
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Gateway deleted successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No gateway with specified id exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error deleting gateway
      security:
      - Bearer: []
      summary: Delete a gateway
    get:
      operationId: getGateway
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gateway"
          description: Gateway found by id
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No gateway with specified id exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error occurred
      security:
      - Bearer: []
      summary: Get an gateway by id
    patch:
      operationId: updateGateway
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayPatchRequest"
        description: Updated gateway data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gateway"
          description: Gateway updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: |
            Validation errors occurred, including a cluster_id that is empty or does not
            reference a ManagedCluster with a registered control plane (non-empty
            oidc_subject). On update, cluster_id is validated only when it changes.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized to perform operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No gateway with specified id exists
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gateway already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error updating gateway
      security:
      - Bearer: []
      summary: Update an gateway
  /api/hypershell/v1/gateways/{gateway_id}/service_accounts:
    get:
      operationId: listGatewayServiceAccounts
      parameters:
      - description: Selected Gateway ID
        in: path
        name: gateway_id
        required: true
        schema:
          type: string
      - description: Page number of record list when record list exceeds specified
          page size
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Maximum number of records to return
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 100
          minimum: 0
          type: integer
        style: form
      - in: query
        name: status
        required: false
        schema:
          $ref: "#/components/schemas/OpenShellGatewayServiceAccountStatus"
      - description: Specifies the search criteria
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - in: query
        name: sort
        required: false
        schema:
          default: created_at
          enum:
          - name
          - role
          - status
          - expires_at
          - created_at
          type: string
      - in: query
        name: order
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenShellGatewayServiceAccountList"
          description: Visible service accounts and caller capabilities
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request or query value
        "401":
          description: Access token is missing or invalid
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gateway or service account was not found or is not visible
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error occurred
      summary: List OpenShell gateway service accounts
    post:
      operationId: createGatewayServiceAccount
      parameters:
      - description: Selected Gateway ID
        in: path
        name: gateway_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenShellGatewayServiceAccountCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenShellGatewayServiceAccountCreateResponse"
          description: Service account created; the credential is returned once
          headers:
            Cache-Control:
              description: Prevent storage of the one-time credential response
              schema:
                example: no-store
                type: string
            Pragma:
              description: Prevent legacy caches from storing the response
              schema:
                example: no-cache
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request or query value
        "401":
          description: Access token is missing or invalid
        "403":
          description: Access token does not have sufficient privileges
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gateway or service account was not found or is not visible
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gateway is not ready or the active name already exists
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: A service-account quota is exhausted
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Keycloak provisioning or lifecycle verification is unavailable
      summary: Create an OpenShell gateway service account
  /api/hypershell/v1/gateways/{gateway_id}/service_accounts/{service_account_id}:
    delete:
      operationId: deleteGatewayServiceAccount
      parameters:
      - description: Selected Gateway ID
        in: path
        name: gateway_id
        required: true
        schema:
          type: string
      - description: OpenShellGatewayServiceAccount ID
        in: path
        name: service_account_id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenShellGatewayServiceAccountListItem"
          description: Deletion is persisted and cleanup is still pending
        "204":
          description: Keycloak identity removed and resource soft-deleted
        "401":
          description: Access token is missing or invalid
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gateway or service account was not found or is not visible
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Keycloak provisioning or lifecycle verification is unavailable
      summary: Delete an OpenShell gateway service account
    get:
      operationId: getGatewayServiceAccount
      parameters:
      - description: Selected Gateway ID
        in: path
        name: gateway_id
        required: true
        schema:
          type: string
      - description: OpenShellGatewayServiceAccount ID
        in: path
        name: service_account_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenShellGatewayServiceAccountGetResponse"
          description: Service-account metadata and non-secret connection details
        "401":
          description: Access token is missing or invalid
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gateway or service account was not found or is not visible
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error occurred
      summary: Get an OpenShell gateway service account
  /api/hypershell/v1/gateways/{gateway_id}/service_accounts/{service_account_id}/revoke:
    post:
      operationId: revokeGatewayServiceAccount
      parameters:
      - description: Selected Gateway ID
        in: path
        name: gateway_id
        required: true
        schema:
          type: string
      - description: OpenShellGatewayServiceAccount ID
        in: path
        name: service_account_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenShellGatewayServiceAccountListItem"
          description: Keycloak client disabled and service account revoked
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenShellGatewayServiceAccountListItem"
          description: Revocation is persisted and disablement is still pending
        "401":
          description: Access token is missing or invalid
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gateway or service account was not found or is not visible
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Keycloak provisioning or lifecycle verification is unavailable
      summary: Permanently revoke an OpenShell gateway service account
  /api/hypershell/v1/roles:
    get:
      operationId: listRoles
      parameters:
      - description: Page number of record list when record list exceeds specified
          page size
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Maximum number of records to return
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 100
          minimum: 0
          type: integer
        style: form
      - description: Specifies the search criteria
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Specifies the order by criteria
        explode: true
        in: query
        name: orderBy
        required: false
        schema:
          type: string
        style: form
      - description: Supplies a comma-separated list of fields to be returned
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
          description: A list of roles
        "401":
          description: Access token is missing or invalid
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error occurred
      summary: List all roles
  /api/hypershell/v1/roles/{id}:
    get:
      operationId: getRole
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
          description: Role found
        "401":
          description: Access token is missing or invalid
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Role not found
        "500":
          content:
