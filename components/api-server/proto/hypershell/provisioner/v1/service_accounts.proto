syntax = "proto3";

package hypershell.provisioner.v1;

option go_package = "github.com/openshift-online/hypershell/components/api-server/pkg/api/grpc/hypershell/provisioner/v1;provisioner_v1";

// OpenShellGatewayServiceAccountProvisionerService is an internal, mutually
// authenticated control-plane service. The Provision response contains a
// client secret and must never be persisted, replayed, or logged.
service OpenShellGatewayServiceAccountProvisionerService {
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);
  rpc Disable(DisableRequest) returns (DisableResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc DeleteManaged(DeleteManagedRequest) returns (DeleteManagedResponse);
  rpc DeleteGateway(DeleteGatewayRequest) returns (DeleteGatewayResponse);
  rpc ListManaged(ListManagedRequest) returns (ListManagedResponse);
}

message ServiceAccountSpec {
  string client_id = 1;
  string display_name = 2;
  string gateway_client_id = 3;
  string gateway_id = 4;
  string service_account_id = 5;
  string creator_user_id = 6;
  string role = 7;
  string expected_issuer = 8;
  int32 access_token_lifetime_seconds = 9;
}

message ProvisionRequest {
  ServiceAccountSpec spec = 1;
}

message ProvisionResponse {
  string client_uuid = 1;
  string client_id = 2;
  string client_secret = 3;
  string subject = 4;
}

message ReconcileRequest {
  ServiceAccountSpec spec = 1;
  string client_uuid = 2;
  string expected_subject = 3;
  bool enabled = 4;
}

message ReconcileResponse {}

message DisableRequest {
  string client_uuid = 1;
  string gateway_id = 2;
  string service_account_id = 3;
}

message DisableResponse {}

message DeleteRequest {
  string client_uuid = 1;
  string gateway_id = 2;
  string service_account_id = 3;
}

message DeleteResponse {}

message DeleteManagedRequest {
  string gateway_id = 1;
  string service_account_id = 2;
}

message DeleteManagedResponse {}

message DeleteGatewayRequest {
  string gateway_id = 1;
}

message DeleteGatewayResponse {}

message ListManagedRequest {
  string gateway_id = 1;
}

message ManagedClient {
  string uuid = 1;
  string client_id = 2;
  string gateway_id = 3;
  string service_account_id = 4;
}

message ListManagedResponse {
  repeated ManagedClient clients = 1;
}
