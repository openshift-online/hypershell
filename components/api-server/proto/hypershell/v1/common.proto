syntax = "proto3";

package hypershell.v1;

option go_package = "github.com/openshift-online/hypershell/components/api-server/pkg/api/grpc/hypershell/v1;hypershell_v1";

import "google/protobuf/timestamp.proto";

message ObjectReference {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string kind = 4;
  string href = 5;
  // W3C Trace Context traceparent of the API request that created or last
  // updated this resource (e.g. "00-{traceID}-{spanID}-{flags}").
  // Empty when OpenTelemetry is disabled or the resource predates tracing.
  optional string traceparent = 6;
  // W3C Trace Context tracestate carrying vendor-specific key-value pairs.
  // Empty when no vendor state was present on the originating request.
  optional string tracestate = 7;
}

message ListMeta {
  int32 page = 1;
  int32 size = 2;
  int32 total = 3;
}

message Error {
  string id = 1;
  string kind = 2;
  string href = 3;
  int32 code = 4;
  string reason = 5;
  string operation_id = 6;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_CREATED = 1;
  EVENT_TYPE_UPDATED = 2;
  EVENT_TYPE_DELETED = 3;
}
