syntax = "proto3";

package hypershell.v1;

option go_package = "github.com/openshift-online/hypershell/components/api-server/pkg/api/grpc/hypershell/v1;hypershell_v1";

import "hypershell/v1/common.proto";
import "hypershell/v1/secret_sources.proto";
import "hypershell/v1/provider_bindings.proto";
import "hypershell/v1/inference_routes.proto";
import "hypershell/v1/workspace_memberships.proto";

message AgentRuntime {
  ObjectReference metadata = 1;
  string name = 2;
  // cluster_id is the AgentRuntime's own scheduling cluster when set. When
  // empty the effective cluster is derived server-side from the referenced
  // gateway's placement (data-model.spec.md, "AgentRuntime as a Top-Level
  // Resource"); watch/list delivery is scoped by that effective cluster.
  string cluster_id = 3;
  string gateway_id = 4;
  string sandbox_template_id = 5;
  optional string repository_id = 6;
  repeated string selector = 7;
  optional string description = 8;
  optional string cron = 9;
  optional string coordinator_image = 10;
  optional string concurrency_policy = 11;
  optional int32 login_refresh_seconds = 12;
  optional string parameters = 13;
  optional string status = 14;
  // secret_sources carries the SecretSources this AgentRuntime owns, embedded in
  // the watch/list payload so the control-plane reconciler can render one
  // ExternalSecret per source (and wire the coordinator CronJob env vars by
  // purpose) without a second round trip. Server-populated; ignored on inbound
  // writes. See data-model.spec.md "AgentRuntime Cluster Resource Provisioning".
  repeated SecretSource secret_sources = 15;
  // status_message carries the human-readable detail behind a status value - in
  // particular, for a Degraded runtime, the failing SecretSource name and the
  // gateway-side error (data-model.spec.md "AgentRuntime Status Lifecycle"). It
  // is control-plane-owned and written only through UpdateAgentRuntimeStatus.
  optional string status_message = 16;
  // The following fields embed the gateway-side provisioning inputs in the
  // AgentRuntime watch/list payload so the control-plane ProviderRealizer can
  // provision the workspace, memberships, providers, and inference route from a
  // single event without a second round trip (data-model.spec.md "AgentRuntime
  // Reconcile Payload Completeness"). All are server-populated and ignored on
  // inbound writes, like secret_sources. They carry only durable-material
  // REFERENCES (secret_source_id), never secret bytes.
  //
  // workspace_name is the resolved AgentWorkspace.name the workspace is
  // provisioned under on the gateway.
  optional string workspace_name = 17;
  // provider_bindings are the runtime's ProviderBindings (with refresh_strategy
  // and material references) realized as OpenShell providers.
  repeated ProviderBinding provider_bindings = 18;
  // workspace_memberships are the workspace's memberships (subject -> role).
  repeated WorkspaceMembership workspace_memberships = 19;
  // inference_route is the workspace's single InferenceRoute (0..1).
  optional InferenceRoute inference_route = 20;
}

message WatchAgentRuntimesRequest {
  // cluster_id, when set, restricts the stream to AgentRuntimes whose effective
  // cluster is that managed cluster. The effective cluster is the AgentRuntime's
  // own cluster_id when set, else the cluster of its referenced gateway. Because
  // the event broker fans every AgentRuntime out to every subscriber, this filter
  // is the security boundary that keeps a spoke's stream scoped to its own
  // cluster; a registered caller must set it to its own cluster id
  // (managed-cluster-registration.spec.md, "Watch Stream Caller Binding").
  optional string cluster_id = 1;
}

message WatchAgentRuntimesResponse {
  EventType type = 1;
  AgentRuntime agent_runtime = 2;
  string resource_id = 3;
}

message ListAgentRuntimesRequest {
  // cluster_id, when set, excludes AgentRuntimes whose effective cluster is not
  // that managed cluster. Same semantics as WatchAgentRuntimesRequest.cluster_id;
  // a registered caller must set it to its own cluster id. Used to seed the watch
  // on (re)connect.
  optional string cluster_id = 1;
  // repository_id, when set, restricts results to AgentRuntimes owned by that
  // Repository (the control-plane import ownership mark). It is the declarative
  // import reconciler's cross-cluster, Repository-scoped read: a call that sets it
  // AND carries the x-hypershell-import-repository-id import binding is exempted
  // from the cluster caller binding so the single import reconciler can enumerate
  // and prune a Repository's AgentRuntimes across clusters. See
  // security/rbac-enforcement.spec.md ("gRPC Authorization", import reads).
  optional string repository_id = 2;
}

message ListAgentRuntimesResponse {
  repeated AgentRuntime items = 1;
}

// UpdateAgentRuntimeStatusRequest is the control-plane status write-back. The
// control plane owns the AgentRuntime status lifecycle (Pending -> Provisioning
// -> Running -> Degraded -> Terminating) and is the only writer of status and
// status_message through this RPC. See data-model.spec.md "AgentRuntime Status
// Lifecycle".
message UpdateAgentRuntimeStatusRequest {
  string id = 1;
  string status = 2;
  optional string status_message = 3;
}

// CreateAgentRuntimeRequest creates an AgentRuntime. repository_id is NOT a
// client field: on a declarative-import write the server sets it from the
// reconciled Repository carried in the x-hypershell-import-repository-id binding
// and ignores any client-supplied value, so ownership cannot be forged
// (data-model.spec.md, rbac-enforcement.spec.md).
message CreateAgentRuntimeRequest {
  string name = 1;
  string gateway_id = 2;
  string sandbox_template_id = 3;
  optional string cluster_id = 4;
  repeated string selector = 5;
  optional string description = 6;
  optional string cron = 7;
  optional string coordinator_image = 8;
  optional string concurrency_policy = 9;
  optional int32 login_refresh_seconds = 10;
  optional string parameters = 11;
}

message CreateAgentRuntimeResponse {
  AgentRuntime agent_runtime = 1;
}

// UpdateAgentRuntimeRequest replaces the mutable spec of an AgentRuntime. The
// import reconciler sends the full desired spec, so selector is applied as a
// replace. status and status_message are control-plane-owned and are written only
// through UpdateAgentRuntimeStatus. repository_id is immutable ownership and is
// never changed here.
message UpdateAgentRuntimeRequest {
  string id = 1;
  optional string name = 2;
  optional string gateway_id = 3;
  optional string sandbox_template_id = 4;
  optional string cluster_id = 5;
  repeated string selector = 6;
  optional string description = 7;
  optional string cron = 8;
  optional string coordinator_image = 9;
  optional string concurrency_policy = 10;
  optional int32 login_refresh_seconds = 11;
  optional string parameters = 12;
}

message UpdateAgentRuntimeResponse {
  AgentRuntime agent_runtime = 1;
}

message DeleteAgentRuntimeRequest {
  string id = 1;
}

message DeleteAgentRuntimeResponse {}

service AgentRuntimeService {
  rpc WatchAgentRuntimes(WatchAgentRuntimesRequest) returns (stream WatchAgentRuntimesResponse);
  rpc ListAgentRuntimes(ListAgentRuntimesRequest) returns (ListAgentRuntimesResponse);
  rpc UpdateAgentRuntimeStatus(UpdateAgentRuntimeStatusRequest) returns (AgentRuntime);
  // Create / Update / Delete are the declarative-import reconciler's bounded write
  // surface for AgentRuntime; authorized only for the control-plane identity with
  // a valid reconciled-Repository binding (rbac-enforcement.spec.md).
  rpc CreateAgentRuntime(CreateAgentRuntimeRequest) returns (CreateAgentRuntimeResponse);
  rpc UpdateAgentRuntime(UpdateAgentRuntimeRequest) returns (UpdateAgentRuntimeResponse);
  rpc DeleteAgentRuntime(DeleteAgentRuntimeRequest) returns (DeleteAgentRuntimeResponse);
}
