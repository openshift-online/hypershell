syntax = "proto3";

package hypershell.v1;

option go_package = "github.com/openshift-online/hypershell/components/api-server/pkg/api/grpc/hypershell/v1;hypershell_v1";

import "hypershell/v1/common.proto";

// SecretSource is a reference to a secret in an external secret backend (Vault,
// AWS Secrets Manager, or a Kubernetes Secret). It is the single SecretSource
// message for the package: the control-plane reconciler renders an ExternalSecret
// from the embedded subset carried in the AgentRuntime watch payload (name,
// purpose, backend, path, key_mappings), and the declarative-import reconciler's
// gRPC write path uses the full message (metadata, agent_runtime_id,
// repository_id) through SecretSourceService. The embedding leaves the metadata
// fields unset; it never carries the raw secret value (data-model.spec.md
// "SecretSource" and "Secret Submission and Storage").
message SecretSource {
  string name = 1;
  // purpose drives the ExternalSecret field mapping and the CronJob env var
  // wiring (gateway-identity, service-account-key, app-private-key, api-key).
  string purpose = 2;
  // backend is one of vault, aws-secrets-manager, kubernetes.
  string backend = 3;
  string path = 4;
  optional string key_mappings = 5;
  // metadata is unset on the AgentRuntime-embedded subset and populated by
  // SecretSourceService for the full CRUD/watch surface.
  ObjectReference metadata = 6;
  string agent_runtime_id = 7;
  // repository_id is the control-plane import ownership mark; read-only, set
  // server-side, never by a client.
  optional string repository_id = 8;
}

message GetSecretSourceRequest {
  string id = 1;
}

message GetSecretSourceResponse {
  SecretSource secret_source = 1;
}

message CreateSecretSourceRequest {
  string name = 1;
  string agent_runtime_id = 2;
  string purpose = 3;
  string backend = 4;
  string path = 5;
  optional string key_mappings = 6;
  optional string repository_id = 7;
}

message CreateSecretSourceResponse {
  SecretSource secret_source = 1;
}

message UpdateSecretSourceRequest {
  string id = 1;
  optional string name = 2;
  optional string purpose = 3;
  optional string backend = 4;
  optional string path = 5;
  optional string key_mappings = 6;
}

message UpdateSecretSourceResponse {
  SecretSource secret_source = 1;
}

message DeleteSecretSourceRequest {
  string id = 1;
}

message DeleteSecretSourceResponse {}

message ListSecretSourcesRequest {
  int32 page = 1;
  int32 size = 2;
}

message ListSecretSourcesResponse {
  repeated SecretSource items = 1;
  ListMeta metadata = 2;
}

message WatchSecretSourcesRequest {}

message WatchSecretSourcesResponse {
  EventType type = 1;
  SecretSource secret_source = 2;
  string resource_id = 3;
}

service SecretSourceService {
  rpc GetSecretSource(GetSecretSourceRequest) returns (GetSecretSourceResponse);
  rpc CreateSecretSource(CreateSecretSourceRequest) returns (CreateSecretSourceResponse);
  rpc UpdateSecretSource(UpdateSecretSourceRequest) returns (UpdateSecretSourceResponse);
  rpc DeleteSecretSource(DeleteSecretSourceRequest) returns (DeleteSecretSourceResponse);
  rpc ListSecretSources(ListSecretSourcesRequest) returns (ListSecretSourcesResponse);
  rpc WatchSecretSources(WatchSecretSourcesRequest) returns (stream WatchSecretSourcesResponse);
}
