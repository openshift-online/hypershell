syntax = "proto3";

package hypershell.v1;

option go_package = "github.com/openshift-online/hypershell/components/api-server/pkg/api/grpc/hypershell/v1;hypershell_v1";

import "hypershell/v1/common.proto";
import "google/protobuf/timestamp.proto";

enum ProvisioningConditionStatus {
  PROVISIONING_CONDITION_STATUS_UNSPECIFIED = 0;
  PROVISIONING_CONDITION_STATUS_PENDING = 1;
  PROVISIONING_CONDITION_STATUS_IN_PROGRESS = 2;
  PROVISIONING_CONDITION_STATUS_COMPLETE = 3;
  PROVISIONING_CONDITION_STATUS_FAILED = 4;
}

message ProvisioningCondition {
  string type = 1;
  ProvisioningConditionStatus condition_status = 2;
  string message = 3;
}

message GatewayPlacementIntent {
  oneof placement {
    CapabilitySelectorPlacement capability_selector = 1;
    LocalKindPlacement local_kind = 2;
  }
}

message CapabilitySelectorPlacement {
  repeated string selector = 1;
  repeated string excluded_selector = 2;
}

message LocalKindPlacement {}

message Gateway {
  ObjectReference metadata = 1;
  string name = 2;
  string cluster_id = 4;
  string namespace = 7;
  optional string external_dns = 8;
  optional string tls_mode = 9;
  optional string service_type = 10;
  optional string status = 11;
  optional string phase = 12;
  optional string image = 13;
  optional string supervisor_image = 19;
  repeated string server_dns_names = 14;
  optional string route_address = 15;
  optional string oidc = 16;
  optional string route = 17;
  optional string credential_driver = 20;
  optional int32 active_sandbox_count = 21;
  optional string console_address = 22;
  repeated ProvisioningCondition provisioning_conditions = 23;
  optional string gateway_version = 24;
  int64 generation = 26;
  optional int64 observed_generation = 27;
  // provisioning_version is the gateway version the gateway's cluster advertises
  // provisioning onto new gateways (that cluster's single-valued gateway-version
  // capability). It is read-only and derived at read time from cluster_id, never
  // stored on the Gateway row. See gateway-version-visibility.spec.md.
  optional string provisioning_version = 28;
  // image_pinned reports whether this gateway pins an explicit image and so need
  // not track its cluster's provisioning version. Read-only, derived from image.
  optional bool image_pinned = 29;
  // repository_id is the control-plane import ownership mark: the Repository that
  // owns this Gateway through the declarative .hypershell import. Null for gateways
  // created directly through the REST API or hsctl apply. Read-only; set server-side
  // from the x-hypershell-import-repository-id binding, never from a client body.
  optional string repository_id = 30;
}

message CreateGatewayRequest {
  string name = 1;
  string cluster_id = 3;
  optional string external_dns = 6;
  optional string tls_mode = 7;
  optional string service_type = 8;
  optional string status = 9;
  optional string phase = 10;
  optional string image = 11;
  optional string supervisor_image = 12;
  repeated string server_dns_names = 13;
  optional string oidc = 14;
  optional string route = 15;
  optional string credential_driver = 17;
  GatewayPlacementIntent placement = 18;
}

message CreateGatewayResponse {
  Gateway gateway = 1;
}

message GetGatewayRequest {
  string id = 1;
}

message GetGatewayResponse {
  Gateway gateway = 1;
}

message UpdateGatewayRequest {
  string id = 1;
  optional string name = 2;
  optional string cluster_id = 4;
  optional string external_dns = 7;
  optional string tls_mode = 8;
  optional string service_type = 9;
  optional string status = 10;
  optional string phase = 11;
  optional string image = 12;
  optional string supervisor_image = 13;
  repeated string server_dns_names = 14;
  optional string route_address = 15;
  optional string oidc = 16;
  optional string route = 17;
  optional string credential_driver = 19;
  // active_sandbox_count is intentionally absent: the count is control-plane
  // owned and written only through AdjustActiveSandboxCount / SetActiveSandboxCount
  // so the whole-row UpdateGateway path can never clobber it. See
  // openshell-gateway-sandbox-count.spec.md.
  optional string console_address = 20;
  repeated ProvisioningCondition provisioning_conditions = 21;
  optional int64 observed_generation = 23;
}

message UpdateGatewayResponse {
  Gateway gateway = 1;
}

// AdjustActiveSandboxCountRequest applies a relative delta to a gateway's
// active_sandbox_count, keyed by the gateway's namespace. Deltas are applied
// atomically at the database and the stored count is floored at zero.
message AdjustActiveSandboxCountRequest {
  string namespace = 1;
  int32 delta = 2;
}

message AdjustActiveSandboxCountResponse {
  // The resulting count after the adjustment. Zero when no live gateway backs
  // the namespace (the adjustment is a no-op in that case).
  int32 active_sandbox_count = 1;
}

// SetActiveSandboxCountRequest sets a gateway's active_sandbox_count to an
// absolute observed value, keyed by the gateway's namespace. Used by the
// periodic self-heal that reconciles the stored count to the watch cache.
message SetActiveSandboxCountRequest {
  string namespace = 1;
  int32 count = 2;
}

message SetActiveSandboxCountResponse {
  int32 active_sandbox_count = 1;
}

// SandboxEvent is the bounded diagnostic event representation reported by a
// managed-cluster control plane. It intentionally excludes arbitrary Kubernetes
// object payloads and credentials.
message SandboxEvent {
  string type = 1;
  string reason = 2;
  string message = 3;
  google.protobuf.Timestamp first_observed_at = 4;
  google.protobuf.Timestamp last_observed_at = 5;
  int32 count = 6;
  string involved_pod_name = 7;
  string involved_pod_uid = 8;
}

// ReportSandboxEventsRequest replaces the complete recent event snapshot for a
// sandbox identified by its live gateway namespace and sandbox name.
message ReportSandboxEventsRequest {
  string namespace = 1;
  string sandbox_name = 2;
  repeated SandboxEvent events = 3;
}

message ReportSandboxEventsResponse {}

// SetGatewayVersionRequest sets the last observed runtime version. The health
// reconciler is the only writer for this field.
message SetGatewayVersionRequest {
  string id = 1;
  string gateway_version = 2;
}

message SetGatewayVersionResponse {
  string gateway_version = 1;
}

message DeleteGatewayRequest {
  string id = 1;
}

message ListGatewaysRequest {
  int32 page = 1;
  int32 size = 2;
  // cluster_id, when set, restricts results to gateways assigned to that
  // managed cluster. A control-plane agent sets it to its own cluster identity
  // so it only ever lists its cluster's gateways (managed-cluster pull model).
  // Unset preserves the prior behaviour of listing every gateway.
  optional string cluster_id = 3;
  // repository_id, when set, restricts results to gateways owned by that Repository
  // (the control-plane import ownership mark). It is the declarative import
  // reconciler's cross-cluster, Repository-scoped read: a call that sets it AND
  // carries the x-hypershell-import-repository-id import binding is exempted from
  // the cluster caller binding so the single import reconciler can enumerate and
  // prune a Repository's gateways across clusters. See
  // security/rbac-enforcement.spec.md ("gRPC Authorization", import reads).
  optional string repository_id = 4;
}

message ListGatewaysResponse {
  repeated Gateway items = 1;
  ListMeta metadata = 2;
}

message DeleteGatewayResponse {}

message WatchGatewaysRequest {
  // cluster_id, when set, restricts the stream to gateways assigned to that
  // managed cluster (see ListGatewaysRequest.cluster_id). Because the event
  // broker fans every gateway out to every subscriber, this filter is the
  // security boundary that keeps a spoke's stream scoped to its own cluster.
  optional string cluster_id = 1;
}

message WatchGatewaysResponse {
  EventType type = 1;
  Gateway gateway = 2;
  string resource_id = 3;
}

service GatewayService {
  rpc GetGateway(GetGatewayRequest) returns (GetGatewayResponse);
  rpc CreateGateway(CreateGatewayRequest) returns (CreateGatewayResponse);
  rpc UpdateGateway(UpdateGatewayRequest) returns (UpdateGatewayResponse);
  rpc DeleteGateway(DeleteGatewayRequest) returns (DeleteGatewayResponse);
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse);
  rpc WatchGateways(WatchGatewaysRequest) returns (stream WatchGatewaysResponse);
  rpc AdjustActiveSandboxCount(AdjustActiveSandboxCountRequest) returns (AdjustActiveSandboxCountResponse);
  rpc SetActiveSandboxCount(SetActiveSandboxCountRequest) returns (SetActiveSandboxCountResponse);
  rpc ReportSandboxEvents(ReportSandboxEventsRequest) returns (ReportSandboxEventsResponse);
  rpc SetGatewayVersion(SetGatewayVersionRequest) returns (SetGatewayVersionResponse);
}
