syntax = "proto3";

package hypershell.v1;

option go_package = "github.com/openshift-online/hypershell/components/api-server/pkg/api/grpc/hypershell/v1;hypershell_v1";

import "hypershell/v1/common.proto";

message ManagedCluster {
  ObjectReference metadata = 1;
  string name = 2;
  string kubeconfig_secret = 6;
  optional string status = 7;
  optional string api_server_url = 8;
  repeated string capabilities = 9;
  optional ManagedClusterHealth health = 10;
}

// ManagedClusterHealth is the spoke-reported on-cluster self-check verdict
// (managed-cluster-self-healthcheck.spec.md, PLAT-HLTH-03), surfaced read-only.
message ManagedClusterHealth {
  string overall = 1;
  optional string observed_at = 2;
  int64 duration_ms = 3;
  repeated ManagedClusterHealthCondition conditions = 4;
}

message ManagedClusterHealthCondition {
  string name = 1;
  string status = 2;
  optional string last_transition_at = 3;
  string message = 4;
}

message CreateManagedClusterRequest {
  string name = 1;
  string kubeconfig_secret = 5;
  optional string status = 6;
  optional string api_server_url = 7;
}

message CreateManagedClusterResponse {
  ManagedCluster managed_cluster = 1;
}

message GetManagedClusterRequest {
  string id = 1;
}

message GetManagedClusterResponse {
  ManagedCluster managed_cluster = 1;
}

message UpdateManagedClusterRequest {
  string id = 1;
  optional string name = 2;
  optional string kubeconfig_secret = 6;
  optional string status = 7;
  optional string api_server_url = 8;
}

message UpdateManagedClusterResponse {
  ManagedCluster managed_cluster = 1;
}

message DeleteManagedClusterRequest {
  string id = 1;
}

message ListManagedClustersRequest {
  int32 page = 1;
  int32 size = 2;
}

message ListManagedClustersResponse {
  repeated ManagedCluster items = 1;
  ListMeta metadata = 2;
}

message DeleteManagedClusterResponse {}

message WatchManagedClustersRequest {}

message WatchManagedClustersResponse {
  EventType type = 1;
  ManagedCluster managed_cluster = 2;
  string resource_id = 3;
}

service ManagedClusterService {
  rpc GetManagedCluster(GetManagedClusterRequest) returns (GetManagedClusterResponse);
  rpc CreateManagedCluster(CreateManagedClusterRequest) returns (CreateManagedClusterResponse);
  rpc UpdateManagedCluster(UpdateManagedClusterRequest) returns (UpdateManagedClusterResponse);
  rpc DeleteManagedCluster(DeleteManagedClusterRequest) returns (DeleteManagedClusterResponse);
  rpc ListManagedClusters(ListManagedClustersRequest) returns (ListManagedClustersResponse);
  rpc WatchManagedClusters(WatchManagedClustersRequest) returns (stream WatchManagedClustersResponse);
}
