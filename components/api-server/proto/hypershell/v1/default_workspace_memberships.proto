syntax = "proto3";

package hypershell.v1;

option go_package = "github.com/openshift-online/hypershell/components/api-server/pkg/api/grpc/hypershell/v1;hypershell_v1";

import "hypershell/v1/common.proto";

// DefaultWorkspaceMembership is internal-only (data-model.spec.md, PLAT-DATA-27):
// it has no public REST route, no hsctl command, and no OpenAPI schema. It is
// written only by the trusted gateway-access (GTW-ACC-16/17) and
// service-account (OSG-SACC-19) automation hooks, and read only by the control
// plane's reconciler (CTRL-CORE-20) and the metrics surfaces that report on it
// (OBS-CRM-14). metadata.href is intentionally empty: there is no REST path to
// link to.
message DefaultWorkspaceMembership {
  ObjectReference metadata = 1;
  string gateway_id = 2;
  string subject = 3;
  string role = 4;
  string source = 5;
  string reconciliation_status = 6;
  optional string last_reconcile_error = 7;
}

message ListDefaultWorkspaceMembershipsRequest {
  // Optional filter to a single gateway.
  optional string gateway_id = 1;
  // cluster_id, when set, excludes memberships whose gateway is not assigned
  // to that managed cluster. Same semantics as
  // WatchDefaultWorkspaceMembershipsRequest.cluster_id; a registered caller
  // must set it to its own cluster id.
  optional string cluster_id = 2;
}

message ListDefaultWorkspaceMembershipsResponse {
  repeated DefaultWorkspaceMembership items = 1;
}

message WatchDefaultWorkspaceMembershipsRequest {
  // cluster_id, when set, restricts the stream to memberships whose gateway is
  // assigned to that managed cluster. Because the event broker fans every
  // membership out to every subscriber, this filter is the security boundary
  // that keeps a spoke's stream scoped to its own cluster; a registered
  // caller must set it to its own cluster id (see WatchGatewaysRequest.cluster_id).
  optional string cluster_id = 1;
}

message WatchDefaultWorkspaceMembershipsResponse {
  EventType type = 1;
  DefaultWorkspaceMembership default_workspace_membership = 2;
  string resource_id = 3;
}

message UpdateDefaultWorkspaceMembershipStatusRequest {
  string id = 1;
  // gateway_id lets the control-plane identity check (grpc_authorization.go)
  // verify ownership without a separate lookup, mirroring UpdateGatewayRequest.
  string gateway_id = 2;
  string reconciliation_status = 3;
  optional string last_reconcile_error = 4;
}

message UpdateDefaultWorkspaceMembershipStatusResponse {
  DefaultWorkspaceMembership item = 1;
}

// DefaultWorkspaceMembershipService exposes only read (List/Watch) and the
// control plane's status write-back. Create and Delete are plain in-process Go
// calls between the gatewayAccess/serviceAccounts plugins and this one (they
// run in the same process), mirroring RoleBindingService, which likewise has
// no gRPC Create/Delete.
service DefaultWorkspaceMembershipService {
  rpc ListDefaultWorkspaceMemberships(ListDefaultWorkspaceMembershipsRequest) returns (ListDefaultWorkspaceMembershipsResponse);
  rpc WatchDefaultWorkspaceMemberships(WatchDefaultWorkspaceMembershipsRequest) returns (stream WatchDefaultWorkspaceMembershipsResponse);
  rpc UpdateDefaultWorkspaceMembershipStatus(UpdateDefaultWorkspaceMembershipStatusRequest) returns (UpdateDefaultWorkspaceMembershipStatusResponse);
}
