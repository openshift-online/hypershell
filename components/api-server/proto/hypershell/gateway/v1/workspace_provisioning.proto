syntax = "proto3";

package hypershell.gateway.v1;

option go_package = "github.com/openshift-online/hypershell/components/api-server/pkg/api/grpc/hypershell/gateway/v1;gateway_v1";

// AgentWorkspaceProvisioning is the gateway-side provisioning contract the control
// plane calls to realize an AgentRuntime's workspace on the OpenShell gateway it is
// placed on (specs/platform/agent-workspace-gateway-api.spec.md). The OpenShell
// gateway is the server and the system of record for provisioned workspace state; the
// control-plane ProviderRealizer is the client. Every operation is idempotent so a
// reconcile that re-runs against unchanged desired state is a no-op, mirroring the
// per-gateway database provisioning channel.
//
// This file defines the control-plane client contract. The gateway-side server is
// OpenShell upstream territory and is tracked separately.
service AgentWorkspaceProvisioning {
  // EnsureWorkspace creates or updates the AgentWorkspace for an agent_runtime_id.
  // Absent: create. Present and owned by the same agent_runtime_id: no-op success.
  // Present under a different owner: ALREADY_EXISTS (surfaced as HTTP 409).
  rpc EnsureWorkspace(EnsureWorkspaceRequest) returns (Workspace);

  // ReconcileMemberships declaratively sets the FULL membership set for the
  // workspace: memberships not present in the request are pruned on the gateway.
  rpc ReconcileMemberships(ReconcileMembershipsRequest) returns (MembershipSet);

  // EnsureProvider creates or updates one OpenShell provider realized from a
  // ProviderBinding, from durable material plus a refresh strategy. OpenShell owns
  // rotation of the usable credential. When refresh_strategy is non-empty and the
  // workspace has no admin membership the gateway returns FAILED_PRECONDITION
  // (surfaced as HTTP 422).
  rpc EnsureProvider(EnsureProviderRequest) returns (Provider);

  // EnsureInferenceRoute creates or updates the single InferenceRoute that binds
  // inference.local to a provider and model alias. At most one route per workspace.
  rpc EnsureInferenceRoute(EnsureInferenceRouteRequest) returns (InferenceRoute);

  // DeleteWorkspace cascade-deletes the workspace and all sub-resources
  // (memberships, providers, inference route). Unconditional and idempotent: an
  // already-absent workspace is a successful no-op.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
}

// Role is a workspace membership role. Provider credential rotation is restricted to
// workspace administrators, so a refresh-bearing provider requires at least one ADMIN
// membership.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_MEMBER = 1;
  ROLE_ADMIN = 2;
}

message Workspace {
  // agent_runtime_id is the owning AgentRuntime. Binding the gateway-side workspace
  // to its owner is what lets idempotency and name-collision detection coexist.
  string agent_runtime_id = 1;
  string workspace_name = 2;
}

message EnsureWorkspaceRequest {
  string agent_runtime_id = 1;
  string workspace_name = 2;
}

// Membership binds an OIDC subject to a role in a workspace. The subject is the UUID
// from the subject claim of the OIDC identity the agent uses to connect to the
// gateway.
message Membership {
  string subject = 1;
  Role role = 2;
}

message ReconcileMembershipsRequest {
  string agent_runtime_id = 1;
  string workspace_name = 2;
  // memberships is the full desired set. Memberships absent here are pruned.
  repeated Membership memberships = 3;
}

message MembershipSet {
  repeated Membership memberships = 1;
}

// RefreshStrategy carries how OpenShell mints and rotates the usable credential. It
// carries durable material only (for example a GitHub App PEM, a Vertex
// service-account key); it NEVER carries a minted, rotatable credential the control
// plane would have to refresh (agent-workspace-gateway-api.spec.md, "No Raw-Secret
// Placement Through This Contract").
message RefreshStrategy {
  // type is one of app-installation-token, google-service-account-jwt, static-token.
  string type = 1;
  // material holds non-secret refresh parameters (for example app_id,
  // installation_id, client_email), serialized as JSON.
  map<string, string> material = 2;
  // secret_material holds durable, secret-valued refresh parameters keyed by the
  // provider field name (for example the GitHub App PEM, the service-account key).
  // These are durable material, never a minted token.
  map<string, bytes> secret_material = 3;
}

message EnsureProviderRequest {
  string agent_runtime_id = 1;
  string workspace_name = 2;
  // provider_name is the ProviderBinding name, unique within the workspace.
  string provider_name = 3;
  // provider_spec is the gateway-agnostic capability definition from the referenced
  // ProviderSpec, serialized as JSON. It carries no backend-specific field names.
  string provider_spec = 4;
  // refresh_strategy drives credential minting and rotation inside OpenShell. When
  // empty the provider is a static provider with no rotation. When non-empty the
  // workspace MUST have an admin membership or the gateway returns FAILED_PRECONDITION.
  RefreshStrategy refresh_strategy = 5;
}

message Provider {
  string provider_name = 1;
}

message EnsureInferenceRouteRequest {
  string agent_runtime_id = 1;
  string workspace_name = 2;
  // provider_name is the provider the route binds inference.local to.
  string provider_name = 3;
  // model_alias is resolved by the gateway to a model identifier on the provider.
  string model_alias = 4;
}

message InferenceRoute {
  string provider_name = 1;
  string model_alias = 2;
}

message DeleteWorkspaceRequest {
  string agent_runtime_id = 1;
  string workspace_name = 2;
}

message DeleteWorkspaceResponse {}
