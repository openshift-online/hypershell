paths:
  /api/hypershell/ext/workspace_memberships:
    get:
      operationId: listWorkspaceMemberships
      summary: Returns a list of workspace memberships
      security:
        - Bearer: []
      responses:
        '200':
          description: A JSON array of workspace membership objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembershipList'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/fields'
    post:
      operationId: createWorkspaceMembership
      summary: Create a new workspace membership
      security:
        - Bearer: []
      requestBody:
        description: WorkspaceMembership data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMembership'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '422':
          description: Workspace requires at least one admin membership for a refresh-bearing provider binding
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
  /api/hypershell/ext/workspace_memberships/{id}:
    get:
      operationId: getWorkspaceMembership
      summary: Get a workspace membership by ID
      security:
        - Bearer: []
      responses:
        '200':
          description: WorkspaceMembership found by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No workspace membership with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    patch:
      operationId: updateWorkspaceMembership
      summary: Update a workspace membership
      security:
        - Bearer: []
      requestBody:
        description: Updated workspace membership data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMembershipPatchRequest'
      responses:
        '200':
          description: WorkspaceMembership updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '422':
          description: Workspace requires at least one admin membership for a refresh-bearing provider binding
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No workspace membership with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    delete:
      operationId: deleteWorkspaceMembership
      summary: Delete a workspace membership
      security:
        - Bearer: []
      responses:
        '204':
          description: WorkspaceMembership deleted successfully
        '422':
          description: Cannot remove the last admin membership from a workspace with a refresh-bearing provider binding
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No workspace membership with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    parameters:
      - $ref: '#/components/parameters/id'
components:
  schemas:
    WorkspaceMembership:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/ObjectReference'
        - type: object
          required:
            - workspace_id
            - subject
            - role
          properties:
            workspace_id:
              type: string
            subject:
              type: string
              description: OIDC subject UUID the agent uses to connect to the gateway.
            role:
              type: string
              description: Membership role, one of admin or member.
    WorkspaceMembershipList:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/List'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WorkspaceMembership'
    WorkspaceMembershipPatchRequest:
      type: object
      properties:
        role:
          type: string
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: Page number of record list when record list exceeds specified page size
      schema:
        type: integer
        default: 1
        minimum: 1
      required: false
    size:
      name: size
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        default: 100
        minimum: 0
      required: false
    search:
      name: search
      in: query
      required: false
      description: Specifies the search criteria
      schema:
        type: string
    orderBy:
      name: orderBy
      in: query
      required: false
      description: Specifies the order by criteria
      schema:
        type: string
    fields:
      name: fields
      in: query
      required: false
      description: Supplies a comma-separated list of fields to be returned
      schema:
        type: string
