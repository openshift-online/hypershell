paths:
  /api/hypershell/ext/ci_providers:
    get:
      operationId: listCIProviders
      summary: Returns a list of CI providers
      security:
        - Bearer: []
      responses:
        '200':
          description: A JSON array of CI provider objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIProviderList'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/fields'
    post:
      operationId: createCIProvider
      summary: Register a new CI OIDC provider
      security:
        - Bearer: []
      requestBody:
        description: CI provider data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CIProvider'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIProvider'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '409':
          description: A CI provider with the same issuer already exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
  /api/hypershell/ext/ci_providers/{id}:
    get:
      operationId: getCIProvider
      summary: Get a CI provider by ID
      security:
        - Bearer: []
      responses:
        '200':
          description: CI provider found by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIProvider'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No CI provider with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    patch:
      operationId: updateCIProvider
      summary: Update a CI provider
      security:
        - Bearer: []
      requestBody:
        description: Updated CI provider data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CIProviderPatchRequest'
      responses:
        '200':
          description: CI provider updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIProvider'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No CI provider with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    delete:
      operationId: deleteCIProvider
      summary: Delete a CI provider
      security:
        - Bearer: []
      responses:
        '204':
          description: CI provider deleted successfully
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No CI provider with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '409':
          description: CI provider is still referenced by one or more CITrusts
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    parameters:
      - $ref: '#/components/parameters/id'
components:
  schemas:
    CIProvider:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/ObjectReference'
        - type: object
          required:
            - forge
            - issuer
            - jwks_url
            - audience
          properties:
            forge:
              type: string
              description: 'The forge family: github, gitlab, or forgejo'
              enum:
                - github
                - gitlab
                - forgejo
            issuer:
              type: string
              description: The OIDC issuer URL whose tokens this provider validates
            jwks_url:
              type: string
              description: The JWKS endpoint used for signature validation
            audience:
              type: string
              description: The platform-pinned audience every federated CI token must carry
            status:
              type: object
              readOnly: true
              properties:
                idp_alias:
                  type: string
                  description: The Keycloak IdP alias the control plane created or adopted
    CIProviderList:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/List'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CIProvider'
    CIProviderPatchRequest:
      type: object
      properties:
        forge:
          type: string
          enum:
            - github
            - gitlab
            - forgejo
        issuer:
          type: string
        jwks_url:
          type: string
        audience:
          type: string
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: Page number of record list when record list exceeds specified page size
      schema:
        type: integer
        default: 1
        minimum: 1
      required: false
    size:
      name: size
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        default: 100
        minimum: 0
      required: false
    search:
      name: search
      in: query
      required: false
      description: Specifies the search criteria
      schema:
        type: string
    orderBy:
      name: orderBy
      in: query
      required: false
      description: Specifies the order by criteria
      schema:
        type: string
    fields:
      name: fields
      in: query
      required: false
      description: Supplies a comma-separated list of fields to be returned
      schema:
        type: string
