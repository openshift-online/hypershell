paths:
  # NEW ENDPOINT START
  /api/hypershell/v1/gateways:
  # NEW ENDPOINT END
    get:
      operationId: listGateways
      summary: Returns a list of gateways
      security:
        - Bearer: []
      responses:
        '200':
          description: A JSON array of gateway objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayList'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/fields'
    post:
      operationId: createGateway
      summary: Create a new gateway
      security:
        - Bearer: []
      requestBody:
        description: Gateway data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
        '400':
          description: Validation errors occurred
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '409':
          description: Gateway already exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: An unexpected error occurred creating the gateway
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
  # NEW ENDPOINT START
  /api/hypershell/v1/gateways/{id}:
  # NEW ENDPOINT END
    get:
      operationId: getGateway
      summary: Get an gateway by id
      security:
        - Bearer: []
      responses:
        '200':
          description: Gateway found by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '404':
          description: No gateway with specified id exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
    patch:
      operationId: updateGateway
      summary: Update an gateway
      security:
        - Bearer: []
      requestBody:
        description: Updated gateway data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayPatchRequest'
      responses:
        '200':
          description: Gateway updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
        '400':
          description: Validation errors occurred
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '404':
          description: No gateway with specified id exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '409':
          description: Gateway already exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: Unexpected error updating gateway
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
    delete:
      operationId: deleteGateway
      summary: Delete a gateway
      security:
        - Bearer: []
      responses:
        '204':
          description: Gateway deleted successfully
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '404':
          description: No gateway with specified id exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: Unexpected error deleting gateway
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
    parameters:
      - $ref: '#/components/parameters/id'
components:
  schemas:
    # NEW SCHEMA START
    Gateway:
    # NEW SCHEMA END
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/ObjectReference'
        - type: object
          required:
            - name
            - fleet_id
            - cluster_id
            - release_id
            - database_id
            - namespace
          properties:
            name:
              type: string
            fleet_id:
              type: string
            cluster_id:
              type: string
            release_id:
              type: string
            database_id:
              type: string
            namespace:
              type: string
              readOnly: true
              description: API-assigned Kubernetes namespace derived from the Gateway identifier
            external_dns:
              type: string
            tls_mode:
              type: string
            service_type:
              type: string
            status:
              type: string
            phase:
              type: string
            image:
              type: string
              description: Container image for the gateway deployment
            supervisor_image:
              type: string
              description: Container image for the supervisor sidecar
            server_dns_names:
              type: array
              items:
                type: string
              description: DNS names for TLS certificate SANs
            route_address:
              type: string
              readOnly: true
              description: External route address populated by the control plane
            console_address:
              type: string
              readOnly: true
              description: Web console address populated by the control plane
            oidc:
              type: string
              readOnly: true
              description: JSON-encoded OIDC authentication configuration (auto-populated by Keycloak provisioning)
            route:
              type: string
              description: JSON-encoded route configuration
            database_config:
              type: string
              description: JSON-encoded database provisioning configuration
            credential_driver:
              type: string
              description: JSON-encoded credential storage driver configuration
            active_sandbox_count:
              type: integer
              format: int32
              readOnly: true
              description: Number of active (Running or Pending) agent sandboxes observed in the gateway namespace by the control plane
    GatewayCreateRequest:
      type: object
      required:
        - name
        - fleet_id
        - cluster_id
        - release_id
        - database_id
      properties:
        name:
          type: string
        fleet_id:
          type: string
        cluster_id:
          type: string
        release_id:
          type: string
        database_id:
          type: string
        external_dns:
          type: string
        tls_mode:
          type: string
        service_type:
          type: string
        status:
          type: string
        phase:
          type: string
        image:
          type: string
          description: Container image for the gateway deployment
        supervisor_image:
          type: string
          description: Container image for the supervisor sidecar
        server_dns_names:
          type: array
          items:
            type: string
          description: DNS names for TLS certificate SANs
        oidc:
          type: string
          description: JSON-encoded OIDC authentication configuration
        route:
          type: string
          description: JSON-encoded route configuration
        database_config:
          type: string
          description: JSON-encoded database provisioning configuration
        credential_driver:
          type: string
          description: JSON-encoded credential storage driver configuration
    # NEW SCHEMA START
    GatewayList:
    # NEW SCHEMA END
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/List'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Gateway'
    # NEW SCHEMA START
    GatewayPatchRequest:
    # NEW SCHEMA END
      type: object
      properties:
        name:
          type: string
        fleet_id:
          type: string
        cluster_id:
          type: string
        release_id:
          type: string
        database_id:
          type: string
        external_dns:
          type: string
        tls_mode:
          type: string
        service_type:
          type: string
        status:
          type: string
        phase:
          type: string
        image:
          type: string
        supervisor_image:
          type: string
        server_dns_names:
          type: array
          items:
            type: string
        route_address:
          type: string
        oidc:
          type: string
        route:
          type: string
        database_config:
          type: string
        credential_driver:
          type: string
  parameters:
      id:
        name: id
        in: path
        description: The id of record
        required: true
        schema:
          type: string
      page:
        name: page
        in: query
        description: Page number of record list when record list exceeds specified page size
        schema:
          type: integer
          default: 1
          minimum: 1
        required: false
      size:
        name: size
        in: query
        description: Maximum number of records to return
        schema:
          type: integer
          default: 100
          minimum: 0
        required: false
      search:
        name: search
        in: query
        required: false
        description: |-
          Specifies the search criteria. The syntax of this parameter is
          similar to the syntax of the _where_ clause of an SQL statement,
          using the names of the json attributes / column names of the account.
          For example, in order to retrieve all the accounts with a username
          starting with `my`:

          ```sql
          username like 'my%'
          ```

          The search criteria can also be applied on related resource.
          For example, in order to retrieve all the subscriptions labeled by `foo=bar`,

          ```sql
          subscription_labels.key = 'foo' and subscription_labels.value = 'bar'
          ```

          If the parameter isn't provided, or if the value is empty, then
          all the accounts that the user has permission to see will be
          returned.
        schema:
          type: string
      orderBy:
        name: orderBy
        in: query
        required: false
        description: |-
          Specifies the order by criteria. The syntax of this parameter is
          similar to the syntax of the _order by_ clause of an SQL statement,
          but using the names of the json attributes / column of the account.
          For example, in order to retrieve all accounts ordered by username:

          ```sql
          username asc
          ```

          Or in order to retrieve all accounts ordered by username _and_ first name:

          ```sql
          username asc, firstName asc
          ```

          If the parameter isn't provided, or if the value is empty, then
          no explicit ordering will be applied.
        schema:
          type: string
      fields:
        name: fields
        in: query
        required: false
        description: |-
          Supplies a comma-separated list of fields to be returned.
          Fields of sub-structures and of arrays use <structure>.<field> notation.
          <stucture>.* means all field of a structure
          Example: For each Subscription to get id, href, plan(id and kind) and labels (all fields)

          ```
          curl '/api/v1/subscriptions?fields=id,href,plan.id,plan.kind,labels.*&fetchLabels=true'
          ```
        schema:
          type: string
