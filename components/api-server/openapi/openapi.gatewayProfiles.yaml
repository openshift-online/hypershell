paths:
  # NEW ENDPOINT START
  /api/hypershell/v1/gateway_profiles:
  # NEW ENDPOINT END
    get:
      operationId: listGatewayProfiles
      summary: Returns a list of gatewayProfiles
      security:
        - Bearer: []
      responses:
        '200':
          description: A JSON array of gatewayProfile objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayProfileList'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/fields'
    post:
      operationId: createGatewayProfile
      summary: Create a new gatewayProfile
      security:
        - Bearer: []
      requestBody:
        description: GatewayProfile data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayProfile'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayProfile'
        '400':
          description: Validation errors occurred
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '409':
          description: GatewayProfile already exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: An unexpected error occurred creating the gatewayProfile
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
  # NEW ENDPOINT START
  /api/hypershell/v1/gateway_profiles/{id}:
  # NEW ENDPOINT END
    get:
      operationId: getGatewayProfile
      summary: Get a gatewayProfile by id
      security:
        - Bearer: []
      responses:
        '200':
          description: GatewayProfile found by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayProfile'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '404':
          description: No gatewayProfile with specified id exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
    patch:
      operationId: updateGatewayProfile
      summary: Update a gatewayProfile
      security:
        - Bearer: []
      requestBody:
        description: Updated gatewayProfile data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayProfilePatchRequest'
      responses:
        '200':
          description: GatewayProfile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayProfile'
        '400':
          description: Validation errors occurred
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '404':
          description: No gatewayProfile with specified id exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: Unexpected error updating gatewayProfile
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
    delete:
      operationId: deleteGatewayProfile
      summary: Delete a gateway profile
      security:
        - Bearer: []
      responses:
        '204':
          description: Gateway profile deleted successfully
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '404':
          description: No gateway profile with specified id exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '409':
          description: GatewayProfile is referenced by a cluster or gateway and cannot be deleted
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          description: Unexpected error deleting gateway profile
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
    parameters:
      - $ref: '#/components/parameters/id'
components:
  schemas:
    # NEW SCHEMA START
    GatewayProfile:
    # NEW SCHEMA END
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/ObjectReference'
        - type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
              description: Profile purpose/intent
            cpu_request_total:
              type: string
              description: Total CPU requests allowed (e.g., "4", "500m")
            cpu_limit_total:
              type: string
              description: Total CPU limits allowed
            memory_request_total:
              type: string
              description: Total memory requests allowed (e.g., "8Gi", "512Mi")
            memory_limit_total:
              type: string
              description: Total memory limits allowed
            ephemeral_storage_total:
              type: string
              description: Total ephemeral storage allowed (e.g., "10Gi")
            pod_count:
              type: integer
              format: int32
              description: Maximum number of pods (0 means not set)
            pvc_count:
              type: integer
              format: int32
              description: Maximum number of PersistentVolumeClaims (0 means not set)
            container_cpu_request_default:
              type: string
              description: Default CPU request injected into containers without explicit request
            container_cpu_limit_max:
              type: string
              description: Maximum CPU limit a container can request
            container_memory_request_default:
              type: string
              description: Default memory request injected into containers
            container_memory_limit_max:
              type: string
              description: Maximum memory limit a container can request
    # NEW SCHEMA START
    GatewayProfileList:
    # NEW SCHEMA END
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/List'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GatewayProfile'
    # NEW SCHEMA START
    GatewayProfilePatchRequest:
    # NEW SCHEMA END
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        cpu_request_total:
          type: string
        cpu_limit_total:
          type: string
        memory_request_total:
          type: string
        memory_limit_total:
          type: string
        ephemeral_storage_total:
          type: string
        pod_count:
          type: integer
          format: int32
        pvc_count:
          type: integer
          format: int32
        container_cpu_request_default:
          type: string
        container_cpu_limit_max:
          type: string
        container_memory_request_default:
          type: string
        container_memory_limit_max:
          type: string
  parameters:
      id:
        name: id
        in: path
        description: The id of record
        required: true
        schema:
          type: string
      page:
        name: page
        in: query
        description: Page number of record list when record list exceeds specified page size
        schema:
          type: integer
          default: 1
          minimum: 1
        required: false
      size:
        name: size
        in: query
        description: Maximum number of records to return
        schema:
          type: integer
          default: 100
          minimum: 0
        required: false
      search:
        name: search
        in: query
        required: false
        description: Specifies the search criteria
        schema:
          type: string
      orderBy:
        name: orderBy
        in: query
        required: false
        description: Specifies the order by criteria
        schema:
          type: string
      fields:
        name: fields
        in: query
        required: false
        description: Supplies a comma-separated list of fields to be returned
        schema:
          type: string
