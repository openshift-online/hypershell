paths:
  /api/hypershell/v1/gateways/{gateway_id}/service_accounts:
    parameters:
      - $ref: '#/components/parameters/gatewayId'
    get:
      operationId: listGatewayServiceAccounts
      summary: List OpenShell gateway service accounts
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: Visible service accounts and caller capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenShellGatewayServiceAccountList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    post:
      operationId: createGatewayServiceAccount
      summary: Create an OpenShell gateway service account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShellGatewayServiceAccountCreateRequest'
      responses:
        '201':
          description: Service account created; the credential is returned once
          headers:
            Cache-Control:
              description: Prevent storage of the one-time credential response
              schema:
                type: string
                example: no-store
            Pragma:
              description: Prevent legacy caches from storing the response
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenShellGatewayServiceAccountCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/hypershell/v1/gateways/{gateway_id}/service_accounts/{service_account_id}:
    parameters:
      - $ref: '#/components/parameters/gatewayId'
      - $ref: '#/components/parameters/serviceAccountId'
    get:
      operationId: getGatewayServiceAccount
      summary: Get an OpenShell gateway service account
      responses:
        '200':
          description: Service-account metadata and non-secret connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenShellGatewayServiceAccountGetResponse'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    delete:
      operationId: deleteGatewayServiceAccount
      summary: Delete an OpenShell gateway service account
      responses:
        '202':
          description: Deletion is persisted and cleanup is still pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenShellGatewayServiceAccountListItem'
        '204':
          description: Keycloak identity removed and resource soft-deleted
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/hypershell/v1/gateways/{gateway_id}/service_accounts/{service_account_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/gatewayId'
      - $ref: '#/components/parameters/serviceAccountId'
    post:
      operationId: revokeGatewayServiceAccount
      summary: Permanently revoke an OpenShell gateway service account
      responses:
        '200':
          description: Keycloak client disabled and service account revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenShellGatewayServiceAccountListItem'
        '202':
          description: Revocation is persisted and disablement is still pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenShellGatewayServiceAccountListItem'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

components:
  parameters:
    gatewayId:
      name: gateway_id
      in: path
      required: true
      description: Selected Gateway ID
      schema:
        type: string
    serviceAccountId:
      name: service_account_id
      in: path
      required: true
      description: OpenShellGatewayServiceAccount ID
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    status:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OpenShellGatewayServiceAccountStatus'
    search:
      name: search
      in: query
      required: false
      description: Case-insensitive literal match against name, client ID, or subject
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [name, role, status, expires_at, created_at]
        default: created_at
    order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    BadRequestError:
      description: Invalid request or query value
      content:
        application/json:
          schema:
            $ref: 'openapi.yaml#/components/schemas/Error'
    NotFoundError:
      description: Gateway or service account was not found or is not visible
      content:
        application/json:
          schema:
            $ref: 'openapi.yaml#/components/schemas/Error'
    ConflictError:
      description: Gateway is not ready or the active name already exists
      content:
        application/json:
          schema:
            $ref: 'openapi.yaml#/components/schemas/Error'
    TooManyRequestsError:
      description: A service-account quota is exhausted
      content:
        application/json:
          schema:
            $ref: 'openapi.yaml#/components/schemas/Error'
    ServiceUnavailableError:
      description: Keycloak provisioning or lifecycle verification is unavailable
      content:
        application/json:
          schema:
            $ref: 'openapi.yaml#/components/schemas/Error'

  schemas:
    OpenShellGatewayServiceAccountRole:
      type: string
      enum: [openshell-user, openshell-admin]
    OpenShellGatewayServiceAccountStatus:
      type: string
      enum: [provisioning, ready, expired, revoking, revoked, deleting, error]
    OpenShellGatewayServiceAccountCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
          nullable: true
        credential_type:
          type: string
          enum: [client_secret]
          default: client_secret
        role:
          $ref: '#/components/schemas/OpenShellGatewayServiceAccountRole'
        expires_at:
          type: string
          format: date-time
    OpenShellGatewayServiceAccountListItem:
      type: object
      required:
        - id
        - gateway_id
        - name
        - credential_type
        - role
        - status
        - created_by_user_id
        - client_id
        - subject
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
        gateway_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        credential_type:
          type: string
          enum: [client_secret]
        role:
          $ref: '#/components/schemas/OpenShellGatewayServiceAccountRole'
        status:
          $ref: '#/components/schemas/OpenShellGatewayServiceAccountStatus'
        created_by_user_id:
          type: string
        client_id:
          type: string
        subject:
          type: string
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OpenShellGatewayServiceAccountConnection:
      type: object
      required:
        - gateway_name
        - issuer
        - token_endpoint
        - grant_type
        - client_id
        - audience
        - access_token_lifetime_seconds
      properties:
        gateway_name:
          type: string
        gateway_endpoint:
          type: string
          format: uri
        issuer:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
        audience:
          type: string
        access_token_lifetime_seconds:
          type: integer
          minimum: 1
          maximum: 900
    OpenShellGatewayServiceAccountCredential:
      type: object
      required:
        - gateway_name
        - issuer
        - token_endpoint
        - grant_type
        - client_id
        - client_secret
        - audience
        - access_token_lifetime_seconds
      properties:
        gateway_name:
          type: string
        gateway_endpoint:
          type: string
          format: uri
        issuer:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
        client_secret:
          type: string
          format: password
          readOnly: true
          x-sensitive: true
        audience:
          type: string
        access_token_lifetime_seconds:
          type: integer
          minimum: 1
          maximum: 900
    OpenShellGatewayServiceAccountGetResponse:
      allOf:
        - $ref: '#/components/schemas/OpenShellGatewayServiceAccountListItem'
        - type: object
          required: [connection]
          properties:
            connection:
              $ref: '#/components/schemas/OpenShellGatewayServiceAccountConnection'
    OpenShellGatewayServiceAccountCreateResponse:
      allOf:
        - $ref: '#/components/schemas/OpenShellGatewayServiceAccountListItem'
        - type: object
          required: [credential]
          properties:
            credential:
              $ref: '#/components/schemas/OpenShellGatewayServiceAccountCredential'
    OpenShellGatewayServiceAccountExpirationPolicy:
      type: object
      required: [default_seconds, minimum_seconds, maximum_seconds]
      properties:
        default_seconds:
          type: integer
          minimum: 3600
        minimum_seconds:
          type: integer
          minimum: 3600
        maximum_seconds:
          type: integer
          minimum: 3600
          maximum: 31536000
    OpenShellGatewayServiceAccountCapabilities:
      type: object
      required: [can_create, allowed_roles, can_manage_all, expiration_policy]
      properties:
        can_create:
          type: boolean
        allowed_roles:
          type: array
          items:
            $ref: '#/components/schemas/OpenShellGatewayServiceAccountRole'
        can_manage_all:
          type: boolean
        expiration_policy:
          $ref: '#/components/schemas/OpenShellGatewayServiceAccountExpirationPolicy'
    OpenShellGatewayServiceAccountList:
      type: object
      required: [page, size, total, capabilities, items]
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        capabilities:
          $ref: '#/components/schemas/OpenShellGatewayServiceAccountCapabilities'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpenShellGatewayServiceAccountListItem'
