openapi: 3.0.3
info:
  title: HyperShell API
  description: HyperShell gateway management API
  version: "1.0.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8000
    description: localhost
  - url: /
    description: current domain
tags:
  - name: default
    description: Default API operations
paths:
  /api/hypershell/v1/metadata:
    get:
      summary: Service metadata
      operationId: getMetadata
      responses:
        '200':
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectReference'
  /api/hypershell/v1/managed_clusters:
    $ref: 'openapi.managedClusters.yaml#/paths/~1api~1hypershell~1v1~1managed_clusters'
  /api/hypershell/v1/managed_clusters/registration:
    $ref: 'openapi.managedClusters.yaml#/paths/~1api~1hypershell~1v1~1managed_clusters~1registration'
  /api/hypershell/v1/managed_clusters/{id}:
    $ref: 'openapi.managedClusters.yaml#/paths/~1api~1hypershell~1v1~1managed_clusters~1{id}'
  /api/hypershell/v1/gateways:
    $ref: 'openapi.gateways.yaml#/paths/~1api~1hypershell~1v1~1gateways'
  /api/hypershell/v1/gateways/placement-availability:
    $ref: 'openapi.gateways.yaml#/paths/~1api~1hypershell~1v1~1gateways~1placement-availability'
  /api/hypershell/v1/gateways/{id}:
    $ref: 'openapi.gateways.yaml#/paths/~1api~1hypershell~1v1~1gateways~1{id}'
  /api/hypershell/v1/gateways/{gateway_id}/service_accounts:
    $ref: 'openapi.serviceAccounts.yaml#/paths/~1api~1hypershell~1v1~1gateways~1{gateway_id}~1service_accounts'
  /api/hypershell/v1/gateways/{gateway_id}/service_accounts/{service_account_id}:
    $ref: 'openapi.serviceAccounts.yaml#/paths/~1api~1hypershell~1v1~1gateways~1{gateway_id}~1service_accounts~1{service_account_id}'
  /api/hypershell/v1/gateways/{gateway_id}/service_accounts/{service_account_id}/revoke:
    $ref: 'openapi.serviceAccounts.yaml#/paths/~1api~1hypershell~1v1~1gateways~1{gateway_id}~1service_accounts~1{service_account_id}~1revoke'
  /api/hypershell/v1/roles:
    $ref: 'openapi.roles.yaml#/paths/~1api~1hypershell~1v1~1roles'
  /api/hypershell/v1/roles/{id}:
    $ref: 'openapi.roles.yaml#/paths/~1api~1hypershell~1v1~1roles~1{id}'
  /api/hypershell/v1/role_bindings:
    $ref: 'openapi.roleBindings.yaml#/paths/~1api~1hypershell~1v1~1role_bindings'
  /api/hypershell/v1/role_bindings/{id}:
    $ref: 'openapi.roleBindings.yaml#/paths/~1api~1hypershell~1v1~1role_bindings~1{id}'
  /api/hypershell/v1/users:
    $ref: 'openapi.users.yaml#/paths/~1api~1hypershell~1v1~1users'
  /api/hypershell/v1/users/{id}:
    $ref: 'openapi.users.yaml#/paths/~1api~1hypershell~1v1~1users~1{id}'
  /api/hypershell/ext/agent_runtimes:
    $ref: 'openapi.agentRuntimes.yaml#/paths/~1api~1hypershell~1ext~1agent_runtimes'
  /api/hypershell/ext/agent_runtimes/{id}:
    $ref: 'openapi.agentRuntimes.yaml#/paths/~1api~1hypershell~1ext~1agent_runtimes~1{id}'
  /api/hypershell/ext/sandbox_templates:
    $ref: 'openapi.sandboxTemplates.yaml#/paths/~1api~1hypershell~1ext~1sandbox_templates'
  /api/hypershell/ext/sandbox_templates/{id}:
    $ref: 'openapi.sandboxTemplates.yaml#/paths/~1api~1hypershell~1ext~1sandbox_templates~1{id}'
  /api/hypershell/ext/provider_specs:
    $ref: 'openapi.providerSpecs.yaml#/paths/~1api~1hypershell~1ext~1provider_specs'
  /api/hypershell/ext/provider_specs/{id}:
    $ref: 'openapi.providerSpecs.yaml#/paths/~1api~1hypershell~1ext~1provider_specs~1{id}'
  /api/hypershell/ext/provider_bindings:
    $ref: 'openapi.providerBindings.yaml#/paths/~1api~1hypershell~1ext~1provider_bindings'
  /api/hypershell/ext/provider_bindings/{id}:
    $ref: 'openapi.providerBindings.yaml#/paths/~1api~1hypershell~1ext~1provider_bindings~1{id}'
  /api/hypershell/ext/inference_routes:
    $ref: 'openapi.inferenceRoutes.yaml#/paths/~1api~1hypershell~1ext~1inference_routes'
  /api/hypershell/ext/inference_routes/{id}:
    $ref: 'openapi.inferenceRoutes.yaml#/paths/~1api~1hypershell~1ext~1inference_routes~1{id}'
  /api/hypershell/ext/secret_sources:
    $ref: 'openapi.secretSources.yaml#/paths/~1api~1hypershell~1ext~1secret_sources'
  /api/hypershell/ext/secret_sources/{id}:
    $ref: 'openapi.secretSources.yaml#/paths/~1api~1hypershell~1ext~1secret_sources~1{id}'
  # AUTO-ADD NEW PATHS
components:
  schemas:
    List:
      allOf:
        - type: object
          properties:
            kind:
              type: string
            page:
              type: integer
            size:
              type: integer
            total:
              type: integer
        - $ref: '#/components/schemas/ObjectReference'
    ObjectReference:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        href:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      allOf:
        - $ref: '#/components/schemas/ObjectReference'
        - type: object
          properties:
            code:
              type: string
            reason:
              type: string
            operation_id:
              type: string
    ManagedCluster:
      $ref: 'openapi.managedClusters.yaml#/components/schemas/ManagedCluster'
    ManagedClusterList:
      $ref: 'openapi.managedClusters.yaml#/components/schemas/ManagedClusterList'
    ManagedClusterPatchRequest:
      $ref: 'openapi.managedClusters.yaml#/components/schemas/ManagedClusterPatchRequest'
    ManagedClusterRegistrationRequest:
      $ref: 'openapi.managedClusters.yaml#/components/schemas/ManagedClusterRegistrationRequest'
    ManagedClusterRegistrationResponse:
      $ref: 'openapi.managedClusters.yaml#/components/schemas/ManagedClusterRegistrationResponse'
    Gateway:
      $ref: 'openapi.gateways.yaml#/components/schemas/Gateway'
    GatewayList:
      $ref: 'openapi.gateways.yaml#/components/schemas/GatewayList'
    GatewayPatchRequest:
      $ref: 'openapi.gateways.yaml#/components/schemas/GatewayPatchRequest'
    GatewayPlacementIntent:
      $ref: 'openapi.gateways.yaml#/components/schemas/GatewayPlacementIntent'
    GatewayPlacementAvailability:
      $ref: 'openapi.gateways.yaml#/components/schemas/GatewayPlacementAvailability'
    OpenShellGatewayServiceAccountRole:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountRole'
    OpenShellGatewayServiceAccountStatus:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountStatus'
    OpenShellGatewayServiceAccountCreateRequest:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountCreateRequest'
    OpenShellGatewayServiceAccountListItem:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountListItem'
    OpenShellGatewayServiceAccountConnection:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountConnection'
    OpenShellGatewayServiceAccountCredential:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountCredential'
    OpenShellGatewayServiceAccountGetResponse:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountGetResponse'
    OpenShellGatewayServiceAccountCreateResponse:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountCreateResponse'
    OpenShellGatewayServiceAccountExpirationPolicy:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountExpirationPolicy'
    OpenShellGatewayServiceAccountCapabilities:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountCapabilities'
    OpenShellGatewayServiceAccountList:
      $ref: 'openapi.serviceAccounts.yaml#/components/schemas/OpenShellGatewayServiceAccountList'
    Role:
      $ref: 'openapi.roles.yaml#/components/schemas/Role'
    RoleList:
      $ref: 'openapi.roles.yaml#/components/schemas/RoleList'
    RoleBinding:
      $ref: 'openapi.roleBindings.yaml#/components/schemas/RoleBinding'
    RoleBindingList:
      $ref: 'openapi.roleBindings.yaml#/components/schemas/RoleBindingList'
    User:
      $ref: 'openapi.users.yaml#/components/schemas/User'
    UserList:
      $ref: 'openapi.users.yaml#/components/schemas/UserList'
    AgentRuntime:
      $ref: 'openapi.agentRuntimes.yaml#/components/schemas/AgentRuntime'
    AgentRuntimeList:
      $ref: 'openapi.agentRuntimes.yaml#/components/schemas/AgentRuntimeList'
    AgentRuntimePatchRequest:
      $ref: 'openapi.agentRuntimes.yaml#/components/schemas/AgentRuntimePatchRequest'
    SandboxTemplate:
      $ref: 'openapi.sandboxTemplates.yaml#/components/schemas/SandboxTemplate'
    SandboxTemplateList:
      $ref: 'openapi.sandboxTemplates.yaml#/components/schemas/SandboxTemplateList'
    SandboxTemplatePatchRequest:
      $ref: 'openapi.sandboxTemplates.yaml#/components/schemas/SandboxTemplatePatchRequest'
    ProviderSpec:
      $ref: 'openapi.providerSpecs.yaml#/components/schemas/ProviderSpec'
    ProviderSpecList:
      $ref: 'openapi.providerSpecs.yaml#/components/schemas/ProviderSpecList'
    ProviderSpecPatchRequest:
      $ref: 'openapi.providerSpecs.yaml#/components/schemas/ProviderSpecPatchRequest'
    ProviderBinding:
      $ref: 'openapi.providerBindings.yaml#/components/schemas/ProviderBinding'
    ProviderBindingList:
      $ref: 'openapi.providerBindings.yaml#/components/schemas/ProviderBindingList'
    ProviderBindingPatchRequest:
      $ref: 'openapi.providerBindings.yaml#/components/schemas/ProviderBindingPatchRequest'
    InferenceRoute:
      $ref: 'openapi.inferenceRoutes.yaml#/components/schemas/InferenceRoute'
    InferenceRouteList:
      $ref: 'openapi.inferenceRoutes.yaml#/components/schemas/InferenceRouteList'
    SecretSource:
      $ref: 'openapi.secretSources.yaml#/components/schemas/SecretSource'
    SecretSourceList:
      $ref: 'openapi.secretSources.yaml#/components/schemas/SecretSourceList'
    SecretSourcePatchRequest:
      $ref: 'openapi.secretSources.yaml#/components/schemas/SecretSourcePatchRequest'
    # AUTO-ADD NEW SCHEMAS
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: Page number of record list when record list exceeds specified page size
      schema:
        type: integer
        default: 1
        minimum: 1
      required: false
    size:
      name: size
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        default: 100
        minimum: 0
      required: false
    search:
      name: search
      in: query
      required: false
      description: Specifies the search criteria
      schema:
        type: string
    orderBy:
      name: orderBy
      in: query
      required: false
      description: Specifies the order by criteria
      schema:
        type: string
    fields:
      name: fields
      in: query
      required: false
      description: Supplies a comma-separated list of fields to be returned
      schema:
        type: string
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    ForbiddenError:
      description: Access token does not have sufficient privileges
    InternalServerError:
      description: Unexpected error occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - Bearer: []
