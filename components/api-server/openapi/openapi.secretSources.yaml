paths:
  /api/hypershell/ext/secret_sources:
    get:
      operationId: listSecretSources
      summary: Returns a list of secret sources
      security:
        - Bearer: []
      responses:
        '200':
          description: A JSON array of secret source objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSourceList'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/fields'
    post:
      operationId: createSecretSource
      summary: Create a new secret source
      security:
        - Bearer: []
      requestBody:
        description: SecretSource data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretSource'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
  /api/hypershell/ext/secret_sources/{id}:
    get:
      operationId: getSecretSource
      summary: Get a secret source by ID
      security:
        - Bearer: []
      responses:
        '200':
          description: SecretSource found by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSource'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No secret source with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    patch:
      operationId: updateSecretSource
      summary: Update a secret source
      security:
        - Bearer: []
      requestBody:
        description: Updated secret source data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretSourcePatchRequest'
      responses:
        '200':
          description: SecretSource updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No secret source with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    delete:
      operationId: deleteSecretSource
      summary: Delete a secret source
      security:
        - Bearer: []
      responses:
        '204':
          description: SecretSource deleted successfully
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No secret source with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    parameters:
      - $ref: '#/components/parameters/id'
  /api/hypershell/ext/secret_sources/{id}/material:
    post:
      operationId: uploadSecretSourceMaterial
      summary: Upload the durable material for an existing secret source
      description: >-
        Write-only material-upload operation on an existing SecretSource. The
        request body carries ONLY the material. The API server writes it through
        its write-only secret store to the SecretSource's server-derived
        convention path (hypershell/secret-sources/{agent_runtime_id}/{name}) and
        records only the reference; it does not change the stored path. The upload
        is idempotent (a re-upload overwrites the same entry). The material is
        never persisted raw in the database and never echoed in the response; the
        response is marked no-store.
      security:
        - Bearer: []
      requestBody:
        description: The durable material to store for the secret source
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretSourceMaterialUploadRequest'
      responses:
        '200':
          description: Material stored. The response identifies the secret source and never echoes the material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSource'
        '400':
          description: Validation error (missing material)
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No secret source with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    parameters:
      - $ref: '#/components/parameters/id'
components:
  schemas:
    SecretSourceMaterialUploadRequest:
      type: object
      required:
        - value
      description: >-
        Body of the write-only material-upload operation. It carries ONLY the
        material; it has no path or other reference field, so an upload can never
        re-point a secret source at another store location.
      properties:
        value:
          type: string
          writeOnly: true
          description: >-
            The durable secret material to store. Write-only (one-way) - it is
            written to the configured secret manager at the secret source's
            server-derived convention path and never persisted in the database,
            logged, or returned on any read or upload response.
    SecretSource:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/ObjectReference'
        - type: object
          required:
            - name
            - agent_runtime_id
            - purpose
            - backend
          properties:
            name:
              type: string
            agent_runtime_id:
              type: string
            purpose:
              type: string
              description: Semantic purpose driving controller-generated env var wiring
            backend:
              type: string
              description: Secret backend type (vault, aws-secrets-manager, kubernetes)
            path:
              type: string
              description: Logical, mount-relative path to the secret in the backend. Derived server-side on create as hypershell/secret-sources/{agent_runtime_id}/{name}; a client-supplied path is ignored, and the field cannot be changed on update. When a value is submitted the path is the location the value was written to.
            key_mappings:
              type: string
              description: JSON-encoded mapping of backend secret keys to environment variable names
            value:
              type: string
              writeOnly: true
              description: Secret value to submit for storage. Write-only (one-way) - when present on create, the API server writes it to the configured secret manager at a deterministic location derived from the submission identity and then persists only this SecretSource reference; path is set server-side to that location. The value is never persisted in the database, never logged, and never returned on create, get, or list.
            repository_id:
              type: string
              readOnly: true
              description: Repository that owns this resource through the control-plane .hypershell import. Null for resources created directly through the REST API or hsctl apply. Set server-side; read-only in the client contract.
    SecretSourceList:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/List'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SecretSource'
    SecretSourcePatchRequest:
      type: object
      description: 'Mutable SecretSource fields. The path is not patchable: it is the server-derived location of the submitted material, and a path supplied here is ignored.'
      properties:
        name:
          type: string
        purpose:
          type: string
        backend:
          type: string
        path:
          type: string
          description: Ignored. The path is derived server-side on create and cannot be re-pointed.
        key_mappings:
          type: string
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: Page number of record list when record list exceeds specified page size
      schema:
        type: integer
        default: 1
        minimum: 1
      required: false
    size:
      name: size
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        default: 100
        minimum: 0
      required: false
    search:
      name: search
      in: query
      required: false
      description: Specifies the search criteria
      schema:
        type: string
    orderBy:
      name: orderBy
      in: query
      required: false
      description: Specifies the order by criteria
      schema:
        type: string
    fields:
      name: fields
      in: query
      required: false
      description: Supplies a comma-separated list of fields to be returned
      schema:
        type: string
