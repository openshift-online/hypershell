paths:
  /api/hypershell/v1/secret_sources:
    get:
      operationId: listSecretSources
      summary: Returns a list of secret sources
      security:
        - Bearer: []
      responses:
        '200':
          description: A JSON array of secret source objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSourceList'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/fields'
    post:
      operationId: createSecretSource
      summary: Create a new secret source
      security:
        - Bearer: []
      requestBody:
        description: SecretSource data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretSource'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
  /api/hypershell/v1/secret_sources/{id}:
    get:
      operationId: getSecretSource
      summary: Get a secret source by ID
      security:
        - Bearer: []
      responses:
        '200':
          description: SecretSource found by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSource'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No secret source with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    patch:
      operationId: updateSecretSource
      summary: Update a secret source
      security:
        - Bearer: []
      requestBody:
        description: Updated secret source data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretSourcePatchRequest'
      responses:
        '200':
          description: SecretSource updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No secret source with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    delete:
      operationId: deleteSecretSource
      summary: Delete a secret source
      security:
        - Bearer: []
      responses:
        '204':
          description: SecretSource deleted successfully
        '401':
          $ref: 'openapi.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: 'openapi.yaml#/components/responses/ForbiddenError'
        '404':
          description: No secret source with specified ID exists
          content:
            application/json:
              schema:
                $ref: 'openapi.yaml#/components/schemas/Error'
        '500':
          $ref: 'openapi.yaml#/components/responses/InternalServerError'
    parameters:
      - $ref: '#/components/parameters/id'
components:
  schemas:
    SecretSource:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/ObjectReference'
        - type: object
          required:
            - name
            - agent_runtime_id
            - purpose
            - backend
            - path
          properties:
            name:
              type: string
            agent_runtime_id:
              type: string
            purpose:
              type: string
              description: Semantic purpose driving controller-generated env var wiring
            backend:
              type: string
              description: Secret backend type (vault, aws-secrets-manager, kubernetes)
            path:
              type: string
              description: Path to the secret in the backend
            key_mappings:
              type: string
              description: JSON-encoded mapping of backend secret keys to environment variable names
    SecretSourceList:
      allOf:
        - $ref: 'openapi.yaml#/components/schemas/List'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SecretSource'
    SecretSourcePatchRequest:
      type: object
      properties:
        name:
          type: string
        purpose:
          type: string
        backend:
          type: string
        path:
          type: string
        key_mappings:
          type: string
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: Page number of record list when record list exceeds specified page size
      schema:
        type: integer
        default: 1
        minimum: 1
      required: false
    size:
      name: size
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        default: 100
        minimum: 0
      required: false
    search:
      name: search
      in: query
      required: false
      description: Specifies the search criteria
      schema:
        type: string
    orderBy:
      name: orderBy
      in: query
      required: false
      description: Specifies the order by criteria
      schema:
        type: string
    fields:
      name: fields
      in: query
      required: false
      description: Supplies a comma-separated list of fields to be returned
      schema:
        type: string
