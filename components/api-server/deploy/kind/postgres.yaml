apiVersion: v1
kind: Secret
metadata:
  name: hypershell-db
  namespace: hypershell
type: Opaque
stringData:
  db.host: hypershell-postgres
  db.port: "5432"
  db.name: hypershell
  db.user: postgres
  db.password: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: hypershell-postgres
  namespace: hypershell
spec:
  selector:
    app: hypershell-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hypershell-postgres
  namespace: hypershell
spec:
  serviceName: hypershell-postgres
  replicas: 1
  selector:
    matchLabels:
      app: hypershell-postgres
  template:
    metadata:
      labels:
        app: hypershell-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: hypershell
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
