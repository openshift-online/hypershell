# Must match GATEWAY_API_GATEWAY_NAMESPACE (default: openshift-ingress)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hypershell-gateway-manager
  namespace: openshift-ingress
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hypershell-gateway-manager
  namespace: openshift-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hypershell-gateway-manager
subjects:
  - kind: ServiceAccount
    name: hypershell-controller
    namespace: hypershell
