apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypershell-controller
  namespace: hypershell
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-controller
  namespace: hypershell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hypershell-controller
  template:
    metadata:
      labels:
        app: hypershell-controller
    spec:
      serviceAccountName: hypershell-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: controller
          image: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-control-plane-main@sha256:fb09ac10910766e6072a6c0fe2b0d9121898ef19001a07ab85303802ccef1705
          imagePullPolicy: Always
          env:
            - name: HYPERSHELL_GRPC_SERVER_ADDR
              value: "hypershell-api-server:9000"
            - name: HYPERSHELL_API_SERVER_URL
              value: "http://hypershell-api-server:8000"
            - name: HYPERSHELL_NAMESPACE
              value: "hypershell"
            - name: HYPERSHELL_LOG_LEVEL
              value: "info"
            - name: GATEWAY_API_BASE_DOMAIN
              value: "REPLACE_WITH_CLUSTER_BASE_DOMAIN"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
