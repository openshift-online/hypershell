apiVersion: v1
kind: Secret
metadata:
  name: hypershell-db
  namespace: hypershell
type: Opaque
stringData:
  db.host: hypershell-postgres
  db.port: "5432"
  db.name: hypershell
  db.user: hypershell
  db.password: hypershell
---
apiVersion: v1
kind: Service
metadata:
  name: hypershell-postgres
  namespace: hypershell
spec:
  selector:
    app: hypershell-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hypershell-postgres
  namespace: hypershell
spec:
  serviceName: hypershell-postgres
  replicas: 1
  selector:
    matchLabels:
      app: hypershell-postgres
  template:
    metadata:
      labels:
        app: hypershell-postgres
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-13@sha256:e98e67042d5b53f372231c1b9a2266afc4410664651d83c3224ab87ce3a2c4a9
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: hypershell
            - name: POSTGRESQL_PASSWORD
              value: hypershell
            - name: POSTGRESQL_DATABASE
              value: hypershell
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hypershell"]
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
