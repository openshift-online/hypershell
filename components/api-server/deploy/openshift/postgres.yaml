apiVersion: v1
kind: Secret
metadata:
  name: hypershell-db
  namespace: hypershell
type: Opaque
stringData:
  db.host: hypershell-postgres
  db.port: "5432"
  db.name: hypershell
  db.user: hypershell
  db.password: hypershell
---
apiVersion: v1
kind: Service
metadata:
  name: hypershell-postgres
  namespace: hypershell
spec:
  selector:
    app: hypershell-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hypershell-postgres
  namespace: hypershell
spec:
  serviceName: hypershell-postgres
  replicas: 1
  selector:
    matchLabels:
      app: hypershell-postgres
  template:
    metadata:
      labels:
        app: hypershell-postgres
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: postgres
          image: registry.access.redhat.com/hi/postgresql:18.4@sha256:9b1917bf15a3b3a6a99b94ab75db1bfde3f434990e881c69d527417d2c035a09
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: hypershell
            - name: POSTGRES_PASSWORD
              value: hypershell
            - name: POSTGRES_DB
              value: hypershell
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hypershell"]
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
