---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-gateway
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app.kubernetes.io/name: openshell
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: hypershell-control-plane
    hypershell.redhat.io/managed: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: openshell-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell
        app.kubernetes.io/instance: openshell-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/managed-by: hypershell-control-plane
        hypershell.redhat.io/managed: "true"
    spec:
      terminationGracePeriodSeconds: 5
      serviceAccountName: openshell-gateway
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: openshell-gateway
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/openshell/gateway.toml
            - --db-url
            - $(OPENSHELL_DB_URL)
          env:
            - name: OPENSHELL_DB_URL
              valueFrom:
                secretKeyRef:
                  name: openshell-gateway-db-credentials
                  key: url
            - name: OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: openshell-gateway-credential-kek
                  key: key-encryption-key
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/openshell
              readOnly: true
            - name: sandbox-jwt
              mountPath: /etc/openshell-jwt
              readOnly: true
            - name: tls-cert
              mountPath: /etc/openshell-tls/server
              readOnly: true
            - name: tls-client-ca
              mountPath: /etc/openshell-tls/client-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: gateway-config
          configMap:
            name: openshell-gateway-config
        - name: sandbox-jwt
          secret:
            secretName: openshell-gateway-jwt-keys
            defaultMode: 288
        - name: tls-cert
          secret:
            secretName: openshell-server-tls
            defaultMode: 288
        - name: tls-client-ca
          secret:
            secretName: openshell-client-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 288
        - name: tmp
          emptyDir: {}
