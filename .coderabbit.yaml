# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
inheritance: true
tone_instructions: >-
  Security-first. Be direct. Cite CWE/CVE IDs. No praise, no summaries.
  Treat dependency, CI/CD, IDE config, and .gitattributes changes as
  supply chain attack surfaces. Go-only K8s platform: API, Sentinel,
  Adapter, Broker.

reviews:
  profile: chill
  # No PR summary, walkthrough, or status comments: reviews run through
  # internal agents (#175). Explicit values override the org-level config
  # that `inheritance: true` pulls in.
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  review_status: false
  review_info: false
  review_details: false
  review_progress: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  request_changes_workflow: false
  enable_prompt_for_ai_agents: true

  slop_detection:
    enabled: true

  # Exclude generated, vendored, and lock files from review entirely.
  # See https://docs.coderabbit.ai/guides/review-instructions#path-filtering
  path_filters:
    - "!**/vendor/**"
    - "!**/zz_generated*"
    - "!**/go.sum"
    
##  disable auto reviews as per https://redhat.atlassian.net/browse/HYPERSHELL-28
  auto_review:
    enabled: false   
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE
    labels:
      - "!do-not-merge/work-in-progress"
      - "!do-not-merge/hold"

  # Pre-merge checks off. The "Ai-Attribution" check is inherited from the
  # org-level config; redefining it here with mode off disables it.
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "Ai-Attribution"
        mode: "off"
        instructions: "Disabled in this repository."
