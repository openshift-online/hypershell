---
# ingest harness - bidirectional Jira <-> GitHub intake.
# Ensures every in-scope work item of either origin ends as a canonically linked
# Jira-and-GitHub pair. Runs BEFORE triage. Needs Jira SA credentials.
agent: agents/ingest.md
description: "Link Jira and GitHub execution records (bidirectional, origin-agnostic)"
role: coder
slug: fullsend-ingest
image: quay.io/redhat-user-workloads/hcm-eng-prod-tenant/hypershell-main/hypershell-fullsend-sandbox-main@sha256:373911325896e430b278a6d68885ac87a304542da58d03452f343a4500801fe1
policy: policies/base.yaml
providers:
  - vertex-ai
  - github
  - package-registries
host_files:
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
model: claude-sonnet-5
effort: high
env:
  runner:
    FULLSEND_FORGE: github
    GH_TOKEN: ${GH_TOKEN}
    REPOSITORY: ${REPOSITORY}
  sandbox:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    COREPACK_HOME: /sandbox/.cache/corepack
    FULLSEND_FORGE: github
    CLAUDE_CODE_USE_VERTEX: "1"
    ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    CLOUD_ML_REGION: ${CLOUD_ML_REGION}
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/.gcp-credentials.json
    REPOSITORY: ${REPOSITORY}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    GITHUB_REPO_URL: https://github.com/${REPOSITORY}
    LABEL_SCOPE: ${LABEL_SCOPE}
    TRUSTED_BRANCH: main
    DRY_RUN: ${DRY_RUN}
    JIRA_BASE_URL: https://redhat.atlassian.net
    JIRA_EMAIL: ${JIRA_EMAIL}
    JIRA_API_TOKEN: ${JIRA_API_TOKEN}
validation_loop:
  script: scripts/validate-lifecycle.sh
  max_iterations: 1
timeout_minutes: 30
trigger: |
  event.transition.kind == "label_changed"
    && event.transition.label.action == "added"
    && (event.transition.label.name == "agent/allowed")
    && event.entity.kind == "work_item"
    && event.state.labels.exists(l, l == "agent/scope/hyp0")
    && !event.state.labels.exists(l, l == "agent/execution-record")
