---
# reconcile harness - bidirectional Jira <-> GitHub phase reconciliation.
# Projects GitHub label phase state to Jira status, syncs artifact remote links,
# posts attributed phase comments, preserves credit. Runs AFTER each phase
# transition. Needs Jira SA credentials.
agent: agents/reconcile.md
description: "Sync phase state from GitHub labels to Jira status"
role: coder
slug: fullsend-reconcile
image: ghcr.io/fullsend-ai/fullsend-sandbox@sha256:bcf8cd84a37623d761d38f2a6f51d20283f8798b7d3eeb9c509a2503c074bd55
policy: policies/base.yaml
providers:
  - vertex-ai
  - github
host_files:
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
model: claude-sonnet-5
effort: high
env:
  runner:
    FULLSEND_FORGE: github
    GH_TOKEN: ${GH_TOKEN}
    REPOSITORY: ${REPOSITORY}
  sandbox:
    FULLSEND_FORGE: github
    CLAUDE_CODE_USE_VERTEX: "1"
    ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    CLOUD_ML_REGION: ${CLOUD_ML_REGION}
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/.gcp-credentials.json
    REPOSITORY: ${REPOSITORY}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    GITHUB_REPO_URL: https://github.com/${REPOSITORY}
    LABEL_SCOPE: ${LABEL_SCOPE}
    TRUSTED_BRANCH: main
    DRY_RUN: ${DRY_RUN}
    GITHUB_ISSUE_URL: ${FULLSEND_WORK_ITEM_URL}
    ISSUE_NUMBER: ${ISSUE_NUMBER}
    GITHUB_PR_URL: ${PR_URL}
    PR_NUMBER: ${PR_NUMBER}
    JIRA_BASE_URL: https://redhat.atlassian.net
    JIRA_EMAIL: ${JIRA_EMAIL}
    JIRA_API_TOKEN: ${JIRA_API_TOKEN}
timeout_minutes: 15
trigger: |
  event.transition.kind == "label_changed"
    && event.transition.label.action == "added"
    && (event.transition.label.name == "agent/workable"
        || event.transition.label.name == "agent/reviewable-spec"
        || event.transition.label.name == "agent/review-spec-approved"
        || event.transition.label.name == "agent/review-spec-rejected"
        || event.transition.label.name == "agent/reviewable-code"
        || event.transition.label.name == "agent/review-code-approved"
        || event.transition.label.name == "agent/review-code-rejected"
        || event.transition.label.name == "agent/release-pending"
        || event.transition.label.name == "agent/release-verified")
    && event.entity.kind == "work_item"
    && event.state.labels.exists(l, l == "agent/scope/hyp0")
