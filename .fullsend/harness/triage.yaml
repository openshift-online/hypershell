---
# triage harness (ported from run.sh; hyp0: Vertex via ADC, github provider, no mint).
agent: agents/triage.md
description: "Triage and label new issues"
role: triage
slug: fullsend-triage
image: quay.io/redhat-user-workloads/hcm-eng-prod-tenant/hypershell-main/hypershell-fullsend-sandbox-main@sha256:373911325896e430b278a6d68885ac87a304542da58d03452f343a4500801fe1
policy: policies/base.yaml
providers:
  - vertex-ai
  - github
  - package-registries
host_files:
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
model: claude-sonnet-5
effort: high
# Lifecycle hooks (SDLC-HOOK): the pre-script records starting state and may skip
# the run; the agent writes only a validated result; the post-script applies the
# label transition and verifies it. Phase labels are written by the post-script,
# never by the agent.
pre_script: scripts/pre-lifecycle.sh
post_script: scripts/post-lifecycle.sh
validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/triage-result.schema.json
  max_iterations: 2
  preflight_check: python3 -c "import jsonschema"
env:
  runner:
    FULLSEND_FORGE: github
    GH_TOKEN: ${GH_TOKEN}
    REPOSITORY: ${REPOSITORY}
    PHASE: triage
    ISSUE_URL: ${FULLSEND_WORK_ITEM_URL}
    LABEL_SCOPE: ${LABEL_SCOPE}
    DRY_RUN: ${DRY_RUN}
  sandbox:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    COREPACK_HOME: /sandbox/.cache/corepack
    FULLSEND_FORGE: github
    CLAUDE_CODE_USE_VERTEX: "1"
    ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    CLOUD_ML_REGION: ${CLOUD_ML_REGION}
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/.gcp-credentials.json
    REPOSITORY: ${REPOSITORY}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    GITHUB_REPO_URL: https://github.com/${REPOSITORY}
    LABEL_SCOPE: ${LABEL_SCOPE}
    TRUSTED_BRANCH: main
    DRY_RUN: ${DRY_RUN}
    PHASE: triage
    GITHUB_ISSUE_URL: ${FULLSEND_WORK_ITEM_URL}
    ISSUE_NUMBER: ${ISSUE_NUMBER}
timeout_minutes: 30
trigger: |
  event.transition.kind == "label_changed"
    && event.transition.label.action == "added"
    && (event.transition.label.name == "agent/allowed")
    && event.entity.kind == "work_item"
    && event.state.labels.exists(l, l.startsWith("agent/scope/"))
    && !event.state.labels.exists(l, l == "agent/workable")
    && !event.state.labels.exists(l, l == "agent/needs-input")
    && !event.state.labels.exists(l, l == "agent/duplicate")
