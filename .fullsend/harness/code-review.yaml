---
# code-review harness (ported from run.sh; hyp0: Vertex via ADC, github provider, no mint).
agent: agents/code-review.md
description: "Review the code changes on the work item's pull request and record a verdict"
role: review
slug: fullsend-code-review
image: quay.io/redhat-user-workloads/hcm-eng-prod-tenant/hypershell-main/hypershell-fullsend-sandbox-main@sha256:373911325896e430b278a6d68885ac87a304542da58d03452f343a4500801fe1
policy: policies/base.yaml
providers:
  - vertex-ai
  - github
  - package-registries
host_files:
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
model: claude-sonnet-5
effort: high
# Lifecycle hooks (SDLC-HOOK): the pre-script records starting state (including
# the PR head commit) and may skip the run; the agent writes only a validated
# result; the post-script checks evidence (stale head, required checks), applies
# the verdict transition, and verifies it. Phase labels are written by the
# post-script, never by the agent.
pre_script: scripts/pre-lifecycle.sh
post_script: scripts/post-lifecycle.sh
validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/code-review-result.schema.json
  max_iterations: 2
  # Declare the review harness runner tools (SDLC-HOOK-11): python3+jsonschema for
  # read-only validation, and the fullsend CLI the post-script requires to post the
  # verdict review comment. A missing fullsend fails fast here with a clear message
  # instead of wedging every verdict in the post-script's required-comment loop.
  preflight_check: 'python3 -c "import jsonschema" && command -v fullsend >/dev/null 2>&1 || { echo "code-review harness needs python3 jsonschema (validation) and the fullsend CLI (verdict review comment) on the runner" >&2; exit 1; }'
env:
  runner:
    FULLSEND_FORGE: github
    GH_TOKEN: ${GH_TOKEN}
    REPOSITORY: ${REPOSITORY}
    PHASE: code-review
    ISSUE_URL: ${FULLSEND_WORK_ITEM_URL}
    LABEL_SCOPE: ${LABEL_SCOPE}
    DRY_RUN: ${DRY_RUN}
    PR_NUMBER: ${PR_NUMBER}
  sandbox:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    COREPACK_HOME: /sandbox/.cache/corepack
    FULLSEND_FORGE: github
    CLAUDE_CODE_USE_VERTEX: "1"
    ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    CLOUD_ML_REGION: ${CLOUD_ML_REGION}
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/.gcp-credentials.json
    REPOSITORY: ${REPOSITORY}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    GITHUB_REPO_URL: https://github.com/${REPOSITORY}
    LABEL_SCOPE: ${LABEL_SCOPE}
    TRUSTED_BRANCH: main
    DRY_RUN: ${DRY_RUN}
    PHASE: code-review
    GITHUB_ISSUE_URL: ${FULLSEND_WORK_ITEM_URL}
    ISSUE_NUMBER: ${ISSUE_NUMBER}
    GITHUB_PR_URL: ${PR_URL}
    PR_NUMBER: ${PR_NUMBER}
timeout_minutes: 30
trigger: |
  event.transition.kind == "label_changed"
    && event.transition.label.action == "added"
    && (event.transition.label.name == "agent/reviewable-code")
    && event.entity.kind == "work_item"
    && event.state.labels.exists(l, l.startsWith("agent/scope/"))
    && !event.state.labels.exists(l, l == "agent/review-code-approved")
    && !event.state.labels.exists(l, l == "agent/review-code-rejected")
