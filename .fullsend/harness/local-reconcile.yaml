---
# Local lifecycle job, scheduled explicitly by funnel-dispatch.
agent: agents/reconcile.md
description: "Local SDLC reconcile"
role: triage
slug: fullsend-reconcile
image: quay.io/redhat-user-workloads/hcm-eng-prod-tenant/hypershell-main/hypershell-fullsend-sandbox-main@sha256:373911325896e430b278a6d68885ac87a304542da58d03452f343a4500801fe1
policy: policies/base.yaml
providers:
  - vertex-ai
  - github
  - package-registries
  - providers/funnel-jira.yaml
openshell:
  profiles:
    - profiles/funnel-jira.yaml
host_files:
  - src: ${FUNNEL_JIRA_CREDENTIALS_FILE}
    dest: /tmp/.jira-credentials.json
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
model: claude-sonnet-5
effort: high
env:
  runner:
    FULLSEND_FORGE: github
    GH_TOKEN: ${GH_TOKEN}
    REPOSITORY: ${REPOSITORY}
  sandbox:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    COREPACK_HOME: /sandbox/.cache/corepack
    FULLSEND_FORGE: github
    CLAUDE_CODE_USE_VERTEX: "1"
    ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID}
    CLOUD_ML_REGION: ${CLOUD_ML_REGION}
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/.gcp-credentials.json
    REPOSITORY: ${REPOSITORY}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    GITHUB_REPO_URL: https://github.com/${REPOSITORY}
    LABEL_SCOPE: ${LABEL_SCOPE}
    TRUSTED_BRANCH: main
    DRY_RUN: ${DRY_RUN}
    GITHUB_ISSUE_URL: ${FULLSEND_WORK_ITEM_URL}
    ISSUE_NUMBER: ${ISSUE_NUMBER}
    PREVIOUS_PHASE: ${FUNNEL_PREVIOUS_PHASE}
    JIRA_BASE_URL: ${JIRA_BASE_URL}
    JIRA_CREDENTIALS_FILE: /tmp/.jira-credentials.json
validation_loop:
  script: scripts/validate-lifecycle.sh
  max_iterations: 1
trigger: 'false'
timeout_minutes: 30
